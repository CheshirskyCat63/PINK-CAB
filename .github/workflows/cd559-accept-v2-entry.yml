name: CD-952 Verify Administrative Review Corrections
on:
  push:
    branches: [ops/CD-559-restore-playable-entry-20261003]
    paths: [.github/workflows/cd559-accept-v2-entry.yml]
permissions:
  contents: write
concurrency:
  group: pinkcab-accepted-v2-entry
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'CheshirskyCat63/PINK-CAB' && github.actor == 'CheshirskyCat63'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact reviewed docs candidate
        uses: actions/checkout@v4
        with:
          ref: 3c4e078383f6f110b2975aca8356a8bd0cd6a058
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Correct two independently verified review findings
        shell: python
        run: |
          import csv,io,json,os,subprocess
          from pathlib import Path
          root=Path.cwd();report=Path(os.environ['RUNNER_TEMP'])/'CD952_REVIEW';report.mkdir()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('DOC_REPORT='+str(report)+'\n')
          changed=[]
          paths=['docs/CONTROL_PLANE.md','docs/FAST_DELIVERY_ENTRYPOINT.md','docs/PINK_CAB_ACTIVE_BASELINE.md','docs/PROGRAM_ROADMAP.md','docs/README.md']
          old='Direct CD-869 dispatch and retired local fast-delivery cannot bypass P02.'
          new='Policy permits only P02-mediated owner-test delivery. The legacy direct CD-869 workflow_dispatch trigger still exists and does not verify upstream P02 attestation; direct dispatch is prohibited by policy, not technically prevented. Closing that trigger/attestation gap remains CD-559 engineering. The retired local fast-delivery script refuses mutation.'
          def save(name,before,after):
              assert before!=after
              for folder,text in [('before',before),('after',after)]:
                  p=report/folder/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(text.encode())
              (root/name).write_bytes(after.encode());changed.append(name)
          for name in paths:
              before=(root/name).read_text(encoding='utf-8');assert before.count(old)==1
              save(name,before,before.replace(old,new))
          name='docs/vehicle_physics/TASKS.csv';before=(root/name).read_text(encoding='utf-8');reader=csv.DictReader(io.StringIO(before));fields=reader.fieldnames;rows=list(reader)
          row=next(x for x in rows if x['ID']=='PHY-013');assert row['Status']=='DONE'
          row['Status']='IN_PROGRESS'
          row['Evidence']='P03/V2 and bounded P04 are owner accepted, but this task keeps its full declared criteria: T-025 PASS; T-026 low/urban/high-speed deliberate countersteer remains NOT RUN. Preserve accepted behavior; do not claim full PHY-013 closure or authorize downstream scope from this incomplete criterion. Coordinator37148042881 / delivery37149462470 / owner receipt37152180059.'
          out=io.StringIO(newline='');w=csv.DictWriter(out,fieldnames=fields,lineterminator='\n');w.writeheader();w.writerows(rows);save(name,before,out.getvalue())
          tests=list(csv.DictReader(io.StringIO((root/'docs/vehicle_physics/TESTS.csv').read_text())))
          assert len(rows)==48 and len(tests)==96
          assert next(x for x in tests if x['ID']=='T-026')['Status']=='NOT RUN'
          for task in rows:
              if task['Stage']=='P03' and task['Status']=='DONE':assert all(t['Status']=='PASS' for t in tests if t['Task']==task['ID']),task['ID']
          assert len(changed)==6
          subprocess.run(['git','diff','--check'],check=True)
          (report/'CHANGED.json').write_text(json.dumps(changed),encoding='utf-8')
          print('REVIEW_CORRECTIONS=PASS; no runtime or acceptance criteria changed')
      - name: Recheck entire script suite and architecture
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python scripts/code_health.py --root . --policy Config/CodeHealthPolicy.json --require-zero-debt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Export verified immutable blobs without modifying refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib,json,os,urllib.request
          from pathlib import Path
          report=Path(os.environ['DOC_REPORT']);paths=json.loads((report/'CHANGED.json').read_text());files=[]
          for name in paths:
              data=Path(name).read_bytes();body=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/CheshirskyCat63/PINK-CAB/git/blobs',data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req) as response:blob=json.load(response)
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest();assert expected==blob['sha']
              files.append({'path':name,'mode':'100644','type':'blob','sha':expected,'sha256':hashlib.sha256(data).hexdigest()})
          receipt={'base':'3c4e078383f6f110b2975aca8356a8bd0cd6a058','base_tree':'938ec52596c10b0204e153a0eec0adbd2f84eeee','files':files,'all_script_tests_passed':True,'refs_changed':False,'runtime_changed':False}
          (report/'PATCH.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8');print(json.dumps(receipt))
      - name: Preserve verified review correction
        if: always() && env.DOC_REPORT != ''
        uses: actions/upload-artifact@v4
        with:
          name: p04-admin-review-corrections-${{ github.run_id }}
          path: ${{ env.DOC_REPORT }}
          if-no-files-found: error
          retention-days: 90
