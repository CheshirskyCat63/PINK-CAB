name: CD-559 Desktop Publication Contract Verification
on:
  push:
    branches: [ops/CD-559-restore-playable-entry-20261003]
    paths: [.github/workflows/cd559-accept-v2-entry.yml]
permissions:
  contents: read
concurrency:
  group: pinkcab-accepted-v2-entry
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'CheshirskyCat63/PINK-CAB' && github.actor == 'CheshirskyCat63'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Exercise actual .NET atomic replacement without touching any desktop
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('PINCKCAB-Replacement-'+[Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          $results=@()
          foreach($mode in @('NullArgument','ExplicitSameVolumeBackup','NullStringArgument')){
            $dir=Join-Path $root $mode
            New-Item -ItemType Directory -Path $dir | Out-Null
            $source=Join-Path $dir 'candidate.lnk'
            $destination=Join-Path $dir 'PINCKCAB.lnk'
            $backup=Join-Path $dir 'previous.lnk'
            [IO.File]::WriteAllText($source,'new-verified-candidate')
            [IO.File]::WriteAllText($destination,'previous-accepted-candidate')
            $ok=$false; $errorText=''
            try {
              if($mode -eq 'NullArgument'){[IO.File]::Replace($source,$destination,$null)}
              elseif($mode -eq 'NullStringArgument'){[IO.File]::Replace($source,$destination,[System.Management.Automation.Language.NullString]::Value)}
              else {[IO.File]::Replace($source,$destination,$backup)}
              $ok=([IO.File]::ReadAllText($destination) -eq 'new-verified-candidate') -and -not (Test-Path -LiteralPath $source)
              if($mode -eq 'ExplicitSameVolumeBackup'){$ok=$ok -and ([IO.File]::ReadAllText($backup) -eq 'previous-accepted-candidate')}
            } catch {$errorText=$_.Exception.Message}
            $results+=@{mode=$mode;passed=$ok;error=$errorText;destination=[IO.File]::ReadAllText($destination);sourceRetained=(Test-Path -LiteralPath $source);backupRetained=(Test-Path -LiteralPath $backup)}
          }
          @{psVersion=$PSVersionTable.PSVersion.ToString();runtime=[Environment]::Version.ToString();testLocation='isolated-hosted-runner-temp';userDesktopTouched=$false;results=$results} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root 'replacement-tests.json') -Encoding UTF8
          "REPLACEMENT_TESTS=$root" | Out-File $env:GITHUB_ENV -Append
          $results | ConvertTo-Json -Depth 5 | Write-Host
          foreach($mode in @('ExplicitSameVolumeBackup','NullStringArgument')){
            if(-not ($results | Where-Object {$_.mode -eq $mode}).passed){throw ('Corrected atomic replacement contract failed: '+$mode)}
          }
      - name: Preserve isolated test report
        if: always() && env.REPLACEMENT_TESTS != ''
        uses: actions/upload-artifact@v4
        with:
          name: pinckcab-publication-contract-${{ github.run_id }}
          path: ${{ env.REPLACEMENT_TESTS }}/replacement-tests.json
          retention-days: 14
          if-no-files-found: error
