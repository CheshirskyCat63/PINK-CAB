name: CD-559 Recovered P04 Source Qualification
on:
  push:
    branches: [ops/CD-559-restore-playable-entry-20261003]
    paths: [.github/workflows/cd559-accept-v2-entry.yml]
permissions:
  contents: read
concurrency:
  group: pinkcab-accepted-v2-entry
  cancel-in-progress: false
jobs:
  qualification:
    if: github.repository == 'CheshirskyCat63/PINK-CAB' && github.actor == 'CheshirskyCat63'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact normalized P04 source on isolated hosted Windows
        uses: actions/checkout@v4
        with:
          ref: 52239b61bc80e5a63716b9b09b87c520fa09fd05
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove normalization and complete script regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          if($LASTEXITCODE -ne 0){throw 'Workflow parser install failed'}
          python scripts/ci/acceptance_contract.py workspace --sha 52239b61bc80e5a63716b9b09b87c520fa09fd05
          if($LASTEXITCODE -ne 0){throw 'Fresh exact source is not clean'}
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
          if($LASTEXITCODE -ne 0){throw 'Complete script regression failed'}
          python scripts/code_health.py --root . --policy Config/CodeHealthPolicy.json --require-zero-debt
          if($LASTEXITCODE -ne 0){throw 'Code health failed'}
          python scripts/ci/verify_vehicle_physics_writers.py --manifest docs/vehicle_physics/STATE_WRITER_INVENTORY.csv --evidence Saved/GitHubGate/RECOVERY_WRITERS.json
          if($LASTEXITCODE -ne 0){throw 'Vehicle authority inventory failed'}
          Write-Host 'RECOVERED_P04_SOURCE_QUALIFICATION=PASS; Unreal and human acceptance are separate'
