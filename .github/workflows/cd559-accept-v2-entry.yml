name: CD-952 Finish Clean Checkout and Accepted Entry
on:
  push:
    branches: [ops/CD-559-restore-playable-entry-20261003]
    paths: [.github/workflows/cd559-accept-v2-entry.yml]
permissions:
  contents: read
concurrency:
  group: pinkcab-accepted-v2-entry
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'CheshirskyCat63/PINK-CAB' && github.actor == 'CheshirskyCat63'
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 5
    env:
      GIT_OPTIONAL_LOCKS: '0'
      PSModulePath: 'C:\WINDOWS\system32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules'
    steps:
      - name: Preserve only identified cooker output and export existing administrative sources
        shell: python
        run: |
          import hashlib,json,os,shutil,subprocess,zipfile
          from pathlib import Path
          root=Path(r'E:\CHESHIRE_DIVISION\GitHubRunner\PINK-CAB\actions-runner\_work\PINK-CAB\PINK-CAB')
          base=Path(r'E:\CHESHIRE_DIVISION\Artifacts\PINKCAB\Acceptance')
          out=base/('CD952_FINAL_'+os.environ['GITHUB_RUN_ID']);out.mkdir()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('ADMIN_REPORT='+str(out)+'\n')
          def git(*args):return subprocess.run(['git','-C',str(root),*args],check=True,capture_output=True).stdout
          assert git('rev-parse','HEAD').decode().strip()=='52239b61bc80e5a63716b9b09b87c520fa09fd05'
          assert not git('status','--porcelain','--untracked-files=all').strip()
          old=base/'CD952_RECONCILE_37152421485_1/delivery-derived-originals.zip'
          with zipfile.ZipFile(old) as z:
              assert z.testzip() is None
              names=[n for n in z.namelist() if n.startswith('working/')]
              count=len([x for x in z.read('status.z').split(b'\0') if x])
          kept=[]
          for rel in ['Build/Windows/FileOpenOrder/CookerOpenOrder.log','Build/Windows/FileOpenOrder/EditorOpenOrder.log']:
              path=root/rel
              if path.exists():
                  assert not git('ls-files','--',rel).strip();git('check-ignore','--',rel)
                  data=path.read_bytes();dest=out/path.name;shutil.move(str(path),str(dest))
                  assert dest.read_bytes()==data
                  kept.append({'path':rel,'sha256':hashlib.sha256(data).hexdigest(),'preserved_as':str(dest)})
          result=subprocess.run(['python','scripts/ci/acceptance_contract.py','workspace','--sha','52239b61bc80e5a63716b9b09b87c520fa09fd05'],cwd=root,capture_output=True,text=True)
          (out/'WORKSPACE_GATE.txt').write_text(result.stdout+result.stderr,encoding='utf-8');print(result.stdout);result.check_returncode()
          sources=['README.md','docs/PROJECT_SETUP.md','docs/ENGINEERING_START_HERE.md','docs/CONTROL_PLANE.md','docs/FAST_DELIVERY_ENTRYPOINT.md','docs/AUTHORITY.yaml','docs/README.md']
          sources += git('ls-files','docs/vehicle_physics/*.md','docs/vehicle_physics/*.csv').decode().splitlines()
          sources += ['scripts/ci/acceptance_contract.py']
          for rel in sorted(set(sources)):
              data=git('show','HEAD:'+rel);p=out/'sources'/rel;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          with old.open('rb') as f:old_hash=hashlib.file_digest(f,'sha256').hexdigest()
          (out/'RECONCILIATION.json').write_text(json.dumps({'runner_clean':True,'guard_passed':True,'preserved_tracked_changes':count,'preserved_derived_files':len(names),'previous_archive':str(old),'previous_archive_sha256':old_hash,'ignored_cooker_logs':kept,'source_sha':'52239b61bc80e5a63716b9b09b87c520fa09fd05'},indent=2),encoding='utf-8')
      - name: Keep one play shortcut and clearly named prior accepted fallback
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $desktop='C:\Users\CheCat\Desktop';$studio=Join-Path $desktop 'CHESHIRE_STUDIO'
          $accepted='E:\CHESHIRE_DIVISION\Builds\PINKCAB\CD869_ENDLESS_52239b61_RUN37149462470_ATTEMPT1\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $v2='E:\CHESHIRE_DIVISION\Builds\PINKCAB\CD869_ENDLESS_edf75e1b_RUN37117735294\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $p02='E:\CHESHIRE_DIVISION\Builds\PINKCAB\CD869_ENDLESS_8d68e456_RUN36868646970\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $ws=New-Object -ComObject WScript.Shell;$entry=Join-Path $desktop 'PINCKCAB.lnk'
          if($ws.CreateShortcut($entry).TargetPath -ne $accepted -or -not (Test-Path $accepted) -or -not (Test-Path $v2)){throw 'Accepted target mismatch'}
          $known=@{'PINKCAB_Accepted.lnk'=$v2;'PINKCAB_Play.lnk'=$p02;'PINKCAB_Test.lnk'=$v2}
          foreach($name in $known.Keys){$p=Join-Path $studio $name;if(Test-Path $p){if($ws.CreateShortcut($p).TargetPath -ne $known[$name]){throw 'Unexpected studio link'}}}
          $backup=Join-Path $env:ADMIN_REPORT 'shortcut-originals';New-Item -ItemType Directory -Path $backup | Out-Null
          Copy-Item $entry (Join-Path $backup 'PINCKCAB-before.lnk')
          $temp=Join-Path $desktop ('PINCKCAB.'+[Guid]::NewGuid().ToString('N')+'.tmp.lnk');Copy-Item $entry $temp
          $link=$ws.CreateShortcut($temp);$link.Description='PINCKCAB - OWNER ACCEPTED P04 52239b61; delivery 37149462470; prior accepted V2 retained';$link.Save()
          [IO.File]::Replace($temp,$entry,[System.Management.Automation.Language.NullString]::Value)
          foreach($name in @('PINKCAB_Play.lnk','PINKCAB_Test.lnk')){$p=Join-Path $studio $name;if(Test-Path $p){Move-Item $p (Join-Path $backup $name)}}
          $old=Join-Path $studio 'PINKCAB_Accepted.lnk';$rollback=Join-Path $studio 'PINKCAB_Rollback_V2.lnk'
          if(Test-Path $old){if(Test-Path $rollback){throw 'Rollback already exists'};Copy-Item $old (Join-Path $backup 'PINKCAB_Accepted-before.lnk');Move-Item $old $rollback}
          if($ws.CreateShortcut($entry).TargetPath -ne $accepted -or $ws.CreateShortcut($rollback).TargetPath -ne $v2){throw 'Final target readback failed'}
          $rows=@(foreach($dir in @($desktop,'C:\Users\Public\Desktop',$studio)){foreach($f in @(Get-ChildItem $dir -Filter '*.lnk' -File | Where-Object {$_.BaseName -match '(?i)PIN[CK ]*CAB'})){$s=$ws.CreateShortcut($f.FullName);[pscustomobject]@{path=$f.FullName;target=$s.TargetPath;description=$s.Description}}})
          $rows | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:ADMIN_REPORT 'DESKTOP_FINAL.json') -Encoding UTF8
          Write-Host 'ACCEPTED_PINCKCAB_AND_NAMED_ROLLBACK=PASS'
      - name: Export admin inputs and preservation receipts without asset binaries
        if: always() && env.ADMIN_REPORT != ''
        uses: actions/upload-artifact@v4
        with:
          name: p04-admin-inputs-${{ github.run_id }}
          path: ${{ env.ADMIN_REPORT }}
          if-no-files-found: error
          retention-days: 90
