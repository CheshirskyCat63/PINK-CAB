name: CD-559 Read-only P04 Recovery Diagnosis
on:
  push:
    branches: [ops/CD-559-restore-playable-entry-20261003]
    paths: [.github/workflows/cd559-accept-v2-entry.yml]
permissions:
  contents: read
concurrency:
  group: pinkcab-accepted-v2-entry
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'CheshirskyCat63/PINK-CAB' && github.actor == 'CheshirskyCat63'
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 5
    env:
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - name: Read workspace provenance, runtime processes and PINCKCAB targets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='E:\CHESHIRE_DIVISION\GitHubRunner\PINK-CAB\actions-runner\_work\PINK-CAB\PINK-CAB'
          if(-not (Test-Path -LiteralPath (Join-Path $root '.git'))){throw 'Expected runner checkout missing'}
          Write-Host ('DIAGNOSTIC_TIME_UTC='+[DateTime]::UtcNow.ToString('o'))
          Write-Host 'WORKSPACE_HEAD'
          git -C $root rev-parse HEAD
          if($LASTEXITCODE -ne 0){throw 'Cannot read checkout HEAD'}
          Write-Host 'WORKSPACE_PORCELAIN_BEGIN'
          git -C $root status --porcelain=v1 --untracked-files=all
          if($LASTEXITCODE -ne 0){throw 'Cannot inspect checkout status'}
          Write-Host 'WORKSPACE_PORCELAIN_END'
          Write-Host 'WORKSPACE_DIFF_STAT'
          git -C $root diff --stat
          Write-Host 'GAME_ENGINE_PROCESSES'
          Get-CimInstance Win32_Process | Where-Object {$_.Name -match '^(UnrealEditor(-Cmd)?|UnrealBuildTool|AutomationTool|PinkCab|Kukuruza)(\.exe)?$'} | Select-Object Name,ProcessId,ParentProcessId,ExecutablePath,CommandLine | ConvertTo-Json -Depth 3
          $ws=New-Object -ComObject WScript.Shell
          Write-Host 'PINKCAB_SHORTCUTS'
          foreach($desktop in @('C:\Users\CheCat\Desktop','C:\Users\Public\Desktop')){
            Get-ChildItem -LiteralPath $desktop -Filter '*.lnk' -File -ErrorAction SilentlyContinue | Where-Object {$_.BaseName -match '(?i)pin[ck]*\s*cab|pink.*cab'} | ForEach-Object {
              $link=$ws.CreateShortcut($_.FullName)
              [pscustomobject]@{path=$_.FullName;target=$link.TargetPath;arguments=$link.Arguments;targetExists=(Test-Path -LiteralPath $link.TargetPath)} | ConvertTo-Json -Compress
            }
          }
          Write-Host 'RECENT_BUILD_DIRECTORIES'
          Get-ChildItem -LiteralPath 'E:\CHESHIRE_DIVISION\Builds\PINKCAB' -Directory | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 8 Name,LastWriteTimeUtc | Format-Table -AutoSize
          Write-Host 'READ_ONLY_DIAGNOSIS_COMPLETE'
