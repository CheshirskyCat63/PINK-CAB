name: CD-952 P04 Owner Acceptance and Closeout Inspection
on:
  push:
    branches: [ops/CD-559-restore-playable-entry-20261003]
    paths: [.github/workflows/cd559-accept-v2-entry.yml]
permissions:
  contents: read
concurrency:
  group: pinkcab-accepted-v2-entry
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'CheshirskyCat63/PINK-CAB' && github.actor == 'CheshirskyCat63'
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 5
    env:
      GIT_OPTIONAL_LOCKS: '0'
      PSModulePath: 'C:\WINDOWS\system32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules'
    steps:
      - name: Verify accepted payload and preserve additive owner decision
        shell: python
        run: |
          import datetime, hashlib, json, os, subprocess
          from pathlib import Path
          base=Path(r'E:\CHESHIRE_DIVISION')
          root=base/'GitHubRunner/PINK-CAB/actions-runner/_work/PINK-CAB/PINK-CAB'
          main=base/'Games/PINK-CAB'
          delivery=base/'Builds/PINKCAB/CD869_ENDLESS_52239b61_RUN37149462470_ATTEMPT1'
          fallback=base/'Builds/PINKCAB/CD869_ENDLESS_edf75e1b_RUN37117735294'
          sha='52239b61bc80e5a63716b9b09b87c520fa09fd05'
          report=base/'Artifacts/PINKCAB/Acceptance'/('CD952_'+os.environ['GITHUB_RUN_ID']+'_'+os.environ['GITHUB_RUN_ATTEMPT'])
          report.mkdir(parents=True,exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream: stream.write('ACCEPTANCE_REPORT='+str(report)+'\n')
          def digest(path):
              with path.open('rb') as stream: return hashlib.file_digest(stream,'sha256').hexdigest()
          manifest=json.loads((delivery/'PACKAGE_MANIFEST.json').read_text(encoding='utf-8-sig'))
          assert manifest['candidateSha']==sha and str(manifest['deliveryRun'])=='37149462470'
          payload=delivery/'Windows'
          expected={item['path']:item for item in manifest['files']}
          actual={p.relative_to(payload).as_posix():p for p in payload.rglob('*') if p.is_file() and 'saved' not in [s.lower() for s in p.relative_to(payload).parts]}
          assert len(expected)==len(manifest['files'])==53 and set(expected)==set(actual)
          for name,path in actual.items():
              assert path.stat().st_size==expected[name]['bytes'] and digest(path)==expected[name]['sha256'], name
          fallback_exe=fallback/'Windows/PinkCab/Binaries/Win64/PinkCab.exe'
          assert fallback_exe.is_file()
          original=root/'Saved/GitHubGate/Delivery_37149462470_1'
          for name in ('HANDOFF.json','PACKAGE_MANIFEST.json','PINCKCAB.previous.lnk','HUMAN_LAUNCH.log'):
              p=original/name
              if p.is_file(): (report/name).write_bytes(p.read_bytes())
          record={'schema':1,'status':'HUMAN_ACCEPTED','scope':'P04 measured gearing candidate, not full vehicle or release acceptance','candidate_sha':sha,'delivery_run':'37149462470','delivery_attempt':1,'pull_request':62,'administrative_issue':'CD-952','owner_decision_date':'2026-10-03','owner_statement':'\u043e\u0447\u0435\u043d\u044c \u0445\u043e\u0440\u043e\u0448\u043e! \u043f\u0440\u0438\u043d\u0438\u043c\u0430\u044e! 100% \u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u0438\u0432\u043a\u0438 \u0437\u0430\u043a\u0440\u044b\u0442\u044c \u043d\u0443\u0436\u043d\u043e','recorded_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'installed_package':str(delivery),'package_manifest_sha256':digest(delivery/'PACKAGE_MANIFEST.json'),'payload_files':len(actual),'previous_accepted_sha':'edf75e1b91742237d14ba9dfe76284993da77d17','previous_accepted_package':str(fallback),'previous_exe_sha256':digest(fallback_exe),'human_accepted':True,'full_p04_complete':False,'full_vehicle_complete':False,'release_accepted':False,'original_handoff_unchanged':True}
          sidecar=delivery/'OWNER_ACCEPTANCE.json'
          if sidecar.exists():
              existing=json.loads(sidecar.read_text(encoding='utf-8'))
              assert existing['candidate_sha']==sha and existing['human_accepted'] is True
              record=existing
          else:
              with sidecar.open('x',encoding='utf-8',newline='\n') as stream: json.dump(record,stream,ensure_ascii=False,indent=2)
          (report/'OWNER_ACCEPTANCE.json').write_bytes(sidecar.read_bytes())
          inventory=[]
          for label,repo in [('primary',main),('runner',root)]:
              def git(*args): return subprocess.run(['git','-C',str(repo),*args],check=True,capture_output=True).stdout
              head=git('rev-parse','HEAD').decode().strip()
              branch=git('branch','--show-current').decode().strip()
              status=git('status','--porcelain=v1','--untracked-files=all').decode('utf-8',errors='replace')
              (report/(label+'-status.txt')).write_text(status,encoding='utf-8')
              (report/(label+'-diff.stat')).write_bytes(git('diff','--stat'))
              inventory.append({'kind':label,'path':str(repo),'head':head,'branch':branch,'status_entries':len(status.splitlines()),'status':status})
          (report/'WORKSPACES.json').write_text(json.dumps(inventory,indent=2),encoding='utf-8')
          names=[str(p) for rootdir in (base/'Config',base/'Builds/PINKCAB') for p in rootdir.iterdir() if 'accept' in p.name.lower() or 'current' in p.name.lower()]
          (report/'EXISTING_ACCEPTANCE_POINTERS.json').write_text(json.dumps(names,indent=2),encoding='utf-8')
          print(json.dumps({'owner_accepted':True,'candidate':sha,'payload_files':53,'receipt':str(sidecar),'workspaces':[{k:v for k,v in row.items() if k!='status'} for row in inventory]}))
      - name: Read desktop targets and project-owned active processes without changing them
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ws=New-Object -ComObject WScript.Shell
          $links=@(foreach($desktop in @('C:\Users\CheCat\Desktop','C:\Users\Public\Desktop','C:\Users\CheCat\Desktop\CHESHIRE_STUDIO')){
            foreach($f in @(Get-ChildItem -LiteralPath $desktop -Filter '*.lnk' -File -ErrorAction SilentlyContinue | Where-Object {$_.BaseName -match '(?i)PIN[CK ]*CAB'})){
              $s=$ws.CreateShortcut($f.FullName)
              [pscustomobject]@{path=$f.FullName;target=$s.TargetPath;arguments=$s.Arguments;description=$s.Description}
            }
          })
          ConvertTo-Json -InputObject $links -Depth 4 | Set-Content (Join-Path $env:ACCEPTANCE_REPORT 'DESKTOP.json') -Encoding UTF8
          Get-CimInstance Win32_Process | Where-Object {$_.Name -match '^(UnrealEditor(-Cmd)?|PinkCab|Kukuruza)(\.exe)?$' -or ($_.Name -eq 'dotnet.exe' -and $_.CommandLine -match 'UnrealBuildTool|AutomationTool')} | Select-Object Name,ProcessId,ExecutablePath,CommandLine | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:ACCEPTANCE_REPORT 'PROCESSES.json') -Encoding UTF8
          Write-Host 'P04_OWNER_ACCEPTANCE_RECORDED; workspace cleanup and integration remain separate'
      - name: Retain acceptance and closeout inspection
        if: always() && env.ACCEPTANCE_REPORT != ''
        uses: actions/upload-artifact@v4
        with:
          name: p04-owner-acceptance-${{ github.run_id }}
          path: ${{ env.ACCEPTANCE_REPORT }}
          if-no-files-found: error
          retention-days: 90
