name: CD-952 Final Accepted Main Administrative Audit
on:
  push:
    branches: [ops/CD-559-restore-playable-entry-20261003]
    paths: [.github/workflows/cd559-accept-v2-entry.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: pinkcab-accepted-v2-entry
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'CheshirskyCat63/PINK-CAB' && github.actor == 'CheshirskyCat63'
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_OPTIONAL_LOCKS: '0'
      PSModulePath: 'C:\WINDOWS\system32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules'
    steps:
      - name: Guard both source copies against concurrent Unreal work
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $roots=@('E:\CHESHIRE_DIVISION\Games\PINK-CAB','E:\CHESHIRE_DIVISION\GitHubRunner\PINK-CAB\actions-runner\_work\PINK-CAB\PINK-CAB')
          $busy=@(Get-CimInstance Win32_Process | Where-Object {
            $cmd=$_.CommandLine
            $engine=($_.Name -match '^(UnrealEditor(-Cmd)?|AutomationTool)(\.exe)?$') -or ($_.Name -eq 'dotnet.exe' -and $cmd -match 'UnrealBuildTool|AutomationTool')
            $engine -and $cmd -and @($roots | Where-Object {$cmd.IndexOf($_,[StringComparison]::OrdinalIgnoreCase) -ge 0}).Count -gt 0
          })
          if($busy.Count){throw 'PINKCAB checkout busy; no processes stopped'}
      - name: Preserve exact known primary logs, synchronize clean main and verify accepted package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import csv,datetime,hashlib,io,json,os,shutil,subprocess,urllib.request
          from pathlib import Path
          base=Path(r'E:\CHESHIRE_DIVISION');primary=base/'Games/PINK-CAB';runner=base/'GitHubRunner/PINK-CAB/actions-runner/_work/PINK-CAB/PINK-CAB'
          main='e03e94f6296445d91f4901925b29070123e9962b';integration='4a313d38f0674a3e5048f832a07428defa31ab62';accepted='52239b61bc80e5a63716b9b09b87c520fa09fd05'
          report=base/'Artifacts/PINKCAB/Acceptance'/('CD952_COMPLETE_'+os.environ['GITHUB_RUN_ID']);report.mkdir(parents=True,exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('FINAL_REPORT='+str(report)+'\n')
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/CheshirskyCat63/PINK-CAB'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def git(repo,*args):return subprocess.run(['git','-C',str(repo),*args],check=True,capture_output=True).stdout
          def sha256(path):
              with path.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          assert api('/git/ref/heads/main')['object']['sha']==main
          mainruns=[r for r in api('/actions/runs?head_sha='+main+'&event=push&per_page=10')['workflow_runs'] if r['path']=='.github/workflows/pinkcab-repository-verification.yml']
          assert len(mainruns)==1 and mainruns[0]['conclusion']=='success'
          assert api('/actions/runs/37152600255')['conclusion']=='success'
          assert git(primary,'rev-parse','HEAD').decode().strip()==main
          assert not git(primary,'status','--porcelain','--untracked-files=all').strip()
          preserved=[]
          for name in ['Build/Windows/FileOpenOrder/CookerOpenOrder.log','Build/Windows/FileOpenOrder/EditorOpenOrder.log']:
              path=primary/name
              if path.exists():
                  assert not git(primary,'ls-files','--',name).strip();git(primary,'check-ignore','--',name)
                  digest=sha256(path);dest=report/path.name;shutil.move(str(path),str(dest));assert sha256(dest)==digest
                  preserved.append({'path':name,'sha256':digest,'retained':str(dest)})
          copies=[]
          for label,repo in [('primary',primary),('runner',runner)]:
              status=git(repo,'status','--porcelain=v1','--untracked-files=all').decode();assert not status.strip(),label+status
              before=git(repo,'rev-parse','HEAD').decode().strip()
              (report/(label+'-before.txt')).write_text(before+'\n'+status,encoding='utf-8')
              git(repo,'fetch','--no-tags','origin','main');assert git(repo,'rev-parse','origin/main').decode().strip()==main
              if label=='primary':
                  assert git(repo,'branch','--show-current').decode().strip()=='main';git(repo,'merge','--ff-only','origin/main')
              else:git(repo,'checkout','--detach',main)
              assert git(repo,'rev-parse','HEAD').decode().strip()==main
              assert not git(repo,'status','--porcelain','--untracked-files=all').strip()
              assert not git(repo,'diff','--name-only',integration,main,'--','Source','Content','Config','Plugins','.github','scripts','*.uproject').strip()
              for index,cmd in enumerate([['python','scripts/ci/prepare_metaroad.py','--root',str(repo)],['python','scripts/ci/acceptance_contract.py','workspace','--sha',main]]):
                  result=subprocess.run(cmd,cwd=repo,capture_output=True,text=True)
                  (report/(label+'-gate-'+str(index)+'.txt')).write_text(result.stdout+result.stderr,encoding='utf-8');print(result.stdout);result.check_returncode()
              copies.append({'kind':label,'path':str(repo),'head':main,'clean':True,'branch':git(repo,'branch','--show-current').decode().strip(),'metaroad_pin':'PASS','workspace_guard':'PASS'})
          delivery=base/'Builds/PINKCAB/CD869_ENDLESS_52239b61_RUN37149462470_ATTEMPT1';payload=delivery/'Windows'
          manifest=json.loads((delivery/'PACKAGE_MANIFEST.json').read_text(encoding='utf-8-sig'));owner=json.loads((delivery/'OWNER_ACCEPTANCE.json').read_text(encoding='utf-8'))
          assert manifest['candidateSha']==accepted and str(manifest['deliveryRun'])=='37149462470'
          assert owner['candidate_sha']==accepted and owner['human_accepted'] is True and owner['package_manifest_sha256']==sha256(delivery/'PACKAGE_MANIFEST.json')
          expected={f['path']:f for f in manifest['files']};actual={p.relative_to(payload).as_posix():p for p in payload.rglob('*') if p.is_file() and 'saved' not in [x.lower() for x in p.relative_to(payload).parts]}
          assert len(expected)==len(manifest['files'])==53 and set(expected)==set(actual)
          for name,path in actual.items():assert path.stat().st_size==expected[name]['bytes'] and sha256(path)==expected[name]['sha256'],name
          fallback=base/'Builds/PINKCAB/CD869_ENDLESS_edf75e1b_RUN37117735294/Windows/PinkCab/Binaries/Win64/PinkCab.exe';assert fallback.is_file() and sha256(fallback)==owner['previous_exe_sha256']
          assert (base/'Builds/PINKCAB/CD869_ENDLESS_8d68e456_RUN36868646970/Windows/PinkCab/Binaries/Win64/PinkCab.exe').is_file()
          tasks=list(csv.DictReader(io.StringIO((primary/'docs/vehicle_physics/TASKS.csv').read_text(encoding='utf-8'))));tests=list(csv.DictReader(io.StringIO((primary/'docs/vehicle_physics/TESTS.csv').read_text(encoding='utf-8'))))
          assert len(tasks)==48 and len(tests)==96
          assert next(t for t in tasks if t['ID']=='PHY-013')['Status']=='IN_PROGRESS' and next(t for t in tests if t['ID']=='T-026')['Status']=='NOT RUN'
          workflows=api('/actions/workflows?per_page=100');assert workflows['total_count']<=100
          rows=[{k:w[k] for k in ['id','name','path','state']} for w in workflows['workflows']]
          temporary=[373832790,373833934,373846025,373856634,373883388]
          for workflow in rows:
              if workflow['id'] in temporary:assert not git(primary,'ls-tree','--name-only',main,'--',workflow['path']).strip(),'Temporary workflow unexpectedly belongs to main'
          (report/'WORKFLOW_STATES.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          (report/'OWNER_ACCEPTANCE.json').write_bytes((delivery/'OWNER_ACCEPTANCE.json').read_bytes())
          result={'audit_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'administrative_issue':'CD-952','main':main,'integration':integration,'accepted_runtime':accepted,'accepted_delivery':37149462470,'main_verification_run':mainruns[0]['id'],'integration_verification_run':37152600255,'workspaces':copies,'accepted_payload_files':53,'accepted_payload_bytes':sum(p.stat().st_size for p in actual.values()),'all_payload_hashes_match':True,'previous_v2_unchanged':True,'previous_p02_exists':True,'task_rows':48,'test_rows':96,'primary_cooker_logs_preserved':preserved,'runtime_changed_by_administration':False,'temporary_workflows_to_retire':temporary,'retirement_status':'SEPARATE_FINAL_STEP'}
          (report/'FINAL_SOURCE_AND_PACKAGE_AUDIT.json').write_text(json.dumps(result,indent=2),encoding='utf-8');print(json.dumps(result))
      - name: Read back the sole accepted play entry and named studio tools
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$ws=New-Object -ComObject WScript.Shell
          $desktop='C:\Users\CheCat\Desktop';$studio=Join-Path $desktop 'CHESHIRE_STUDIO'
          $rows=@(foreach($dir in @($desktop,'C:\Users\Public\Desktop',$studio)){foreach($f in @(Get-ChildItem -LiteralPath $dir -Filter '*.lnk' -File | Where-Object {$_.BaseName -match '(?i)PIN[CK ]*CAB'})){$s=$ws.CreateShortcut($f.FullName);[pscustomobject]@{path=$f.FullName;target=$s.TargetPath;arguments=$s.Arguments;description=$s.Description;exists=(Test-Path -LiteralPath $s.TargetPath)}}})
          if($rows.Count -ne 3){throw 'Unexpected PINKCAB desktop/studio alias count'}
          $entry=@($rows | Where-Object {$_.path -eq (Join-Path $desktop 'PINCKCAB.lnk')})
          if($entry.Count -ne 1 -or $entry[0].target -ne 'E:\CHESHIRE_DIVISION\Builds\PINKCAB\CD869_ENDLESS_52239b61_RUN37149462470_ATTEMPT1\Windows\PinkCab\Binaries\Win64\PinkCab.exe' -or $entry[0].description -notmatch 'OWNER ACCEPTED' -or -not $entry[0].exists){throw 'Accepted root entry mismatch'}
          if(@($rows | Where-Object {$_.path -eq (Join-Path $studio 'PINKCAB_Rollback_V2.lnk') -and $_.target -match 'edf75e1b' -and $_.exists}).Count -ne 1){throw 'Named V2 fallback missing'}
          if(@($rows | Where-Object {$_.path -eq (Join-Path $studio 'PINKCAB_Editor.lnk') -and $_.exists}).Count -ne 1){throw 'Studio Editor missing'}
          $rows | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:FINAL_REPORT 'FINAL_DESKTOP.json') -Encoding UTF8
          Write-Host 'CD952_FINAL_SOURCE_PACKAGE_DESKTOP=PASS; accepted game not restarted or replaced'
      - name: Retain final verified administrative receipts
        if: always() && env.FINAL_REPORT != ''
        uses: actions/upload-artifact@v4
        with:
          name: p04-admin-complete-audit-${{ github.run_id }}
          path: ${{ env.FINAL_REPORT }}
          if-no-files-found: error
          retention-days: 90
