name: CD-559 Accepted PINK CAB Desktop Entry
on:
  push:
    branches: [ops/CD-559-restore-playable-entry-20261003]
    paths: [.github/workflows/cd559-accept-v2-entry.yml]
permissions:
  contents: read
concurrency:
  group: pinkcab-accepted-v2-entry
  cancel-in-progress: false
jobs:
  accept:
    if: github.repository == 'CheshirskyCat63/PINK-CAB' && github.actor == 'CheshirskyCat63'
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 5
    steps:
      - name: Keep one accepted PLAY entry and archive redundant game shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'DESKTOP-C7VAU4V' -or $env:USERNAME -ne 'CheCat'){throw 'Wrong host/user'}
          $desktop=[Environment]::GetFolderPath('Desktop')
          if($desktop -ne 'C:\Users\CheCat\Desktop'){throw 'Unexpected desktop'}
          $package='E:\CHESHIRE_DIVISION\Builds\PINKCAB\CD869_ENDLESS_edf75e1b_RUN37117735294'
          $exe=Join-Path $package 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if((Get-Content (Join-Path $package 'CANDIDATE_SHA.txt') -Raw).Trim() -ne 'edf75e1b91742237d14ba9dfe76284993da77d17'){throw 'Accepted package identity mismatch'}
          if((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0d06f81c2f83ab983ce7709569c04682e5ae3eba5b4d07fc43397947fafce9cc'){throw 'Accepted executable hash mismatch'}
          $out=Join-Path 'E:\CHESHIRE_DIVISION\Artifacts\PINKCAB\DesktopEntry' ($env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $out){throw 'Evidence directory already exists'}
          New-Item -ItemType Directory -Path $out | Out-Null
          "DESKTOP_ENTRY_EVIDENCE=$out" | Out-File $env:GITHUB_ENV -Append
          $ws=New-Object -ComObject WScript.Shell
          $play=Join-Path $desktop 'PINK CAB - ИГРАТЬ.lnk'
          $before=@()
          $plan=@()
          $foreignBefore=@{}
          foreach($file in @(Get-ChildItem -LiteralPath $desktop -Filter '*.lnk' -File)){
            $hash=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if($file.Name -notmatch '^PINK\s?CAB(?:[ _-]|\.)'){$foreignBefore[$file.FullName]=$hash;continue}
            $link=$ws.CreateShortcut($file.FullName)
            $row=@{name=$file.Name;path=$file.FullName;target=$link.TargetPath;arguments=$link.Arguments;sha256=$hash}
            $before+=$row
            if($file.FullName -eq $play){continue}
            if($link.TargetPath.StartsWith('E:\CHESHIRE_DIVISION\Builds\PINKCAB\',[StringComparison]::OrdinalIgnoreCase) -and [IO.Path]::GetFileName($link.TargetPath) -match '^PinkCab(?:-Win64-(?:Shipping|Development))?\.exe$'){$plan+=$row}
          }
          $before | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $out 'before.json') -Encoding utf8
          $archive=Join-Path $desktop ('CHESHIRE_STUDIO\PINKCAB\Архив ярлыков\'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $archive){throw 'Shortcut archive already exists'}
          New-Item -ItemType Directory -Path $archive | Out-Null
          if(Test-Path -LiteralPath $play){
            $existing=$ws.CreateShortcut($play)
            if($existing.TargetPath -ne $exe){throw 'Existing PLAY targets another package; preserve it unchanged'}
            Copy-Item -LiteralPath $play -Destination (Join-Path $archive 'PINK CAB - ИГРАТЬ.previous.lnk')
          }
          $new=$ws.CreateShortcut($play)
          $new.TargetPath=$exe
          $new.WorkingDirectory=Split-Path $exe
          $new.Arguments='/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight -windowed -ResX=1600 -ResY=900'
          $new.IconLocation=$exe+',0'
          $new.Description='PINK CAB: принятая версия 2. P03 edf75e1b, принят владельцем 03.10.2026.'
          $new.Save()
          if(-not (Test-Path -LiteralPath $play) -or $ws.CreateShortcut($play).TargetPath -ne $exe){throw 'PLAY shortcut readback failed; old shortcuts untouched'}
          $moved=@()
          foreach($row in $plan){
            if((Get-FileHash -LiteralPath $row.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $row.sha256){throw 'Shortcut changed concurrently; remaining links untouched'}
            $dest=Join-Path $archive $row.name
            if(Test-Path -LiteralPath $dest){throw 'Archive collision'}
            Copy-Item -LiteralPath $row.path -Destination (Join-Path $out $row.name)
            if((Get-FileHash -LiteralPath (Join-Path $out $row.name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $row.sha256){throw 'Backup hash mismatch'}
            Move-Item -LiteralPath $row.path -Destination $dest
            if((Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant() -ne $row.sha256){throw 'Archived shortcut hash mismatch'}
            $moved+=@{original=$row.path;archive=$dest;target=$row.target;sha256=$row.sha256}
          }
          foreach($path in $foreignBefore.Keys){if(-not (Test-Path -LiteralPath $path) -or (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $foreignBefore[$path]){throw 'Unrelated shortcut changed during operation'}}
          $after=@(Get-ChildItem -LiteralPath $desktop -Filter '*.lnk' -File | Where-Object {$_.Name -match '^PINK\s?CAB(?:[ _-]|\.)'} | ForEach-Object {@{name=$_.Name;target=$ws.CreateShortcut($_.FullName).TargetPath}})
          $receipt=@{status='PLAY_READY_OLD_SHORTCUTS_ARCHIVED';desktop=$desktop;play=$play;acceptedSource='edf75e1b91742237d14ba9dfe76284993da77d17';package=$package;archive=$archive;archived=$moved;remainingDesktopEntries=$after;unrelatedShortcutsUnchanged=$true;buildsDeleted=0;gameProcessesStopped=0;newCandidateDelivered=$false}
          $receipt | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $out 'DESKTOP_ENTRY.json') -Encoding utf8
          $receipt | ConvertTo-Json -Depth 8 | Write-Host
          if($after.Count -ne 1 -or $after[0].name -ne 'PINK CAB - ИГРАТЬ.lnk'){throw 'Unrecognized PINKCAB entries remain; see receipt, no unverified shortcut removed'}
      - name: Preserve shortcut inventory and reversible backups
        if: always() && env.DESKTOP_ENTRY_EVIDENCE != ''
        uses: actions/upload-artifact@v4
        with:
          name: pinkcab-desktop-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DESKTOP_ENTRY_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
