name: CD-869 One Shot Launch Current Human

on:
  push:
    branches:
      - feat/CD-869-r2-median-separators
    paths:
      - docs/audits/CD869_LAUNCH_TRIGGER.txt

permissions:
  contents: read

jobs:
  launch:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 5
    steps:
      - name: Launch current HUMAN candidate
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $exe='E:\CHESHIRE_DIVISION\Builds\PINKCAB\CD869_R2_METAROAD_dc2e5a39_RUN36072726194\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $exe)){ throw "PINKCAB_HUMAN_EXE_MISSING $exe" }

          Get-Process -Name PinkCab -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }

          $saved=$env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID=''
          try {
            $proc=Start-Process -FilePath $exe -ArgumentList @(
              '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
              '-windowed','-ResX=1600','-ResY=900'
            ) -WorkingDirectory (Split-Path $exe) -PassThru
            Start-Sleep -Seconds 5
            $proc.Refresh()
            if($proc.HasExited){ throw "PINKCAB_HUMAN_EXITED_EARLY code=$($proc.ExitCode)" }
            Write-Host "PINKCAB_HUMAN_LAUNCHED_PID=$($proc.Id)"
            Write-Host "PINKCAB_HUMAN_EXE=$exe"
            Write-Host 'PINKCAB_HUMAN_FOREGROUND=PASS'
          }
          finally {
            $env:RUNNER_TRACKING_ID=$saved
          }
