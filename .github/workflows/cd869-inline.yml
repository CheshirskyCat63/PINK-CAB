name: CD-869 Inline Verification

on:
  push:
    branches:
      - feat/CD-869-l1-endless-road
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd869-inline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Windows runner and MetaRoad preflight
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 15
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          clean: true

      - name: Exact Git preflight
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "REPO_ROOT=$env:GITHUB_WORKSPACE"
          Write-Host "BRANCH=$env:GITHUB_REF_NAME"
          $head = (git rev-parse HEAD).Trim()
          Write-Host "HEAD=$head"
          git remote -v
          git status --short
          if (@(git status --porcelain).Count -ne 0) {
            throw 'CD869_PREFLIGHT_DIRTY_CHECKOUT'
          }
          Write-Host 'CD869_GIT_PREFLIGHT=PASS'

      - name: UE 5.8 and MetaRoad probe
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:UE_ROOT)) {
            throw "CD869_UE_ROOT_MISSING: $env:UE_ROOT"
          }
          $editor = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          if (-not (Test-Path $editor)) {
            throw "CD869_EDITOR_MISSING: $editor"
          }
          Write-Host "CD869_UE_EDITOR=$editor"

          $roots = @(
            (Join-Path $env:GITHUB_WORKSPACE 'Plugins'),
            (Join-Path $env:UE_ROOT 'Engine\Plugins')
          ) | Where-Object { Test-Path $_ }

          $plugins = @()
          foreach ($root in $roots) {
            $plugins += Get-ChildItem -Path $root -Filter '*.uplugin' -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match 'MetaRoad|UnrealDrive' -or
                $_.FullName -match 'MetaRoad|UnrealDrive'
              }
          }

          if ($plugins.Count -eq 0) {
            Write-Host 'CD869_METAROAD=NOT_FOUND'
            throw 'CD869_METAROAD_REQUIRED'
          }

          foreach ($plugin in $plugins) {
            Write-Host "CD869_METAROAD_PLUGIN=$($plugin.FullName)"
            try {
              $json = Get-Content -Raw -LiteralPath $plugin.FullName | ConvertFrom-Json
              Write-Host "CD869_METAROAD_VERSION=$($json.VersionName)"
              Write-Host "CD869_METAROAD_FRIENDLY=$($json.FriendlyName)"
              Write-Host "CD869_METAROAD_ENABLED_BY_DEFAULT=$($json.EnabledByDefault)"
            } catch {
              Write-Host "CD869_METAROAD_DESCRIPTOR_PARSE_WARNING=$($_.Exception.Message)"
            }
          }

          Write-Host 'CD869_METAROAD_PREFLIGHT=PASS'


  verify:
    name: Build and focused endless-road tests
    needs: preflight
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 45
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      TEST_LOG: Saved\GitHubGate\CD869_ENDLESS_ROAD.log

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          clean: true

      - name: Build PinkCabEditor
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project = Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'CD869_EDITOR_BUILD=PASS'

      - name: Run focused endless-road automation
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path (Split-Path $env:TEST_LOG) | Out-Null
          $editor = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log = Join-Path $env:GITHUB_WORKSPACE $env:TEST_LOG
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.World.L1EndlessRoad" "-TestExit=Automation Test Queue Empty"
          $exit = $LASTEXITCODE
          if (Test-Path $log) {
            Get-Content $log | Select-String -Pattern 'Automation Test Queue Empty|Test Completed. Result=|LogAutomationController: Error:' | Select-Object -Last 120 | ForEach-Object { Write-Host $_.Line }
          }
          if ($exit -ne 0) { exit $exit }
          $queue = @(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fails = @(Select-String -Path $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          if ($queue.Count -eq 0) { throw 'CD869_AUTOMATION_QUEUE_MARKER_MISSING' }
          if ($fails.Count -gt 0) { throw "CD869_AUTOMATION_FAILURES=$($fails.Count)" }
          Write-Host "CD869_FOCUSED_TESTS=PASS $($queue[-1].Line)"
