name: CD-869 R3 Source Hygiene
# rerun after constructor hygiene split

on:
  push:
    branches:
      - feat/CD-869-r3-metaroad-markings
    paths:
      - .github/workflows/cd869-r3-probe.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 25
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: false
      - name: Exact tracked preflight
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R3_HEAD_MISMATCH $head" }
          $dirty=@(git status --porcelain --untracked-files=no)
          if($dirty.Count -ne 0){ $dirty | % { Write-Host $_ }; throw 'R3_TRACKED_DIRTY' }
          Write-Host "CD869_R3_HYGIENE_HEAD=$head"
      - name: Build PinkCabEditor
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=6
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'CD869_R3_HYGIENE_BUILD=PASS'
      - name: Strict zero-debt
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if($LASTEXITCODE -ne 0){
            if(Test-Path '.\Saved\Reports\code-health.json'){
              Get-Content '.\Saved\Reports\code-health.json' | Write-Host
            }
            exit $LASTEXITCODE
          }
          Write-Host 'CD869_R3_ZERO_DEBT=PASS'
