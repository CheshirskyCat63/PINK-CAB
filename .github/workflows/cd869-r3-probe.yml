name: CD-869 R3 MetaRoad API Probe

on:
  push:
    branches: [feat/CD-869-r3-metaroad-markings]
    paths: [.github/workflows/cd869-r3-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 10
    env:
      META_ROOT: C:\Program Files\Epic Games\UE_5.8\Engine\Plugins\Marketplace\MetaRoad08e3462d55e7V4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          clean: false

      - name: Exact preflight and MetaRoad R3 API
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R3_HEAD_MISMATCH $head != $env:GITHUB_SHA" }
          $tracked=@(git status --porcelain --untracked-files=no)
          if($tracked.Count -ne 0){ $tracked | % { Write-Host $_ }; throw 'R3_TRACKED_DIRTY' }
          Write-Host "R3_PREFLIGHT_HEAD=$head"

          function Show-Range([string]$Path,[int]$Start,[int]$End,[string]$Tag){
            if(-not(Test-Path $Path)){ throw "R3_PLUGIN_FILE_MISSING=$Path" }
            Write-Host "===== R3_RANGE $Tag ====="
            $c=Get-Content $Path
            for($i=$Start;$i -le $End;$i++){
              if($i -le $c.Count){ Write-Host ("{0}: {1}" -f $i,$c[$i-1]) }
            }
          }

          Show-Range (Join-Path $env:META_ROOT 'Source\MetaRoad\Public\RoadLaneAttribute.h') 160 285 'RoadLaneAttribute'
          Show-Range (Join-Path $env:META_ROOT 'Source\MetaRoad\Public\Assets\RoadLaneAttributeMark.h') 160 235 'RoadLaneAttributeMark'
          Show-Range (Join-Path $env:META_ROOT 'Source\MetaRoad\Public\MetaRoadTypes.h') 490 530 'FRoadLane'
          Show-Range (Join-Path $env:META_ROOT 'Source\MetaRoadEditor\Private\EditorMode\MetaRoadDragDropHandler.cpp') 286 307 'MarkDrop'

          $profiles=Join-Path $env:META_ROOT 'Content\MetaRoad\Profiles\Marks'
          Get-ChildItem $profiles -Filter '*.uasset' | Sort-Object Name | % { Write-Host "R3_MARK_PROFILE=$($_.BaseName)" }
          Write-Host 'R3_API_PROBE=PASS'
