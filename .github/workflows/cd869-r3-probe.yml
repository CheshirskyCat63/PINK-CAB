name: CD-869 R3 MetaRoad Profile Probe

on:
  push:
    branches:
      - feat/CD-869-r3-metaroad-markings
    paths:
      - .github/workflows/cd869-r3-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 10
    env:
      META_ROOT: C:\Program Files\Epic Games\UE_5.8\Engine\Plugins\Marketplace\MetaRoad08e3462d55e7V4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          clean: false

      - name: Read native profile references
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R3_HEAD_MISMATCH $head" }
          $tracked=@(git status --porcelain --untracked-files=no)
          if($tracked.Count -ne 0){ $tracked | ForEach-Object { Write-Host $_ }; throw 'R3_TRACKED_DIRTY' }
          $dir=Join-Path $env:META_ROOT 'Content\MetaRoad\Profiles\RoadProfiles'
          foreach($name in @('4_Lanes+Borders','2_Lanes+Borders','2_Lanes+Borders_Coodirect')){
            $p=Join-Path $dir ($name + '.uasset')
            if(-not(Test-Path $p)){ throw "R3_PROFILE_MISSING=$p" }
            $bytes=[System.IO.File]::ReadAllBytes($p)
            $ascii=[System.Text.Encoding]::ASCII.GetString($bytes)
            $utf16=[System.Text.Encoding]::Unicode.GetString($bytes)
            $refs=@()
            foreach($txt in @($ascii,$utf16)){
              $refs += [regex]::Matches($txt,'(?:broked|solid|double)_[A-Za-z0-9_]+') | ForEach-Object { $_.Value }
            }
            $refs=$refs | Sort-Object -Unique
            Write-Host "R3_ROAD_PROFILE=$name"
            $refs | ForEach-Object { Write-Host "R3_PROFILE_MARK_REF=$name::$_" }
          }
          Write-Host 'R3_PROFILE_PROBE=PASS'
