name: CD-869 R3 MetaRoad MarksOp Probe

on:
  push:
    branches:
      - feat/CD-869-r3-metaroad-markings
    paths:
      - .github/workflows/cd869-r3-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 10
    env:
      META_ROOT: C:\Program Files\Epic Games\UE_5.8\Engine\Plugins\Marketplace\MetaRoad08e3462d55e7V4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          clean: false
      - name: Read MarksOp output contract
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R3_HEAD_MISMATCH $head" }
          $p=Join-Path $env:META_ROOT 'Source\MetaRoadEditor\Private\RoadMeshBuild\Ops\MarksOp.cpp'
          $hits=Select-String -Path $p -Pattern 'Mesh|Mark|Name|Output|Group|Layer' -CaseSensitive:$false
          foreach($h in $hits){ Write-Host ("R3_MARKSOP {0}: {1}" -f $h.LineNumber,$h.Line.Trim()) }
          Write-Host 'R3_MARKSOP_PROBE=PASS'
