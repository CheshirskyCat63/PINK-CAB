name: CD-869 R3 MetaRoad RoadProfile Header Probe

on:
  push:
    branches:
      - feat/CD-869-r3-metaroad-markings
    paths:
      - .github/workflows/cd869-r3-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 10
    env:
      META_ROOT: C:\Program Files\Epic Games\UE_5.8\Engine\Plugins\Marketplace\MetaRoad08e3462d55e7V4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          clean: false
      - name: Read RoadProfile API
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R3_HEAD_MISMATCH $head" }
          $p=Join-Path $env:META_ROOT 'Source\MetaRoadEditor\Public\Assets\RoadProfile.h'
          $c=Get-Content $p
          for($i=80;$i -le 135;$i++){ Write-Host ("R3_ROADPROFILE_API {0}: {1}" -f $i,$c[$i-1]) }
          Write-Host 'R3_PROFILE_HEADER_PROBE=PASS'
