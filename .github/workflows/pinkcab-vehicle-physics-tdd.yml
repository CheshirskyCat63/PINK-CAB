name: PINK CAB Vehicle Physics TDD

# Windows PowerShell 5.1 must resolve its own built-in modules, not an inherited host edition.
env:
  PSModulePath: 'C:\WINDOWS\system32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules'

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      freeze_baseline:
        description: 'Explicitly create a new immutable physics baseline'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pinkcab-tdd-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  physics-tdd:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) }}
    name: Vehicle physics focused TDD gate
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 30
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      TEST_LOG: Saved\GitHubGate\VEHICLE_PHYSICS_TDD.log
      BASELINE_JSON: Saved\GitHubGate\VEHICLE_PHYSICS_BASELINE.json
      ROLLBACK_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB\CODEONLY_8168d72_RUN35809749568
      ROLLBACK_SHA: 8168d72406af6934ab20eace583c2b895f0620b7
      ROLLBACK_RUN_ID: '35809749568'
      BASELINE_ROOT_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: false
          clean: false

      - name: Mark requested runtime verification
        id: change_scope
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          "run_physics=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify warm workspace provenance
        env:
          PINKCAB_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          python scripts/ci/acceptance_contract.py workspace
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Prepare pinned MetaRoad dependency
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          python .\scripts\ci\prepare_metaroad.py --root "$env:GITHUB_WORKSPACE"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Materialize verified local LFS fixtures
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest scripts.tests.test_materialize_local_lfs -v
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $fixtureManifestPath=Join-Path $env:GITHUB_WORKSPACE 'Config\VehiclePhysicsRuntimeFixtures.json'
          $fixtureManifest=Get-Content -LiteralPath $fixtureManifestPath -Raw | ConvertFrom-Json
          $materializeArgs=@(
            'scripts/ci/materialize_local_lfs.py',
            '--workspace', $env:GITHUB_WORKSPACE,
            '--base-ref', 'origin/main',
            '--all-tracked',
            '--search-root', 'E:\CHESHIRE_DIVISION\Games\PINK-CAB',
            '--search-root', 'E:\CHESHIRE_DIVISION\RecoveryLinks\PINK-CAB',
            '--search-root', 'E:\Development',
            '--allow-changed-lfs', 'Content/Dev/Maps/L_PinkCab_L1_EndlessStraight.umap'
          )
          foreach($fixture in $fixtureManifest.lfs){
            $absolute=Join-Path $env:GITHUB_WORKSPACE ([string]$fixture.path)
            if(-not (Test-Path -LiteralPath $absolute)){
              throw "PINKCAB_PHYSICS_FIXTURE_POINTER_MISSING=$($fixture.path)"
            }
            $pointer=Get-Content -LiteralPath $absolute -Raw
            $match=[regex]::Match($pointer,"(?m)^oid sha256:([0-9a-f]{64})\s*$")
            if(-not $match.Success){
              $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $absolute).Hash.ToLowerInvariant()
              if($actual -ne ([string]$fixture.oid_sha256).ToLowerInvariant()){
                throw "PINKCAB_PHYSICS_FIXTURE_HASH_MISMATCH=$($fixture.path) actual=$actual expected=$($fixture.oid_sha256)"
              }
            } elseif($match.Groups[1].Value -ne ([string]$fixture.oid_sha256).ToLowerInvariant()){
              throw "PINKCAB_PHYSICS_FIXTURE_OID_MISMATCH=$($fixture.path) actual=$($match.Groups[1].Value) expected=$($fixture.oid_sha256)"
            }
            $materializeArgs += '--required'
            $materializeArgs += [string]$fixture.path
          }
          python @materializeArgs
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host "PINKCAB_PHYSICS_LOCAL_LFS_MATERIALIZATION=PASS"

      - name: Exact-head and hygiene preflight
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          $expected='${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}'
          if($head -ne $expected){ throw "PINKCAB_PHYSICS_HEAD_MISMATCH $head != $expected" }
          if(@(git status --porcelain --untracked-files=no).Count -gt 0){ throw 'PINKCAB_PHYSICS_TRACKED_CHECKOUT_DIRTY' }
          python -m unittest scripts.tests.test_repo_hygiene scripts.tests.test_code_health -v
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python scripts/ci/verify_vehicle_physics_writers.py --manifest docs/vehicle_physics/STATE_WRITER_INVENTORY.csv --evidence Saved/GitHubGate/VEHICLE_PHYSICS_WRITERS.json
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path (Split-Path $env:TEST_LOG) | Out-Null
          Write-Host "PINKCAB_PHYSICS_EXACT_HEAD=$head"

      - name: Build PinkCabEditor
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & .\scripts\ci\ensure-dev-signing.ps1 -Path (Join-Path $env:GITHUB_WORKSPACE 'Binaries\Win64\UnrealEditor-PinkCab*.dll')
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'PINKCAB_PHYSICS_EDITOR_BUILD=PASS'





      - name: Run complete P03 control-runtime regression
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          & .\scripts\ci\run-unreal-automation.ps1 `
            -EngineRoot $env:UE_ROOT `
            -ProjectPath "$env:GITHUB_WORKSPACE\PinkCab.uproject" `
            -TestName 'PinkCab.Vehicle.ControlRuntime' `
            -LogPath "$env:GITHUB_WORKSPACE\Saved\GitHubGate\P03_CONTROL_RUNTIME.log" `
            -TimeoutSeconds 300
          Write-Host 'PINKCAB_P03_CONTROL_RUNTIME=PASS'

      - name: Run focused vehicle-physics tests
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE $env:TEST_LOG
          & .\scripts\ci\run-unreal-automation.ps1 `
            -EngineRoot $env:UE_ROOT `
            -ProjectPath $project `
            -TestName 'PinkCab.Vehicle.Physics' `
            -LogPath $log `
            -TimeoutSeconds 900
          Write-Host 'PINKCAB_PHYSICS_TDD=PASS'

      - name: Seal complete physics evidence
        env:
          PINKCAB_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          python scripts/ci/acceptance_contract.py attest --log Saved/GitHubGate/VEHICLE_PHYSICS_TDD.log --manifest Saved/GitHubGate/PHYSICS_ACCEPTANCE.json
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Publish same-run physics evidence
        uses: actions/upload-artifact@v4
        with:
          name: physics-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/GitHubGate/PHYSICS_ACCEPTANCE.json
            Saved/GitHubGate/VEHICLE_PHYSICS_TDD.log
          if-no-files-found: error
          retention-days: 14

      - name: Build exact game executable for PHY-001 baseline
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCab Win64 Development $project -WaitMutex -NoHotReloadFromIDE
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $exe=Join-Path $env:GITHUB_WORKSPACE 'Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $exe)){ throw 'PINKCAB_PHYSICS_BASELINE_EXE_MISSING' }
          & .\scripts\ci\ensure-dev-signing.ps1 -Path $exe
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'PINKCAB_PHYSICS_GAME_BUILD=PASS'

      - name: Capture PHY-001 executable/profile/rollback baseline
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $expected='${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}'
          $freezeRoot=''
          if('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.freeze_baseline }}' -eq 'true'){
            $freezeRoot=$env:BASELINE_ROOT_BASE
          }
          & .\scripts\ci\capture-vehicle-physics-baseline.ps1 `
            -CandidateSha $expected `
            -CurrentExe (Join-Path $env:GITHUB_WORKSPACE 'Binaries\Win64\PinkCab.exe') `
            -RollbackRoot $env:ROLLBACK_BASE `
            -RollbackSha $env:ROLLBACK_SHA `
            -RollbackRunId $env:ROLLBACK_RUN_ID `
            -ProfileLog (Join-Path $env:GITHUB_WORKSPACE $env:TEST_LOG) `
            -EngineRoot $env:UE_ROOT `
            -FreezeRootBase $freezeRoot `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE $env:BASELINE_JSON)
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Persist focused evidence on canonical runner
        if: ${{ always() && steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $sha='${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}'
          $root=Join-Path $env:BASELINE_ROOT_BASE "Evidence\VehiclePhysics\$sha\${{ github.run_id }}"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $sources=@(
            'Saved\GitHubGate\VEHICLE_PHYSICS_TDD.log',
            'Saved\GitHubGate\VEHICLE_PHYSICS_BASELINE.json',
            'Saved\GitHubGate\VEHICLE_PHYSICS_WRITERS.json',
            'Saved\Reports\code-health.json'
          )
          $manifest=@()
          foreach($relative in $sources){
            $source=Join-Path $env:GITHUB_WORKSPACE $relative
            if(-not (Test-Path -LiteralPath $source)){
              Write-Host "PINKCAB_PHYSICS_EVIDENCE_MISSING=$relative"
              continue
            }
            $name=[IO.Path]::GetFileName($source)
            $dest=Join-Path $root $name
            Copy-Item -LiteralPath $source -Destination $dest -Force
            $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLowerInvariant()
            $manifest += [pscustomobject]@{
              file=$name
              sha256=$hash
              bytes=(Get-Item -LiteralPath $dest).Length
            }
            Write-Host "PINKCAB_PHYSICS_EVIDENCE_FILE=$dest sha256=$hash"
          }

          if($manifest.Count -eq 0){
            Write-Host 'PINKCAB_PHYSICS_EVIDENCE_NO_PAYLOAD=1'
          }
          $manifestPath=Join-Path $root 'manifest.json'
          $manifestJson = if($manifest.Count -eq 0){
            '[]'
          } else {
            $manifest | ConvertTo-Json -Depth 4
          }
          Set-Content -LiteralPath $manifestPath -Value $manifestJson -Encoding UTF8
          $manifestHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $manifestPath).Hash.ToLowerInvariant()
          Write-Host "PINKCAB_PHYSICS_EVIDENCE_ROOT=$root"
          Write-Host "PINKCAB_PHYSICS_EVIDENCE_MANIFEST=$manifestPath sha256=$manifestHash"
