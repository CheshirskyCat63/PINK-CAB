name: PINK CAB Vehicle Physics TDD

on:
  pull_request:
    branches: [main]
    paths:
      - 'Source/PinkCabVehicle/**'
      - 'Source/PinkCabTests/Private/Vehicle/**'
      - '.github/workflows/pinkcab-vehicle-physics-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinkcab-vehicle-physics-tdd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physics-tdd:
    name: Vehicle physics focused TDD gate
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 30
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      TEST_LOG: Saved\GitHubGate\VEHICLE_PHYSICS_TDD.log

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Exact-head and hygiene preflight
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          $expected='${{ github.event.pull_request.head.sha || github.sha }}'
          if($head -ne $expected){ throw "PINKCAB_PHYSICS_HEAD_MISMATCH $head != $expected" }
          if(@(git status --porcelain --untracked-files=no).Count -gt 0){ throw 'PINKCAB_PHYSICS_TRACKED_CHECKOUT_DIRTY' }
          python -m unittest scripts.tests.test_repo_hygiene scripts.tests.test_code_health -v
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path (Split-Path $env:TEST_LOG) | Out-Null
          Write-Host "PINKCAB_PHYSICS_EXACT_HEAD=$head"

      - name: Build PinkCabEditor
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & .\scripts\ci\ensure-dev-signing.ps1 -Path (Join-Path $env:GITHUB_WORKSPACE 'Binaries\Win64\UnrealEditor-PinkCab*.dll')
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'PINKCAB_PHYSICS_EDITOR_BUILD=PASS'

      - name: Run focused vehicle-physics tests
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE $env:TEST_LOG
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.Vehicle.Physics" "-TestExit=Automation Test Queue Empty"
          $exit=$LASTEXITCODE
          if(Test-Path $log){
            Get-Content $log | Select-String -Pattern 'Automation Test Queue Empty|Test Completed. Result=|LogAutomationController: Error:' | Select-Object -Last 160 | ForEach-Object { Write-Host $_.Line }
          }
          if($exit -ne 0){ exit $exit }
          $queue=@(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fail=@(Select-String -Path $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          if($queue.Count -eq 0 -or $fail.Count -gt 0){ throw "PINKCAB_PHYSICS_TEST_FAIL queue=$($queue.Count) fail=$($fail.Count)" }
          Write-Host "PINKCAB_PHYSICS_TDD=PASS $($queue[-1].Line)"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PINKCAB-vehicle-physics-tdd-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            Saved/GitHubGate/VEHICLE_PHYSICS_TDD.log
            Saved/Reports/code-health.json
          if-no-files-found: warn
          retention-days: 30
