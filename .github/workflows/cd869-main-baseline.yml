name: CD-869 Main Baseline Control

on:
  push:
    branches:
      - feat/CD-869-l1-endless-road

permissions:
  contents: read

concurrency:
  group: cd869-main-baseline
  cancel-in-progress: true

jobs:
  full-main:
    name: Exact main full PinkCab baseline
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 45
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true
          clean: true

      - name: Verify exact main
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          $remote=(git ls-remote origin refs/heads/main | ForEach-Object { ($_ -split "\s+")[0] }).Trim()
          if($head -ne $remote){ throw "CD869_MAIN_BASELINE_HEAD_MISMATCH $head != $remote" }
          if(@(git status --porcelain).Count -ne 0){ throw 'CD869_MAIN_BASELINE_DIRTY' }
          Write-Host "CD869_MAIN_BASELINE_HEAD=$head"

      - name: Build main PinkCabEditor
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Run full PinkCab suite on main
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_MAIN_BASELINE_FULL.log'
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab" "-TestExit=Automation Test Queue Empty"
          $exit=$LASTEXITCODE
          if(Test-Path $log){
            Get-Content $log |
              Select-String -Pattern 'Automation Test Queue Empty|Test Completed. Result=\{Fail\}|LogAutomationController: Error:' |
              Select-Object -Last 180 |
              ForEach-Object { Write-Host $_.Line }
          }
          $queue=@(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fails=@(Select-String -Path $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          Write-Host "CD869_MAIN_BASELINE_QUEUE=$($queue.Count)"
          Write-Host "CD869_MAIN_BASELINE_FAILURE_LINES=$($fails.Count)"
          if($exit -ne 0){ exit $exit }
          if($queue.Count -eq 0){ throw 'CD869_MAIN_BASELINE_QUEUE_MARKER_MISSING' }
          if($fails.Count -gt 0){ throw "CD869_MAIN_BASELINE_HAS_FAILURES=$($fails.Count)" }
          Write-Host 'CD869_MAIN_BASELINE_FULL=PASS'
