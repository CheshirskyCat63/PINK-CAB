name: CD-869 R2 Road Construction

on:
  push:
    branches:
      - feat/CD-869-r2-median-separators
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd869-r2-road-construction
  cancel-in-progress: true

jobs:
  r2:
    # R2 authoring is frozen after the canonical RoadConstruction asset bake.
    # Push events remain only as a concurrency sentinel so any stale queued
    # authoring run is cancelled; real rebakes require explicit dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: R2 raised median and curb gate
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 60
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      ACCEPTED_INPUT_SHA: 8168d72406af6934ab20eace583c2b895f0620b7

    steps:
      - name: Checkout exact R2 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Exact-head preflight and frozen-input guard
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R2_HEAD_MISMATCH $head != $env:GITHUB_SHA" }
          $tracked=@(git status --porcelain --untracked-files=no)
          if($tracked.Count -ne 0){
            $tracked | ForEach-Object { Write-Host $_ }
            throw 'R2_TRACKED_CHECKOUT_DIRTY'
          }

          $frozen=@(
            'Source/PinkCab/Private/Runtime/PinkCabChaosTatraPawnDriver.cpp',
            'Source/PinkCab/Private/Runtime/PinkCabChaosTatraPawnCockpit.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabPlayerInputAdapter.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabSemanticInputRouter.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabPhysicalInputConvention.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabWheelInputResponse.cpp',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPlayerInputAdapter.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPlayerInputSample.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabSemanticInputRouter.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPhysicalInputConvention.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabWheelInputResponse.h',
            'Source/PinkCab/Private/Vehicle/PinkCabVehicleInputFrame.cpp',
            'Source/PinkCab/Public/Vehicle/PinkCabVehicleInputFrame.h',
            'Source/PinkCab/Public/Vehicle/Detail/PinkCabVehicleInputFrame.inl',
            'Config/DefaultInput.ini'
          )
          $delta=@()
          foreach($path in $frozen){
            $d=@(git diff --name-only "$env:ACCEPTED_INPUT_SHA..HEAD" -- $path)
            if($d.Count -gt 0){ $delta += $d }
          }
          $delta=@($delta | Sort-Object -Unique)
          if($delta.Count -gt 0){
            $delta | ForEach-Object { Write-Host "R2_FROZEN_INPUT_DELTA=$_" }
            throw 'R2_FROZEN_INPUT_SOURCE_CHANGED'
          }
          Write-Host 'R2_FROZEN_INPUT_SOURCE_IDENTICAL=PASS'
          Write-Host "R2_HEAD=$head"

      - name: Build PinkCabEditor
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Get-Process -Name PinkCab -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=6
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R2_EDITOR_BUILD=PASS'

      - name: Generate R2 road construction asset
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $construction=Join-Path $env:GITHUB_WORKSPACE 'Content\World\L1\Road\RoadConstruction.uasset'
          if(Test-Path $construction){
            Remove-Item -LiteralPath $construction -Force
            Write-Host 'R2_STALE_CONSTRUCTION_REMOVED=1'
          }
          if(Test-Path $construction){ throw 'R2_STALE_CONSTRUCTION_DELETE_FAILED' }

          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_AUTHORING.log'
          & $editor $project -unattended -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.Editor.GenerateL1RoadConstructionR2" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:' -Quiet){
            throw 'R2_CONSTRUCTION_AUTHORING_FAILED'
          }
          if(-not (Select-String $log -Pattern 'CD869_R2_CONSTRUCTION_BAKE=PASS' -Quiet)){
            throw 'R2_CONSTRUCTION_BAKE_MARKER_MISSING'
          }
          $asset=Join-Path $env:GITHUB_WORKSPACE 'Content\World\L1\Road\RoadConstruction.uasset'
          $material=Join-Path $env:GITHUB_WORKSPACE 'Content\World\L1\Road\Materials\M_PC_L1_CurbConcrete.uasset'
          if(-not (Test-Path $asset)){ throw 'R2_CONSTRUCTION_ASSET_MISSING_AFTER_AUTHORING' }
          if(-not (Test-Path $material)){ throw 'R2_CURB_MATERIAL_MISSING_AFTER_AUTHORING' }
          Write-Host 'R2_CONSTRUCTION_AUTHORING=PASS'

      - name: Commit R2 construction content
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Content/World/L1/Road/RoadConstruction.uasset Content/World/L1/Road/Materials/M_PC_L1_CurbConcrete.uasset
          if(git diff --cached --quiet){
            Write-Host 'R2_CONTENT_DIFF=0'
          } else {
            git commit -m 'asset(CD-869): bake R2 median separators and curbs'
            git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
            Write-Host "R2_CONTENT_COMMIT=$((git rev-parse HEAD).Trim())"
          }

      - name: Run R2 construction model tests
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_CONSTRUCTION.log'
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.World.L1Road.R2" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $queue=@(Select-String $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fails=@(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          if($queue.Count -eq 0){ throw 'R2_QUEUE_MARKER_MISSING' }
          if($fails.Count -gt 0){ throw "R2_AUTOMATION_FAILURES=$($fails.Count)" }
          Write-Host "R2_CONSTRUCTION_MODEL=PASS $($queue[-1].Line)"
