name: PINK CAB Repository Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinkcab-repository-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      run_physics: ${{ steps.change_scope.outputs.run_physics }}
      candidate_sha: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Classify complete candidate scope
        id: change_scope
        env:
          PINKCAB_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PINKCAB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PINKCAB_PUSH_BEFORE: ${{ github.event.before }}
        shell: pwsh
        run: |
          python scripts/ci/acceptance_contract.py scope
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Install workflow parser
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Script regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Architecture and vehicle authority
        shell: pwsh
        run: |
          python scripts/code_health.py --root . --policy Config/CodeHealthPolicy.json --require-zero-debt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python scripts/ci/verify_vehicle_physics_writers.py --manifest docs/vehicle_physics/STATE_WRITER_INVENTORY.csv --evidence Saved/GitHubGate/REPOSITORY_WRITERS.json
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Parse workflow YAML
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import yaml

          class UniqueLoader(yaml.SafeLoader):
              pass

          def mapping(loader, node, deep=False):
              result = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in result:
                      raise ValueError(f"duplicate YAML key: {key}")
                  result[key] = loader.construct_object(value_node, deep=deep)
              return result

          UniqueLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, mapping)
          scripts = []
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              workflow = yaml.load(path.read_text(encoding="utf-8"), Loader=UniqueLoader)
              for job_name, job in workflow.get("jobs", {}).items():
                  ids = set()
                  names = set()
                  for step in job.get("steps", []):
                      if step.get("id"):
                          if step["id"] in ids:
                              raise ValueError(f"{path}: duplicate step id {step['id']}")
                          ids.add(step["id"])
                      if step.get("name"):
                          if step["name"] in names:
                              raise ValueError(f"{path}: duplicate step name {step['name']}")
                          names.add(step["name"])
                      if "run" in step and step.get("shell", "").split(" ")[0] in ("pwsh", "powershell"):
                          scripts.append({"workflow": str(path), "job": job_name,
                                          "step": step.get("name", ""), "script": step["run"]})
          output = Path(os.environ["RUNNER_TEMP"]) / "pinkcab-workflow-scripts.json"
          output.write_text(json.dumps(scripts), encoding="utf-8")
          print(f"YAML validation passed; PowerShell blocks={len(scripts)}")

      - name: Parse embedded PowerShell
        shell: pwsh
        run: |
          $blocks=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'pinkcab-workflow-scripts.json') -Raw | ConvertFrom-Json
          $failureCount=0
          foreach($block in $blocks){
            $source=[regex]::Replace($block.script,'\$\{\{.*?\}\}','CI_EXPRESSION')
            $tokens=$null; $parseErrors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseInput($source,[ref]$tokens,[ref]$parseErrors)
            foreach($error in $parseErrors){
              Write-Host "$($block.workflow): $($block.step): $($error.Message)"
              $failureCount++
            }
          }
          if($failureCount -gt 0){ throw "PINKCAB_WORKFLOW_POWERSHELL_ERRORS=$failureCount" }
          Write-Host "PINKCAB_WORKFLOW_POWERSHELL_PARSE=PASS blocks=$($blocks.Count)"

  physics-tdd:
    needs: verify
    if: ${{ needs.verify.outputs.run_physics == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) }}
    uses: ./.github/workflows/pinkcab-vehicle-physics-tdd.yml
    with:
      candidate_sha: ${{ needs.verify.outputs.candidate_sha }}

  p02:
    needs: [verify, physics-tdd]
    if: ${{ needs.verify.outputs.run_physics == 'true' }}
    uses: ./.github/workflows/cd648-p02-phy009.yml
    with:
      candidate_sha: ${{ needs.verify.outputs.candidate_sha }}
      reuse_tdd_evidence: true

  acceptance:
    name: Gameplay acceptance gate
    needs: [verify, physics-tdd, p02]
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: false
          persist-credentials: false

      - name: Enforce all required evidence
        env:
          PINKCAB_RUNTIME_REQUIRED: ${{ needs.verify.outputs.run_physics }}
          PINKCAB_STATIC_RESULT: ${{ needs.verify.result }}
          PINKCAB_TDD_RESULT: ${{ needs.physics-tdd.result }}
          PINKCAB_P02_RESULT: ${{ needs.p02.result }}
        shell: pwsh
        run: |
          python scripts/ci/acceptance_contract.py gate
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
