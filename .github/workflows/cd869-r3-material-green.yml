name: CD-869 R3 Material Fix GREEN

on:
  push:
    branches:
      - feat/CD-869-r3-metaroad-markings
    paths:
      - .github/workflows/cd869-r3-material-green.yml

permissions:
  contents: write

concurrency:
  group: cd869-r3-material-green
  cancel-in-progress: true

jobs:
  green:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 35
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Exact preflight and build
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R3_GREEN_HEAD_MISMATCH $head" }
          $dirty=@(git status --porcelain --untracked-files=no)
          if($dirty.Count -ne 0){ $dirty | % { Write-Host $_ }; throw 'R3_GREEN_TRACKED_DIRTY' }
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=6
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R3_MATERIAL_GREEN_BUILD=PASS'

      - name: Rebind exact mark material through project runtime-material generator
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\R3_MATERIAL_REBIND.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.Editor.GenerateL1EndlessRoadRuntimeMaterials" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0 -or (Select-String $log -Pattern 'Result=\{Fail\}|LogAutomationController: Error:' -Quiet)){
            Get-Content $log -Tail 240
            throw 'R3_MATERIAL_REBIND_FAIL'
          }
          if(-not(Select-String $log -Pattern 'CD869_RUNTIME_MATERIAL_OWNERSHIP=PASS' -Quiet)){ throw 'R3_MATERIAL_REBIND_MARKER_MISSING' }
          Write-Host 'R3_MATERIAL_REBIND=PASS'

      - name: Restore frozen R2 assets and keep only R3 material corrections
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @(git diff --name-only -- 'Content/World/L1/Road')){
            if($path -like 'Content/World/L1/Road/RoadMarks*.uasset' -or
               $path -eq 'Content/World/L1/Road/Materials/M_PC_L1_Mark.uasset'){
              continue
            }
            Write-Host "R3_RESTORE_FROZEN=$path"
            git restore --source=$env:GITHUB_SHA --worktree -- $path
          }

          $remaining=@(git diff --name-only -- 'Content/World/L1/Road')
          $bad=@($remaining | Where-Object {
            $_ -notlike 'Content/World/L1/Road/RoadMarks*.uasset' -and
            $_ -ne 'Content/World/L1/Road/Materials/M_PC_L1_Mark.uasset'
          })
          if($bad.Count -gt 0){
            $bad | % { Write-Host "R3_BAD_CONTENT_DIFF=$_" }
            throw 'R3_MATERIAL_SCOPE_VIOLATION'
          }
          $markDiff=@($remaining | Where-Object { $_ -like 'Content/World/L1/Road/RoadMarks*.uasset' })
          if($markDiff.Count -ne 50){ throw "R3_CHANGED_MARK_COUNT=$($markDiff.Count)" }
          Write-Host 'R3_R2_BYTES_RESTORED=PASS'
          Write-Host "R3_CHANGED_MARK_COUNT=$($markDiff.Count)"

      - name: GREEN exact R3 material contract
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          foreach($suite in @(
            'PinkCab.World.L1Road.R3.NativeMetaRoadMarkings',
            'PinkCab.World.L1Road.R2.NativeMetaRoadAsset',
            'PinkCab.World.L1EndlessRoad',
            'PinkCab.World.Materialization'
          )){
            $safe=$suite -replace '[^A-Za-z0-9_.-]','_'
            $log=Join-Path $env:GITHUB_WORKSPACE ("Saved\GitHubGate\R3_MATERIAL_GREEN_$safe.log")
            & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests $suite" "-TestExit=Automation Test Queue Empty"
            if($LASTEXITCODE -ne 0 -or (Select-String $log -Pattern 'Result=\{Fail\}|LogAutomationController: Error:' -Quiet)){
              Get-Content $log -Tail 220
              throw "R3_MATERIAL_GREEN_FAIL=$suite"
            }
            Write-Host "R3_MATERIAL_GREEN_TEST_PASS=$suite"
          }
          Write-Host 'R3_MATERIAL_GREEN=PASS'

      - name: Commit only corrected R3 mark assets
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Content/World/L1/Road/RoadMarks*.uasset'
          if(Test-Path 'Content\World\L1\Road\Materials\M_PC_L1_Mark.uasset'){
            git add -- 'Content/World/L1/Road/Materials/M_PC_L1_Mark.uasset'
          }
          $staged=@(git diff --cached --name-only)
          $bad=@($staged | Where-Object {
            $_ -notlike 'Content/World/L1/Road/RoadMarks*.uasset' -and
            $_ -ne 'Content/World/L1/Road/Materials/M_PC_L1_Mark.uasset'
          })
          if($bad.Count -gt 0){ $bad | % { Write-Host "R3_BAD_STAGED=$_" }; throw 'R3_STAGED_SCOPE_VIOLATION' }
          $marks=@($staged | Where-Object { $_ -like 'Content/World/L1/Road/RoadMarks*.uasset' })
          if($marks.Count -ne 50){ throw "R3_STAGED_MARK_COUNT=$($marks.Count)" }
          git commit -m 'asset(CD-869): apply visible mark paint to native RoadMarks'
          $assetHead=(git rev-parse HEAD).Trim()
          git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
          Write-Host "R3_VISIBLE_MARK_ASSET_HEAD=$assetHead"
          Write-Host 'R3_VISIBLE_MARK_ASSET_COMMIT=PASS'
