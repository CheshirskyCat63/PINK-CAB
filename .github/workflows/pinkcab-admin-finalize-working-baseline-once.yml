name: PINK-CAB finalize accepted working baseline once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  finalize:
    if: ${{ github.event.issue.pull_request && github.event.issue.number == 7 && github.event.comment.user.login == 'CheshirskyCat63' && github.event.comment.body == '/pinkcab-finalize-working-baseline' }}
    runs-on: ubuntu-latest
    steps:
      - name: Finalize accepted baseline into main
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_SHA: 8168d72406af6934ab20eace583c2b895f0620b7
          RECOVERY_BRANCH: fix/CD-848-recovery-r1-input-contract
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout main
          rm -f .github/workflows/pinkcab-admin-finalize-working-baseline-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "admin: remove completed working-baseline finalizer"
            git push origin main
          fi

          git fetch origin main "${RECOVERY_BRANCH}"
          git checkout -B "${RECOVERY_BRANCH}" "origin/${RECOVERY_BRANCH}"
          if ! git merge-base --is-ancestor "${ACCEPTED_SHA}" HEAD; then
            echo "::error::Accepted SHA is not an ancestor of recovery branch"
            exit 1
          fi

          main_only_files="$(git log --format= --name-only HEAD..origin/main | sed '/^$/d' | sort -u)"
          if [ -n "$main_only_files" ]; then
            echo "$main_only_files"
            bad="$(printf '%s\n' "$main_only_files" | grep -Ev '^(\.github/workflows/|docs/|README\.md$)' || true)"
            if [ -n "$bad" ]; then
              echo "::error::main-only commits contain non-admin paths:"
              echo "$bad"
              exit 1
            fi
          fi

          git merge --no-edit -X ours origin/main
          runtime_changes="$(git diff --name-only "${ACCEPTED_SHA}..HEAD" | grep -E '^(Source/|Content/)' || true)"
          if [ -n "$runtime_changes" ]; then
            echo "::error::Finalize merge changed runtime paths after accepted SHA:"
            echo "$runtime_changes"
            exit 1
          fi
          git push origin "${RECOVERY_BRANCH}"

          gh pr ready 7 --repo "$GITHUB_REPOSITORY" || true
          gh pr merge 7 --repo "$GITHUB_REPOSITORY" --merge --subject "freeze: accept PINK-CAB working baseline 8168d724" --body "Owner accepted working baseline. Runtime evidence: SHA 8168d72406af6934ab20eace583c2b895f0620b7, run 35809749568. Administrative main/recovery divergence reconciled without Source/Content changes after the accepted SHA."

          git fetch origin main
          merged_main="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "${ACCEPTED_SHA}" "$merged_main"; then
            echo "::error::Accepted SHA missing from merged main"
            exit 1
          fi
          git push origin --delete "${RECOVERY_BRANCH}"
          echo "PINKCAB_WORKING_BASELINE_FINALIZED accepted=${ACCEPTED_SHA} main=${merged_main}"
