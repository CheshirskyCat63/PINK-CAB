name: CD-869 R4 Road Visual v2

on:
  push:
    branches:
      - feat/CD-869-r4-road-visual-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd869-r4-road-visual-v2
  cancel-in-progress: true

jobs:
  green:
    name: R4 GREEN + package + HUMAN launch
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 120
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      DELIVERY_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB
      ARCHIVE: Artifacts\CD869R4Human

    steps:
      - name: Checkout exact R4 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Exact-head clean preflight
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R4_HEAD_MISMATCH $head != $env:GITHUB_SHA" }
          $status=@(git status --porcelain --untracked-files=all)
          if($status.Count -ne 0){
            $status | ForEach-Object { Write-Host "R4_DIRTY=$_" }
            throw 'R4_WORKTREE_NOT_CLEAN'
          }
          Write-Host "R4_HEAD=$head"
          Write-Host "R4_BRANCH=$((git branch --show-current).Trim())"
          Write-Host "R4_REMOTE=$((git remote get-url origin).Trim())"
          git log -5 --oneline
          Write-Host 'R4_PREFLIGHT=PASS'

      - name: Build PinkCabEditor
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R4_EDITOR_BUILD=PASS'

      - name: Snapshot frozen R2/R3 road assets
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'Content\World\L1\Road'
          $paths=@()
          $paths += Get-ChildItem $root -Filter 'RoadMarks*.uasset' -File
          $paths += Get-ChildItem $root -Filter 'RoadCurbs*.uasset' -File
          if(@($paths).Count -ne 82){ throw "R4_FROZEN_ASSET_COUNT=$(@($paths).Count) expected=82" }
          $lines=@()
          foreach($p in $paths | Sort-Object FullName){
            $hash=(Get-FileHash $p.FullName -Algorithm SHA256).Hash
            $rel=$p.FullName.Substring($env:GITHUB_WORKSPACE.Length+1)
            $lines += "$hash|$rel"
          }
          $file=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\R4_FROZEN_BEFORE.txt'
          New-Item -ItemType Directory -Force (Split-Path $file) | Out-Null
          $lines | Set-Content $file
          Write-Host 'R4_FROZEN_SNAPSHOT=PASS marks=50 curbs=32'

      - name: Generate project-owned R4 asphalt
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R4_GENERATE.log'
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.Editor.GenerateL1RoadR4VisualMaterial" "-TestExit=Automation Test Queue Empty"
          $exit=$LASTEXITCODE
          Get-Content $log | Select-String -Pattern 'CD869_R4_|Test Completed. Result=|LogAutomationController: Error:' | Select-Object -Last 120 | ForEach-Object { Write-Host $_.Line }
          if($exit -ne 0){ exit $exit }
          if(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:' -Quiet){ throw 'R4_GENERATOR_AUTOMATION_FAILED' }
          if(-not (Select-String $log -Pattern 'CD869_R4_VISUAL_MATERIAL_GENERATED=PASS' -Quiet)){ throw 'R4_GENERATOR_MARKER_MISSING' }
          Write-Host 'R4_GENERATOR=PASS'

      - name: Prove frozen assets unchanged and runtime independent of MetaRoad
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $before=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\R4_FROZEN_BEFORE.txt'
          $root=Join-Path $env:GITHUB_WORKSPACE 'Content\World\L1\Road'
          $paths=@()
          $paths += Get-ChildItem $root -Filter 'RoadMarks*.uasset' -File
          $paths += Get-ChildItem $root -Filter 'RoadCurbs*.uasset' -File
          $after=@()
          foreach($p in $paths | Sort-Object FullName){
            $hash=(Get-FileHash $p.FullName -Algorithm SHA256).Hash
            $rel=$p.FullName.Substring($env:GITHUB_WORKSPACE.Length+1)
            $after += "$hash|$rel"
          }
          $expected=Get-Content $before
          $delta=@(Compare-Object $expected $after)
          if($delta.Count -ne 0){
            $delta | ForEach-Object { Write-Host $_ }
            throw 'R4_FROZEN_R2_R3_ASSET_BYTES_CHANGED'
          }

          $changed=@(git status --porcelain --untracked-files=no)
          $allowed='Content/World/L1/Road/Materials/M_PC_L1_Asphalt.uasset'
          foreach($line in $changed){
            $p=$line.Substring(3).Replace('\','/')
            Write-Host "R4_GENERATED_CHANGE=$p"
            if($p -ne $allowed){ throw "R4_SCOPE_VIOLATION_FILE=$p" }
          }
          if($changed.Count -ne 1){ throw "R4_EXPECTED_ONE_GENERATED_ASSET count=$($changed.Count)" }

          $material=Join-Path $env:GITHUB_WORKSPACE $allowed
          $bytes=[System.IO.File]::ReadAllBytes($material)
          $ascii=[Text.Encoding]::ASCII.GetString($bytes)
          $unicode=[Text.Encoding]::Unicode.GetString($bytes)
          if($ascii -match '/MetaRoad/' -or $unicode -match '/MetaRoad/'){ throw 'R4_RUNTIME_METAROAD_DEPENDENCY_FOUND' }
          Write-Host 'R4_FROZEN_BYTES=PASS'
          Write-Host 'R4_RUNTIME_METAROAD_DEPENDENCY=NONE'

      - name: Commit generated R4 asphalt asset
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Content/World/L1/Road/Materials/M_PC_L1_Asphalt.uasset
          if(git diff --cached --quiet){ throw 'R4_ASPHALT_NOT_STAGED' }
          git commit -m 'asset(CD-869): generate Road Visual v2 asphalt [skip ci]'
          git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
          $sha=(git rev-parse HEAD).Trim()
          Write-Host "R4_ASSET_COMMIT=$sha"

      - name: Run R4 and frozen regressions
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $tests=@(
            'PinkCab.World.L1Road.R4.RoadVisualV2',
            'PinkCab.World.L1Road.R3.NativeMetaRoadMarkings',
            'PinkCab.World.L1Road.R2.NativeMetaRoadAsset',
            'PinkCab.World.L1EndlessRoad',
            'PinkCab.World.Materialization',
            'PinkCab.G1.HInp.HGate'
          )
          foreach($test in $tests){
            $safe=$test.Replace('.','_')
            $log=Join-Path $env:GITHUB_WORKSPACE "Saved\GitHubGate\R4_$safe.log"
            & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests $test" "-TestExit=Automation Test Queue Empty"
            $exit=$LASTEXITCODE
            if($exit -ne 0){ exit $exit }
            $queue=@(Select-String $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
            $fails=@(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
            if($queue.Count -eq 0 -or $fails.Count -gt 0){
              $fails | Select-Object -Last 100 | ForEach-Object { Write-Host $_.Line }
              throw "R4_REGRESSION_FAIL test=$test queue=$($queue.Count) fails=$($fails.Count)"
            }
            Write-Host "R4_TEST_PASS=$test $($queue[-1].Line)"
          }

      - name: Repo hygiene and strict zero-debt
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest scripts.tests.test_repo_hygiene scripts.tests.test_code_health -v
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R4_ZERO_DEBT=PASS'

      - name: Fresh Win64 R4 package
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $uat=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          if(Test-Path $archive){ Remove-Item $archive -Recurse -Force }
          New-Item -ItemType Directory -Force $archive | Out-Null
          $backup="$project.r4-backup"
          Copy-Item $project $backup -Force
          $exit=1
          try {
            $descriptor=Get-Content -Raw $project | ConvertFrom-Json
            $descriptor.Modules=@($descriptor.Modules | Where-Object { $_.Name -ne 'PinkCabTests' })
            $descriptor.Plugins=@($descriptor.Plugins | Where-Object { $_.Name -notin @('MetaRoad','StructUtils') })
            $descriptor | ConvertTo-Json -Depth 32 | Set-Content $project -Encoding UTF8
            & $uat -WaitForUATMutex BuildCookRun "-project=$project" -noP4 -platform=Win64 -clientconfig=Development -build -cook "-map=/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight" -stage -pak -archive "-archivedirectory=$archive" -nodebuginfo -utf8output
            $exit=$LASTEXITCODE
          } finally {
            Move-Item $backup $project -Force
          }
          if($exit -ne 0){ exit $exit }
          if(@(git status --porcelain --untracked-files=no).Count -ne 0){ throw 'R4_DESCRIPTOR_RESTORE_DIRTY' }
          $outer=Join-Path $archive 'Windows\PinkCab.exe'
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $outer) -or -not (Test-Path $inner)){ throw 'R4_PACKAGE_EXE_MISSING' }
          & .\scripts\ci\ensure-dev-signing.ps1 -Path @($outer,$inner)
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if((Get-AuthenticodeSignature $inner).Status -ne [System.Management.Automation.SignatureStatus]::Valid){ throw 'R4_SIGNATURE_INVALID' }
          Write-Host 'R4_FRESH_PACKAGE=PASS'

      - name: Packaged R4 smoke
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R4_PACKAGED.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $proc=Start-Process -FilePath $inner -ArgumentList @('/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight','-log','-windowed','-ResX=1280','-ResY=720','-PinkCabGateTelemetry',"-abslog=$log") -WorkingDirectory (Split-Path $inner) -PassThru
          try {
            $deadline=[DateTime]::UtcNow.AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 300
              $proc.Refresh()
              if($proc.HasExited){ throw "R4_GAME_EXITED_EARLY code=$($proc.ExitCode)" }
              $loaded=(Test-Path $log) -and [bool](Select-String $log -Pattern 'L_PinkCab_L1_EndlessStraight' -Quiet)
              $wheels=(Test-Path $log) -and [bool](Select-String $log -Pattern 'PINKCAB_GATE_STATE .*wheels=4' -Quiet)
            } while(( -not $loaded -or -not $wheels) -and [DateTime]::UtcNow -lt $deadline)
            if(-not $loaded){ throw 'R4_MAP_NOT_LOADED' }
            if(-not $wheels){ throw 'R4_TATRA_TELEMETRY_MISSING' }
            $critical=@(Select-String $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Failed to load package|LogStreaming: Error:|LogLinker: Error:' -ErrorAction SilentlyContinue)
            if($critical.Count -gt 0){ throw "R4_PACKAGED_CRITICAL=$($critical.Count)" }
            Write-Host 'R4_PACKAGED_SMOKE=PASS'
          } finally {
            if($proc -and -not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Install R4 HUMAN build and shortcuts
        id: install
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          $short=$sha.Substring(0,8)
          $source=Join-Path $env:GITHUB_WORKSPACE "$env:ARCHIVE\Windows"
          $delivery=Join-Path $env:DELIVERY_BASE ("CD869_R4_VISUAL_{0}_RUN{1}" -f $short,$env:GITHUB_RUN_ID)
          if(Test-Path $delivery){ Remove-Item $delivery -Recurse -Force }
          New-Item -ItemType Directory -Force $delivery | Out-Null
          & robocopy $source (Join-Path $delivery 'Windows') /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          $rc=$LASTEXITCODE
          if($rc -ge 8){ throw "R4_DELIVERY_COPY_FAILED $rc" }
          $global:LASTEXITCODE=0
          $outer=Join-Path $delivery 'Windows\PinkCab.exe'
          if(-not (Test-Path $outer)){ throw 'R4_DELIVERED_EXE_MISSING' }
          $desktop=[Environment]::GetFolderPath('Desktop')
          $ws=New-Object -ComObject WScript.Shell
          foreach($name in @('PINKCAB R4 HUMAN.lnk','PINKCAB Latest.lnk')){
            $lnk=Join-Path $desktop $name
            Remove-Item $lnk -Force -ErrorAction SilentlyContinue
            $s=$ws.CreateShortcut($lnk)
            $s.TargetPath=$outer
            $s.Arguments='/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
            $s.WorkingDirectory=(Split-Path $outer)
            $s.Description="PINK CAB CD-869 R4 HUMAN $sha"
            $s.Save()
            Write-Host "R4_SHORTCUT=$lnk"
          }
          Set-Content (Join-Path $delivery 'CANDIDATE_SHA.txt') $sha -NoNewline
          Set-Content (Join-Path $delivery 'RUN_ID.txt') $env:GITHUB_RUN_ID -NoNewline
          "outer=$outer" | Out-File $env:GITHUB_OUTPUT -Append
          "delivery=$delivery" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "R4_HUMAN_DELIVERY=$delivery"

      - name: Launch R4 HUMAN build
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        env:
          R4_EXE: ${{ steps.install.outputs.outer }}
        run: |
          $ErrorActionPreference='Stop'
          $saved=$env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID=''
          try {
            $proc=Start-Process -FilePath $env:R4_EXE -ArgumentList @('/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight','-windowed','-ResX=1600','-ResY=900') -WorkingDirectory (Split-Path $env:R4_EXE) -PassThru
            Start-Sleep -Seconds 5
            $proc.Refresh()
            if($proc.HasExited){ throw "R4_HUMAN_EXITED_EARLY code=$($proc.ExitCode)" }
            Write-Host "R4_HUMAN_LAUNCHED_PID=$($proc.Id)"
            Write-Host 'R4_HUMAN_PENDING'
          } finally {
            $env:RUNNER_TRACKING_ID=$saved
          }
