name: CD-869 Fast Human Delivery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cd869-deliver.yml'
      - 'Source/PinkCabTests/Private/World/PinkCabL1EndlessRoadMapGenerator.cpp'
      - 'Source/PinkCabTests/Private/World/PinkCabL1EndlessRoadMapTests.cpp'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact candidate SHA to package and launch'
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd869-main-baseline
  cancel-in-progress: true

jobs:
  deliver:
    name: Reuse package, smoke, deliver, launch
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 30
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      DELIVERY_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB
      ARCHIVE: Artifacts\CD869Human
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          clean: false
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Materialize verified local LFS
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          python .\scripts\ci\materialize_local_lfs.py `
            --workspace "$env:GITHUB_WORKSPACE" `
            --base-ref origin/main
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          # Local git-lfs cache is materialized first. Unresolved unrelated
          # pointers are allowed here; the exact target map is regenerated from
          # source below and BuildCookRun is the hard runtime dependency gate.
          $dirty=@(git status --porcelain)
          if($dirty.Count -ne 0){
            $dirty | ForEach-Object { Write-Host "CD869_DIRTY_AFTER_LOCAL_LFS $_" }
            throw "CD869_LOCAL_LFS_DIRTIED_WORKTREE count=$($dirty.Count)"
          }
          Write-Host 'CD869_LOCAL_LFS_MATERIALIZATION=PASS'

      - name: Exact-head and package preflight
        id: preflight
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:CANDIDATE_SHA){ throw "CD869_DELIVERY_HEAD_MISMATCH $head != $env:CANDIDATE_SHA" }

          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $sourceSha=Join-Path $archive 'SOURCE_SHA.txt'
          $reuse=(Test-Path $inner) -and
              (Test-Path $sourceSha) -and
              ((Get-Content -Raw $sourceSha).Trim() -eq $head)
          if($reuse){
            Write-Host "CD869_PACKAGE_REUSE=1 sha=$head $inner"
            'package_ready=true' | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "CD869_PACKAGE_REUSE=0 sha=$head"
            'package_ready=false' | Out-File $env:GITHUB_OUTPUT -Append
          }

      - name: Rebuild canonical R4 road assets from MetaRoad authoring source
        if: ${{ steps.preflight.outputs.package_ready != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $gate=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate'
          New-Item -ItemType Directory -Force $gate | Out-Null

          $road=@(
            git lfs ls-files -n |
              Where-Object {
                $_ -like 'Content/World/L1/Road/Road*.uasset'
              }
          )
          if($road.Count -lt 84){
            throw "CD869_ROAD_AUTHORING_SET_INCOMPLETE count=$($road.Count)"
          }

          # Road meshes are deterministic authoring outputs. Remove unresolved
          # LFS pointers and rebuild them from exact-head authoring code + the
          # installed canonical MetaRoad plugin.
          foreach($path in $road){
            Remove-Item (Join-Path $env:GITHUB_WORKSPACE $path) -Force -ErrorAction SilentlyContinue
          }
          Remove-Item (Join-Path $env:GITHUB_WORKSPACE 'Content\Dev\Authoring\L_PC_L1_MetaRoadAuthoring.umap') -Force -ErrorAction SilentlyContinue

          & "$env:UE_ROOT\Engine\Build\BatchFiles\Build.bat" PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE -NoUBA -MaxParallelActions=8
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          & .\scripts\ci\run-unreal-automation.ps1 `
            -EngineRoot $env:UE_ROOT `
            -ProjectPath $project `
            -TestName 'PinkCab.Editor.GenerateL1EndlessRoadAssets' `
            -LogPath (Join-Path $gate 'CD869_GENERATE_METAROAD_ASSETS.log') `
            -TimeoutSeconds 300
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          foreach($path in $road){
            $full=Join-Path $env:GITHUB_WORKSPACE $path
            if(-not (Test-Path $full)){ throw "CD869_GENERATED_ROAD_ASSET_MISSING=$path" }
            $bytes=[IO.File]::ReadAllBytes($full)
            if($bytes.Length -lt 1024){ throw "CD869_GENERATED_ROAD_ASSET_TOO_SMALL=$path bytes=$($bytes.Length)" }
            $prefix=[Text.Encoding]::ASCII.GetString($bytes[0..([Math]::Min(80,$bytes.Length-1))])
            if($prefix -like 'version https://git-lfs.github.com/spec/v1*'){
              throw "CD869_GENERATED_ROAD_ASSET_IS_LFS_POINTER=$path"
            }
          }
          Write-Host "CD869_GENERATED_METAROAD_ASSETS=PASS count=$($road.Count)"

          & .\scripts\ci\run-unreal-automation.ps1 `
            -EngineRoot $env:UE_ROOT `
            -ProjectPath $project `
            -TestName 'PinkCab.Editor.GenerateL1EndlessRoadRuntimeMaterials' `
            -LogPath (Join-Path $gate 'CD869_GENERATE_METAROAD_RUNTIME_MATERIALS.log') `
            -TimeoutSeconds 240
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          foreach($test in @(
            'PinkCab.World.L1Road.R2.NativeMetaRoadAsset',
            'PinkCab.World.L1Road.R3.NativeMetaRoadMarkings',
            'PinkCab.World.L1Road.R4.NativeMetaRoadVisualStack'
          )){
            $safe=$test.Replace('.','_')
            & .\scripts\ci\run-unreal-automation.ps1 `
              -EngineRoot $env:UE_ROOT `
              -ProjectPath $project `
              -TestName $test `
              -LogPath (Join-Path $gate ("CD869_" + $safe + ".log")) `
              -TimeoutSeconds 240
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
            Write-Host "CD869_METAROAD_AUTHORING_TEST=PASS test=$test"
          }

      - name: Regenerate canonical endless runtime map from exact-head source
        if: ${{ steps.preflight.outputs.package_ready != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $phys=Join-Path $env:GITHUB_WORKSPACE 'Content\World\L1\Road\Physics\PM_PC_DryAsphalt.uasset'
          $map=Join-Path $env:GITHUB_WORKSPACE 'Content\Dev\Maps\L_PinkCab_L1_EndlessStraight.umap'
          $gate=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate'
          New-Item -ItemType Directory -Force $gate | Out-Null

          # These two assets are authored outputs whose canonical values live in
          # exact-head C++ tests. Never substitute stale LFS bytes for them.
          Remove-Item $phys -Force -ErrorAction SilentlyContinue
          Remove-Item $map -Force -ErrorAction SilentlyContinue

          & .\scripts\ci\run-unreal-automation.ps1 `
            -EngineRoot $env:UE_ROOT `
            -ProjectPath $project `
            -TestName 'PinkCab.Editor.GenerateL1RoadR5DryAsphaltPhysicalMaterial' `
            -LogPath (Join-Path $gate 'CD869_GENERATE_DRY_ASPHALT.log') `
            -TimeoutSeconds 180
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          if(-not (Test-Path $phys)){ throw 'CD869_GENERATED_DRY_ASPHALT_MISSING' }
          $physBytes=[IO.File]::ReadAllBytes($phys)
          if($physBytes.Length -lt 1024){ throw "CD869_GENERATED_DRY_ASPHALT_TOO_SMALL=$($physBytes.Length)" }
          $physPrefix=[Text.Encoding]::ASCII.GetString($physBytes[0..([Math]::Min(80,$physBytes.Length-1))])
          if($physPrefix -like 'version https://git-lfs.github.com/spec/v1*'){ throw 'CD869_GENERATED_DRY_ASPHALT_IS_LFS_POINTER' }
          $physSha=(Get-FileHash $phys -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "CD869_GENERATED_DRY_ASPHALT=PASS sha256=$physSha bytes=$($physBytes.Length)"

          & .\scripts\ci\run-unreal-automation.ps1 `
            -EngineRoot $env:UE_ROOT `
            -ProjectPath $project `
            -TestName 'PinkCab.Editor.GenerateL1EndlessRoadMap' `
            -LogPath (Join-Path $gate 'CD869_GENERATE_ENDLESS_MAP.log') `
            -TimeoutSeconds 180
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          if(-not (Test-Path $map)){ throw 'CD869_GENERATED_MAP_MISSING' }
          $bytes=[IO.File]::ReadAllBytes($map)
          if($bytes.Length -lt 1024){ throw "CD869_GENERATED_MAP_TOO_SMALL=$($bytes.Length)" }
          $prefix=[Text.Encoding]::ASCII.GetString($bytes[0..([Math]::Min(80,$bytes.Length-1))])
          if($prefix -like 'version https://git-lfs.github.com/spec/v1*'){ throw 'CD869_GENERATED_MAP_IS_LFS_POINTER' }
          $mapSha=(Get-FileHash $map -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "CD869_GENERATED_MAP=PASS sha256=$mapSha bytes=$($bytes.Length)"

          foreach($test in @(
            'PinkCab.World.L1Road.R5.DryAsphaltPhysicalSurface',
            'PinkCab.World.L1EndlessRoad.Map.Composition',
            'PinkCab.World.L1EndlessRoad.Asset.MaterialContract'
          )){
            $safe=$test.Replace('.','_')
            & .\scripts\ci\run-unreal-automation.ps1 `
              -EngineRoot $env:UE_ROOT `
              -ProjectPath $project `
              -TestName $test `
              -LogPath (Join-Path $gate ("CD869_" + $safe + ".log")) `
              -TimeoutSeconds 240
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
            Write-Host "CD869_GENERATED_MAP_TEST=PASS test=$test"
          }

          $compositionLog=Join-Path $gate 'CD869_PinkCab_World_L1EndlessRoad_Map_Composition.log'
          if(-not (Select-String -LiteralPath $compositionLog -Pattern 'CD869_ENDLESS_MAP_PACKAGE_FLAGS_LOADED=0x' -Quiet)){
            throw 'CD869_RUNTIME_MAP_PACKAGE_CONTRACT_MARKER_MISSING'
          }
          Write-Host 'CD869_RUNTIME_MAP_PACKAGE_CONTRACT=PASS'

      - name: Build package only when warm package is absent
        if: ${{ steps.preflight.outputs.package_ready != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $uat=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          foreach($stale in @(
            (Join-Path $env:GITHUB_WORKSPACE 'Saved\Cooked\Windows'),
            (Join-Path $env:GITHUB_WORKSPACE 'Saved\StagedBuilds\Windows')
          )){
            if(Test-Path $stale){ Remove-Item $stale -Recurse -Force }
          }
          if(Test-Path $archive){ Remove-Item $archive -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $archive | Out-Null

          $backup="$project.cd869-delivery-backup"
          Copy-Item $project $backup -Force
          $exit=1
          try {
            $descriptor=Get-Content -Raw $project | ConvertFrom-Json
            $descriptor.Modules=@($descriptor.Modules | Where-Object { $_.Name -ne 'PinkCabTests' })
            # MetaRoad runtime/content is required by the canonical R4 road visual stack.
            # StructUtils remains editor-only through PinkCab.uproject TargetAllowList.
            $descriptor | ConvertTo-Json -Depth 32 | Set-Content $project -Encoding UTF8

            # Git LFS pointers are text stubs, not Unreal packages. The cooker
            # scans the project asset registry before following the explicit map
            # dependency closure, so unrelated unresolved pointers would fail
            # PACKAGE_FILE_TAG validation. Quarantine only files that are still
            # literal LFS pointers; generated/materialized runtime assets remain.
            $quarantined=0
            foreach($relative in @(git lfs ls-files -n)){
              $full=Join-Path $env:GITHUB_WORKSPACE $relative
              if(-not (Test-Path -LiteralPath $full)){ continue }
              try {
                $first=Get-Content -LiteralPath $full -TotalCount 1 -ErrorAction Stop
              } catch {
                continue
              }
              if($first -eq 'version https://git-lfs.github.com/spec/v1'){
                Remove-Item -LiteralPath $full -Force
                ++$quarantined
                Write-Host "CD869_COOK_QUARANTINED_LFS_POINTER=$relative"
              }
            }
            Write-Host "CD869_COOK_LFS_POINTER_QUARANTINE=PASS count=$quarantined"

            # The target map and R4 assets are authored during this workflow.
            # Remove only asset-registry caches that can predate those files so
            # the cook process performs a fresh disk discovery of the new map.
            foreach($cache in @(
              (Join-Path $env:GITHUB_WORKSPACE 'Intermediate\CachedAssetRegistry'),
              (Join-Path $env:GITHUB_WORKSPACE 'Intermediate\CachedAssetRegistry.bin'),
              (Join-Path $env:GITHUB_WORKSPACE 'Intermediate\AssetRegistryCache'),
              (Join-Path $env:GITHUB_WORKSPACE 'Saved\AssetRegistry')
            )){
              if(Test-Path $cache){
                Remove-Item $cache -Recurse -Force
                Write-Host "CD869_COOK_REMOVED_ASSET_REGISTRY_CACHE=$cache"
              }
            }

            $cachedRegistryDir=Join-Path $env:GITHUB_WORKSPACE 'Intermediate\CachedAssetRegistry'
            if(Test-Path $cachedRegistryDir){
              throw "CD869_STALE_ASSET_REGISTRY_SURVIVED=$cachedRegistryDir"
            }
            Write-Host 'CD869_FRESH_ASSET_REGISTRY_PRECOOK=PASS'

            $mapDir=Join-Path $env:GITHUB_WORKSPACE 'Content\Dev\Maps'
            & $uat -WaitForUATMutex BuildCookRun "-project=$project" -noP4 -platform=Win64 -clientconfig=Development -build -cook "-map=/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight" "-CookDir=$mapDir" "-AdditionalCookerOptions=-NoEditorDomain" -stage -pak -archive "-archivedirectory=$archive" -nodebuginfo -utf8output
            $exit=$LASTEXITCODE
          }
          finally {
            Move-Item $backup $project -Force
          }
          if($exit -ne 0){ exit $exit }

          $cookedRoot=Join-Path $env:GITHUB_WORKSPACE 'Saved\Cooked\Windows'
          $cookedMap=@(
            Get-ChildItem -LiteralPath $cookedRoot -Recurse -File -Filter 'L_PinkCab_L1_EndlessStraight.umap' -ErrorAction SilentlyContinue
          )
          if($cookedMap.Count -lt 1){
            throw 'CD869_COOKED_ENDLESS_MAP_MISSING'
          }
          $cookedMap | ForEach-Object { Write-Host "CD869_COOKED_ENDLESS_MAP=$($_.FullName)" }

          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'CD869_INNER_EXE_MISSING_AFTER_COOK' }
          $head=(git rev-parse HEAD).Trim()
          Set-Content (Join-Path $archive 'SOURCE_SHA.txt') $head -NoNewline
          Write-Host "CD869_PACKAGE_BUILD=PASS sha=$head"

      - name: Sign only the real game executable
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'CD869_INNER_EXE_MISSING' }

          & .\scripts\ci\ensure-dev-signing.ps1 -Path @($inner)
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          $sig=Get-AuthenticodeSignature $inner
          if($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid){
            throw "CD869_INNER_SIGNATURE_INVALID $($sig.Status)"
          }
          Write-Host 'CD869_INNER_SIGNING=PASS'

      - name: Packaged endless smoke
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_FAST_DELIVERY_SMOKE.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          $proc=Start-Process -FilePath $inner -ArgumentList @(
            '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
            '-log','-windowed','-ResX=1280','-ResY=720',
            '-PinkCabGateTelemetry',
            '-PinkCabRoadMaterialAudit',
            "-abslog=$log"
          ) -WorkingDirectory (Split-Path $inner) -PassThru
          try {
            $deadline=[DateTime]::UtcNow.AddSeconds(35)
            do {
              Start-Sleep -Milliseconds 300
              $proc.Refresh()
              if($proc.HasExited){ throw "CD869_SMOKE_EXITED_EARLY code=$($proc.ExitCode)" }
              $loaded=(Test-Path $log) -and [bool](Select-String $log -Pattern 'L_PinkCab_L1_EndlessStraight' -Quiet)
              $wheels=(Test-Path $log) -and [bool](Select-String $log -Pattern 'PINKCAB_GATE_STATE .*wheels=4' -Quiet)
              $materials=(Test-Path $log) -and [bool](Select-String $log -Pattern 'PINKCAB_ROAD_MATERIAL_AUDIT=PASS' -Quiet)
            } while(( -not $loaded -or -not $wheels -or -not $materials) -and [DateTime]::UtcNow -lt $deadline)

            if(-not $loaded){ throw 'CD869_SMOKE_MAP_NOT_LOADED' }
            if(-not $wheels){ throw 'CD869_SMOKE_TATRA_TELEMETRY_MISSING' }
            if(-not $materials){ throw 'CD869_SMOKE_ROAD_MATERIAL_AUDIT_MISSING' }

            $critical=@(Select-String $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Failed to load package|LogStreaming: Error:|LogLinker: Error:' -ErrorAction SilentlyContinue)
            if($critical.Count -gt 0){ throw "CD869_SMOKE_CRITICAL=$($critical.Count)" }
            Write-Host 'CD869_PACKAGED_ENDLESS_SMOKE=PASS'
          }
          finally {
            if($proc -and -not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Install latest build and shortcuts
        id: install
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          $short=$sha.Substring(0,8)
          $source=Join-Path $env:GITHUB_WORKSPACE "$env:ARCHIVE\Windows"
          $delivery=Join-Path $env:DELIVERY_BASE ("CD869_ENDLESS_{0}_RUN{1}" -f $short,$env:GITHUB_RUN_ID)
          if(Test-Path $delivery){ Remove-Item $delivery -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $delivery | Out-Null

          & robocopy $source (Join-Path $delivery 'Windows') /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          $rc=$LASTEXITCODE
          if($rc -ge 8){ throw "CD869_COPY_FAILED $rc" }
          $global:LASTEXITCODE=0

          $inner=Join-Path $delivery 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'CD869_DELIVERED_INNER_EXE_MISSING' }

          $desktop=[Environment]::GetFolderPath('Desktop')
          $ws=New-Object -ComObject WScript.Shell
          foreach($name in @('PINKCAB L1 ENDLESS HUMAN.lnk','PINKCAB Latest.lnk')){
            $lnk=Join-Path $desktop $name
            Remove-Item $lnk -Force -ErrorAction SilentlyContinue
            $s=$ws.CreateShortcut($lnk)
            $s.TargetPath=$inner
            $s.Arguments='/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
            $s.WorkingDirectory=(Split-Path $inner)
            $s.Description="PINK CAB latest endless Level 1 $sha"
            $s.Save()
            Write-Host "CD869_SHORTCUT=$lnk"
          }

          Set-Content (Join-Path $delivery 'CANDIDATE_SHA.txt') $sha -NoNewline
          Set-Content (Join-Path $delivery 'RUN_ID.txt') $env:GITHUB_RUN_ID -NoNewline
          "delivery=$delivery" | Out-File $env:GITHUB_OUTPUT -Append
          "inner=$inner" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "CD869_HUMAN_DELIVERY=$delivery"

      - name: Launch HUMAN build now
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        env:
          DELIVERY_INNER: ${{ steps.install.outputs.inner }}
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path $env:DELIVERY_INNER)){ throw 'CD869_LAUNCH_EXE_MISSING' }

          $saved=$env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID=''
          try {
            $proc=Start-Process -FilePath $env:DELIVERY_INNER -ArgumentList @(
              '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
              '-windowed','-ResX=1600','-ResY=900'
            ) -WorkingDirectory (Split-Path $env:DELIVERY_INNER) -PassThru
            Start-Sleep -Seconds 5
            $proc.Refresh()
            if($proc.HasExited){ throw "CD869_HUMAN_EXITED_EARLY code=$($proc.ExitCode)" }
            Write-Host "CD869_HUMAN_LAUNCHED_PID=$($proc.Id)"
            Write-Host 'HUMAN_PENDING'
          }
          finally {
            $env:RUNNER_TRACKING_ID=$saved
          }
