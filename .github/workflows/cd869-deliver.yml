name: CD-869 Fast Human Delivery

# Windows PowerShell 5.1 must resolve its own built-in modules, not an inherited host edition.
env:
  PSModulePath: 'C:\WINDOWS\system32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules'

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      p02_verified:
        required: true
        type: boolean
      p02_run_id:
        required: true
        type: string
      p02_run_attempt:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd869-main-baseline
  cancel-in-progress: false

jobs:
  deliver:
    if: ${{ inputs.p02_verified && github.event_name == 'workflow_dispatch' && github.workflow == 'CD-648 P02 PHY-009 Drivetrain Continuity' && inputs.p02_run_id == github.run_id && inputs.p02_run_attempt == github.run_attempt }}
    name: Reuse package, smoke, deliver, launch
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 30
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      DELIVERY_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB
      ARCHIVE: Artifacts\CD869Human
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          clean: false
          ref: ${{ inputs.candidate_sha }}

      - name: Prepare pinned MetaRoad dependency
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          python .\scripts\ci\prepare_metaroad.py --root "$env:GITHUB_WORKSPACE"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Materialize verified local LFS
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          python .\scripts\ci\materialize_local_lfs.py `
            --workspace "$env:GITHUB_WORKSPACE" `
            --base-ref origin/main `
            --allow-changed-lfs "Content/Dev/Maps/L_PinkCab_L1_EndlessStraight.umap"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          # Local git-lfs cache is materialized first. Unresolved unrelated
          # pointers are allowed here; the exact target map is regenerated from
          # source below and BuildCookRun is the hard runtime dependency gate.
          $dirty=@(git status --porcelain)
          if($dirty.Count -ne 0){
            $dirty | ForEach-Object { Write-Host "CD869_DIRTY_AFTER_LOCAL_LFS $_" }
            throw "CD869_LOCAL_LFS_DIRTIED_WORKTREE count=$($dirty.Count)"
          }
          Write-Host 'CD869_LOCAL_LFS_MATERIALIZATION=PASS'

      - name: Exact-head and package preflight
        id: preflight
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:CANDIDATE_SHA){ throw "CD869_DELIVERY_HEAD_MISMATCH $head != $env:CANDIDATE_SHA" }

          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $sourceSha=Join-Path $archive 'SOURCE_SHA.txt'
          $reuse=(Test-Path $inner) -and
              (Test-Path $sourceSha) -and
              ((Get-Content -Raw $sourceSha).Trim() -eq $head)
          if($reuse){
            Write-Host "CD869_PACKAGE_REUSE=1 sha=$head $inner"
            'package_ready=true' | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "CD869_PACKAGE_REUSE=0 sha=$head"
            'package_ready=false' | Out-File $env:GITHUB_OUTPUT -Append
          }

      - name: Rebuild canonical R4 road assets from MetaRoad authoring source
        if: ${{ steps.preflight.outputs.package_ready != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $gate=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate'
          New-Item -ItemType Directory -Force $gate | Out-Null

          $road=@(
            git lfs ls-files -n |
              Where-Object {
                $_ -like 'Content/World/L1/Road/Road*.uasset'
              }
          )
          if($road.Count -lt 84){
            throw "CD869_ROAD_AUTHORING_SET_INCOMPLETE count=$($road.Count)"
          }

          # Road meshes are deterministic authoring outputs. Remove unresolved
          # LFS pointers and rebuild them from exact-head authoring code + the
          # installed canonical MetaRoad plugin.
          foreach($path in $road){
            Remove-Item (Join-Path $env:GITHUB_WORKSPACE $path) -Force -ErrorAction SilentlyContinue
          }
          Remove-Item (Join-Path $env:GITHUB_WORKSPACE 'Content\Dev\Authoring\L_PC_L1_MetaRoadAuthoring.umap') -Force -ErrorAction SilentlyContinue

          & "$env:UE_ROOT\Engine\Build\BatchFiles\Build.bat" PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE -NoUBA -MaxParallelActions=8
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          & .\scripts\ci\run-unreal-automation.ps1 `
            -EngineRoot $env:UE_ROOT `
            -ProjectPath $project `
            -TestName 'PinkCab.Editor.GenerateL1EndlessRoadAssets' `
            -AllowAssetAuthoring `
            -LogPath (Join-Path $gate 'CD869_GENERATE_METAROAD_ASSETS.log') `
            -TimeoutSeconds 300

          foreach($path in $road){
            $full=Join-Path $env:GITHUB_WORKSPACE $path
            if(-not (Test-Path $full)){ throw "CD869_GENERATED_ROAD_ASSET_MISSING=$path" }
            $bytes=[IO.File]::ReadAllBytes($full)
            if($bytes.Length -lt 1024){ throw "CD869_GENERATED_ROAD_ASSET_TOO_SMALL=$path bytes=$($bytes.Length)" }
            $prefix=[Text.Encoding]::ASCII.GetString($bytes[0..([Math]::Min(80,$bytes.Length-1))])
            if($prefix -like 'version https://git-lfs.github.com/spec/v1*'){
              throw "CD869_GENERATED_ROAD_ASSET_IS_LFS_POINTER=$path"
            }
          }
          Write-Host "CD869_GENERATED_METAROAD_ASSETS=PASS count=$($road.Count)"

          & .\scripts\ci\run-unreal-automation.ps1 `
            -EngineRoot $env:UE_ROOT `
            -ProjectPath $project `
            -TestName 'PinkCab.Editor.GenerateL1EndlessRoadRuntimeMaterials' `
            -AllowAssetAuthoring `
            -LogPath (Join-Path $gate 'CD869_GENERATE_METAROAD_RUNTIME_MATERIALS.log') `
            -TimeoutSeconds 240

          foreach($test in @(
            'PinkCab.World.L1Road.R2.NativeMetaRoadAsset',
            'PinkCab.World.L1Road.R3.NativeMetaRoadMarkings',
            'PinkCab.World.L1Road.R4.NativeMetaRoadVisualStack'
          )){
            $safe=$test.Replace('.','_')
            & .\scripts\ci\run-unreal-automation.ps1 `
              -EngineRoot $env:UE_ROOT `
              -ProjectPath $project `
              -TestName $test `
              -LogPath (Join-Path $gate ("CD869_" + $safe + ".log")) `
              -TimeoutSeconds 240
            Write-Host "CD869_METAROAD_AUTHORING_TEST=PASS test=$test"
          }

      - name: Regenerate canonical endless runtime map from exact-head source
        if: ${{ steps.preflight.outputs.package_ready != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $phys=Join-Path $env:GITHUB_WORKSPACE 'Content\World\L1\Road\Physics\PM_PC_DryAsphalt.uasset'
          $map=Join-Path $env:GITHUB_WORKSPACE 'Content\Dev\Maps\L_PinkCab_L1_EndlessStraight.umap'
          $gate=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate'
          New-Item -ItemType Directory -Force $gate | Out-Null

          # The dry-asphalt physical material is rebuilt from exact-head source.
          # The runtime map, however, is a canonical tracked Git-LFS asset: preserve it
          # when its real bytes are available and regenerate only when the checkout still
          # contains a missing/unresolved pointer.
          Remove-Item $phys -Force -ErrorAction SilentlyContinue

          $mapReady=$false
          if(Test-Path -LiteralPath $map){
            try {
              $mapFirst=Get-Content -LiteralPath $map -TotalCount 1 -ErrorAction Stop
              $mapLength=(Get-Item -LiteralPath $map).Length
              $mapReady=($mapFirst -ne 'version https://git-lfs.github.com/spec/v1') -and ($mapLength -gt 1024)
            } catch {
              $mapReady=$false
            }
          }
          Write-Host "CD869_CANONICAL_MAP_MATERIALIZED=$([int]$mapReady)"

          & .\scripts\ci\run-unreal-automation.ps1 `
            -EngineRoot $env:UE_ROOT `
            -ProjectPath $project `
            -TestName 'PinkCab.Editor.GenerateL1RoadR5DryAsphaltPhysicalMaterial' `
            -AllowAssetAuthoring `
            -LogPath (Join-Path $gate 'CD869_GENERATE_DRY_ASPHALT.log') `
            -TimeoutSeconds 180

          if(-not (Test-Path $phys)){ throw 'CD869_GENERATED_DRY_ASPHALT_MISSING' }
          $physBytes=[IO.File]::ReadAllBytes($phys)
          if($physBytes.Length -lt 1024){ throw "CD869_GENERATED_DRY_ASPHALT_TOO_SMALL=$($physBytes.Length)" }
          $physPrefix=[Text.Encoding]::ASCII.GetString($physBytes[0..([Math]::Min(80,$physBytes.Length-1))])
          if($physPrefix -like 'version https://git-lfs.github.com/spec/v1*'){ throw 'CD869_GENERATED_DRY_ASPHALT_IS_LFS_POINTER' }
          $physSha=(Get-FileHash $phys -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "CD869_GENERATED_DRY_ASPHALT=PASS sha256=$physSha bytes=$($physBytes.Length)"

          # The target map is born during this workflow. Run its authoring in
          # a normal editor process (no -SkipAssetScan) so the on-disk package
          # enters the same AssetRegistry lifecycle used by the later cooker.
          $preMapQuarantined=0
          foreach($relative in @(git lfs ls-files -n)){
            $full=Join-Path $env:GITHUB_WORKSPACE $relative
            if(-not (Test-Path -LiteralPath $full)){ continue }
            try { $first=Get-Content -LiteralPath $full -TotalCount 1 -ErrorAction Stop } catch { continue }
            if($first -eq 'version https://git-lfs.github.com/spec/v1'){
              Remove-Item -LiteralPath $full -Force
              ++$preMapQuarantined
              Write-Host "CD869_PREMAP_QUARANTINED_LFS_POINTER=$relative"
            }
          }
          Write-Host "CD869_PREMAP_LFS_POINTER_QUARANTINE=PASS count=$preMapQuarantined"

          $registryDir=Join-Path $env:GITHUB_WORKSPACE 'Intermediate\CachedAssetRegistry'
          if(Test-Path $registryDir){
            Remove-Item $registryDir -Recurse -Force
            Write-Host "CD869_PREMAP_REMOVED_STALE_REGISTRY=$registryDir"
          }

          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $mapLog=Join-Path $gate 'CD869_GENERATE_ENDLESS_MAP.log'
          if(-not $mapReady){
            Remove-Item $map -Force -ErrorAction SilentlyContinue
            $editorArgs=@(
              $project, '/Engine/Maps/Entry', '-unattended', '-NullRHI', '-nosplash', '-nopause', '-NoSound',
              '-PinkCabAllowAssetAuthoring', '-stdout', '-FullStdOutLogOutput', "-abslog=$mapLog",
              '-ExecCmds=Automation RunTests PinkCab.Editor.GenerateL1EndlessRoadMap',
              '-TestExit=Automation Test Queue Empty'
            )
            & $editor @editorArgs
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
            if(Select-String -LiteralPath $mapLog -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:' -Quiet){
              throw 'CD869_GENERATE_ENDLESS_MAP_TEST_FAIL'
            }
            if(-not (Select-String -LiteralPath $mapLog -Pattern 'Automation Test Queue Empty [0-9]+ tests performed' -Quiet)){
              throw 'CD869_GENERATE_ENDLESS_MAP_QUEUE_MISSING'
            }
            Write-Host 'CD869_GENERATE_ENDLESS_MAP_NORMAL_SCAN=PASS'
          } else {
            Write-Host 'CD869_GENERATE_ENDLESS_MAP=SKIPPED_CANONICAL_LFS'
          }

          $registryFiles=@(
            Get-ChildItem -LiteralPath $registryDir -File -ErrorAction SilentlyContinue
          )
          Write-Host "CD869_GENERATED_MAP_REGISTRY_CACHE_COUNT=$($registryFiles.Count)"
          if(-not (Test-Path $map)){ throw 'CD869_GENERATED_MAP_MISSING' }
          $bytes=[IO.File]::ReadAllBytes($map)
          if($bytes.Length -lt 1024){ throw "CD869_GENERATED_MAP_TOO_SMALL=$($bytes.Length)" }
          $prefix=[Text.Encoding]::ASCII.GetString($bytes[0..([Math]::Min(80,$bytes.Length-1))])
          if($prefix -like 'version https://git-lfs.github.com/spec/v1*'){ throw 'CD869_GENERATED_MAP_IS_LFS_POINTER' }
          $mapSha=(Get-FileHash $map -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "CD869_GENERATED_MAP=PASS sha256=$mapSha bytes=$($bytes.Length)"

          if(-not $mapReady){
            $mapRel='Content/Dev/Maps/L_PinkCab_L1_EndlessStraight.umap'
            $pointer=(git show "${env:CANDIDATE_SHA}:$mapRel") -join "`n"
            $oidMatch=[regex]::Match($pointer,'oid sha256:([0-9a-f]{64})')
            if(-not $oidMatch.Success -or $oidMatch.Groups[1].Value -ne $mapSha){
              throw 'CD869_REGENERATED_MAP_DIFFERS_FROM_TESTED_SOURCE: preserve output and review separately; delivery cannot change its own candidate'
            }
            Write-Host "CD869_CANONICAL_MAP_REGENERATED_EXACT_OID=PASS oid=$mapSha"
          }

          foreach($test in @(
            'PinkCab.World.L1Road.R5.DryAsphaltPhysicalSurface',
            'PinkCab.World.L1EndlessRoad.Map.Composition',
            'PinkCab.World.L1EndlessRoad.Asset.MaterialContract'
          )){
            $safe=$test.Replace('.','_')
            & .\scripts\ci\run-unreal-automation.ps1 `
              -EngineRoot $env:UE_ROOT `
              -ProjectPath $project `
              -TestName $test `
              -LogPath (Join-Path $gate ("CD869_" + $safe + ".log")) `
              -TimeoutSeconds 240
            Write-Host "CD869_GENERATED_MAP_TEST=PASS test=$test"
          }

          $compositionLog=Join-Path $gate 'CD869_PinkCab_World_L1EndlessRoad_Map_Composition.log'
          if(-not (Select-String -LiteralPath $compositionLog -Pattern 'CD869_ENDLESS_MAP_PACKAGE_FLAGS_LOADED=0x' -Quiet)){
            throw 'CD869_RUNTIME_MAP_PACKAGE_CONTRACT_MARKER_MISSING'
          }
          Write-Host 'CD869_RUNTIME_MAP_PACKAGE_CONTRACT=PASS'
          Get-Content -LiteralPath $compositionLog |
            Select-String -Pattern 'CD869_ENDLESS_MAP_(PACKAGE_FLAGS_LOADED|ON_DISK_REGISTRY)' |
            ForEach-Object { Write-Host $_.Line }

      - name: Build package only when warm package is absent
        if: ${{ steps.preflight.outputs.package_ready != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $uat=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          foreach($stale in @(
            (Join-Path $env:GITHUB_WORKSPACE 'Saved\Cooked\Windows'),
            (Join-Path $env:GITHUB_WORKSPACE 'Saved\StagedBuilds\Windows')
          )){
            if(Test-Path $stale){ Remove-Item $stale -Recurse -Force }
          }
          if(Test-Path $archive){ Remove-Item $archive -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $archive | Out-Null

          $backup="$project.cd869-delivery-backup"
          Copy-Item $project $backup -Force
          $exit=1
          try {
            $descriptor=Get-Content -Raw $project | ConvertFrom-Json
            $descriptor.Modules=@($descriptor.Modules | Where-Object { $_.Name -ne 'PinkCabTests' })
            # MetaRoad runtime/content is required by the canonical R4 road visual stack.
            # StructUtils remains editor-only through PinkCab.uproject TargetAllowList.
            $descriptor | ConvertTo-Json -Depth 32 | Set-Content $project -Encoding UTF8

            # Git LFS pointers are text stubs, not Unreal packages. The cooker
            # scans the project asset registry before following the explicit map
            # dependency closure, so unrelated unresolved pointers would fail
            # PACKAGE_FILE_TAG validation. Quarantine only files that are still
            # literal LFS pointers; generated/materialized runtime assets remain.
            $quarantined=0
            foreach($relative in @(git lfs ls-files -n)){
              $full=Join-Path $env:GITHUB_WORKSPACE $relative
              if(-not (Test-Path -LiteralPath $full)){ continue }
              try {
                $first=Get-Content -LiteralPath $full -TotalCount 1 -ErrorAction Stop
              } catch {
                continue
              }
              if($first -eq 'version https://git-lfs.github.com/spec/v1'){
                Remove-Item -LiteralPath $full -Force
                ++$quarantined
                Write-Host "CD869_COOK_QUARANTINED_LFS_POINTER=$relative"
              }
            }
            Write-Host "CD869_COOK_LFS_POINTER_QUARANTINE=PASS count=$quarantined"

            # Preserve the fresh AssetRegistry produced by normal map authoring.
            # Deleting it here would make the next process forget a package that
            # did not exist when the runner checkout started.
            $freshRegistryDir=Join-Path $env:GITHUB_WORKSPACE 'Intermediate\CachedAssetRegistry'
            $freshRegistryFiles=@(
              Get-ChildItem -LiteralPath $freshRegistryDir -File -ErrorAction SilentlyContinue
            )
            Write-Host "CD869_PRECOOK_REGISTRY_CACHE_COUNT=$($freshRegistryFiles.Count)"

            $mapDir=Join-Path $env:GITHUB_WORKSPACE 'Content\Dev\Maps'
            $tatraSceneDir=Join-Path $env:GITHUB_WORKSPACE 'Content\Dev\Vehicles\Tatra613DesktopScene'
            $tatraWheelDir=Join-Path $env:GITHUB_WORKSPACE 'Content\Dev\Vehicles\Tatra613ArchiveV12Clean'
            foreach($requiredCookDir in @($mapDir,$tatraSceneDir,$tatraWheelDir)){
              if(-not (Test-Path -LiteralPath $requiredCookDir)){ throw "CD869_REQUIRED_COOK_DIR_MISSING=$requiredCookDir" }
            }
            $cookDirs=(@($mapDir,$tatraSceneDir,$tatraWheelDir) -join '+')
            Write-Host "CD869_COOK_DIRS=$cookDirs"
            & $uat -WaitForUATMutex BuildCookRun "-project=$project" -noP4 -platform=Win64 -clientconfig=Development -build -cook "-map=/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight" "-CookDir=$cookDirs" "-AdditionalCookerOptions=-NoEditorDomain -NoAssetRegistryCacheRead" -stage -pak -archive "-archivedirectory=$archive" -nodebuginfo -utf8output
            $exit=$LASTEXITCODE
          }
          finally {
            Move-Item $backup $project -Force
          }
          if($exit -ne 0){ exit $exit }

          # UE 5.8 IoStore does not leave cooked map packages as loose .umap
          # files. Prove that packaging produced real IoStore containers here;
          # the following packaged smoke is the authoritative map-load gate.
          $pakDir=Join-Path $archive 'Windows\PinkCab\Content\Paks'
          $utoc=@(Get-ChildItem -LiteralPath $pakDir -File -Filter '*.utoc' -ErrorAction SilentlyContinue)
          $ucas=@(Get-ChildItem -LiteralPath $pakDir -File -Filter '*.ucas' -ErrorAction SilentlyContinue)
          if($utoc.Count -lt 1 -or $ucas.Count -lt 1){
            throw "CD869_IOSTORE_CONTAINER_MISSING utoc=$($utoc.Count) ucas=$($ucas.Count)"
          }
          Write-Host "CD869_IOSTORE_PACKAGE=PASS utoc=$($utoc.Count) ucas=$($ucas.Count)"

          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'CD869_INNER_EXE_MISSING_AFTER_COOK' }
          $head=(git rev-parse HEAD).Trim()
          Set-Content (Join-Path $archive 'SOURCE_SHA.txt') $head -NoNewline
          Write-Host "CD869_PACKAGE_BUILD=PASS sha=$head"

      - name: Sign only the real game executable
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'CD869_INNER_EXE_MISSING' }

          & .\scripts\ci\ensure-dev-signing.ps1 -Path @($inner)
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          $sig=Get-AuthenticodeSignature $inner
          if($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid){
            throw "CD869_INNER_SIGNATURE_INVALID $($sig.Status)"
          }
          Write-Host 'CD869_INNER_SIGNING=PASS'

      - name: Packaged endless smoke
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_FAST_DELIVERY_SMOKE.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          $proc=Start-Process -FilePath $inner -ArgumentList @(
            '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
            '-log','-windowed','-ResX=1280','-ResY=720',
            '-PinkCabGateTelemetry',
            '-PinkCabRoadMaterialAudit',
            "-abslog=$log"
          ) -WorkingDirectory (Split-Path $inner) -PassThru
          try {
            $deadline=[DateTime]::UtcNow.AddSeconds(35)
            do {
              Start-Sleep -Milliseconds 300
              $proc.Refresh()
              if($proc.HasExited){ throw "CD869_SMOKE_EXITED_EARLY code=$($proc.ExitCode)" }
              $loaded=(Test-Path $log) -and [bool](Select-String $log -Pattern 'L_PinkCab_L1_EndlessStraight' -Quiet)
              $wheels=(Test-Path $log) -and [bool](Select-String $log -Pattern 'PINKCAB_GATE_STATE .*wheels=4' -Quiet)
              $materials=(Test-Path $log) -and [bool](Select-String $log -Pattern 'PINKCAB_ROAD_MATERIAL_AUDIT=PASS' -Quiet)
              $tatraVisual=(Test-Path $log) -and [bool](Select-String $log -Pattern 'PINKCAB_TATRA_VISUAL=PASS .*physics_chassis_hidden=1' -Quiet)
            } while(( -not $loaded -or -not $wheels -or -not $materials -or -not $tatraVisual) -and [DateTime]::UtcNow -lt $deadline)

            if(-not $loaded){ throw 'CD869_SMOKE_MAP_NOT_LOADED' }
            if(-not $wheels){ throw 'CD869_SMOKE_TATRA_TELEMETRY_MISSING' }
            if(-not $materials){ throw 'CD869_SMOKE_ROAD_MATERIAL_AUDIT_MISSING' }
            if(-not $tatraVisual){ throw 'CD869_SMOKE_TATRA_VISUAL_MISSING' }

            $critical=@(Select-String $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Failed to load package|LogStreaming: Error:|LogLinker: Error:|PINKCAB_TATRA_VISUAL=FAIL' -ErrorAction SilentlyContinue)
            if($critical.Count -gt 0){ throw "CD869_SMOKE_CRITICAL=$($critical.Count)" }
            Write-Host 'CD869_PACKAGED_ENDLESS_SMOKE=PASS'
          }
          finally {
            if($proc -and -not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: P04 packaged road acceptance
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $logs=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\P04_PACKAGED_ACCEPTANCE'
          & .\scripts\ci\run-p04-packaged-acceptance.ps1 `
            -ExePath $inner `
            -LogRoot $logs
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Install and verify immutable candidate without changing desktop
        id: install
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          if($sha -ne $env:CANDIDATE_SHA){throw 'CD869_SOURCE_CHANGED_DURING_DELIVERY'}
          $delivery=Join-Path $env:DELIVERY_BASE ("CD869_ENDLESS_{0}_RUN{1}_ATTEMPT{2}" -f $sha.Substring(0,8),$env:GITHUB_RUN_ID,$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $delivery){throw 'CD869_IMMUTABLE_DELIVERY_ALREADY_EXISTS'}
          $source=Join-Path $env:GITHUB_WORKSPACE "$env:ARCHIVE\Windows"
          $destination=Join-Path $delivery 'Windows'
          $evidence=Join-Path $env:GITHUB_WORKSPACE ("Saved\GitHubGate\Delivery_{0}_{1}" -f $env:GITHUB_RUN_ID,$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $evidence){throw 'CD869_HANDOFF_EVIDENCE_ALREADY_EXISTS'}
          New-Item -ItemType Directory -Path $evidence | Out-Null
          "DELIVERY_EVIDENCE=$evidence" | Out-File $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Path $destination | Out-Null
          & robocopy $source $destination /E /COPY:DAT /DCOPY:T /R:2 /W:1 /NFL /NDL /NJH /NJS
          if($LASTEXITCODE -ge 8){throw 'CD869_PACKAGE_COPY_FAILED'}
          $global:LASTEXITCODE=0
          function Read-Payload([string]$Root){
            $map=@{}
            foreach($file in @(Get-ChildItem -LiteralPath $Root -Recurse -File)){
              $relative=$file.FullName.Substring($Root.Length+1).Replace('\','/')
              if($relative -match '(^|/)Saved/'){continue}
              if($file.Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'CD869_PAYLOAD_REPARSE_FILE'}
              $map[$relative]=@{path=$relative;bytes=$file.Length;sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            }
            if($map.Count -lt 3){throw 'CD869_PAYLOAD_INCOMPLETE'}
            return $map
          }
          $a=Read-Payload $source
          $b=Read-Payload $destination
          if($a.Count -ne $b.Count){throw 'CD869_PAYLOAD_COUNT_MISMATCH'}
          foreach($path in $a.Keys){if(-not $b.ContainsKey($path) -or $a[$path].sha256 -ne $b[$path].sha256 -or $a[$path].bytes -ne $b[$path].bytes){throw ('CD869_PAYLOAD_MISMATCH='+$path)}}
          $inner=Join-Path $destination 'PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path -LiteralPath $inner)){throw 'CD869_INSTALLED_INNER_MISSING'}
          @{schema=1;candidateSha=$sha;deliveryRun=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;installedPackage=$destination;excludedMutablePaths='**/Saved/**';files=@($b.Keys | Sort-Object | ForEach-Object {$b[$_]});humanAccepted=$false} | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $evidence 'PACKAGE_MANIFEST.json') -Encoding UTF8
          Copy-Item (Join-Path $evidence 'PACKAGE_MANIFEST.json') (Join-Path $delivery 'PACKAGE_MANIFEST.json')
          Set-Content (Join-Path $delivery 'CANDIDATE_SHA.txt') $sha -NoNewline
          Set-Content (Join-Path $delivery 'RUN_ID.txt') $env:GITHUB_RUN_ID -NoNewline
          "delivery=$delivery" | Out-File $env:GITHUB_OUTPUT -Append
          "inner=$inner" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "CD869_INSTALLED_PAYLOAD_HASHES=PASS count=$($b.Count) delivery=$delivery"

      - name: Verify visible candidate and replace only PINCKCAB entry
        env:
          DELIVERY_INNER: ${{ steps.install.outputs.inner }}
          DELIVERY_ROOT: ${{ steps.install.outputs.delivery }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $desktop=[Environment]::GetFolderPath('Desktop')
          $session=(Get-Process -Id $PID).SessionId
          if(@(Get-Process explorer -ErrorAction SilentlyContinue | Where-Object {$_.SessionId -eq $session}).Count -lt 1){throw 'CD869_INTERACTIVE_DESKTOP_NOT_AVAILABLE'}
          $ws=New-Object -ComObject WScript.Shell
          $linkPath=Join-Path $desktop 'PINCKCAB.lnk'
          $backup=Join-Path $env:DELIVERY_EVIDENCE 'PINCKCAB.previous.lnk'
          $previousHash=''
          if(Test-Path -LiteralPath $linkPath){
            $previousHash=(Get-FileHash -LiteralPath $linkPath -Algorithm SHA256).Hash
            Copy-Item -LiteralPath $linkPath -Destination $backup
            if((Get-FileHash -LiteralPath $backup -Algorithm SHA256).Hash -ne $previousHash){throw 'CD869_PREVIOUS_LINK_BACKUP_FAILED'}
          }
          $log=Join-Path $env:DELIVERY_EVIDENCE 'HUMAN_LAUNCH.log'
          $oldTracking=$env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID=''
          $process=$null
          $verified=$false
          try {
            $process=Start-Process -FilePath $env:DELIVERY_INNER -WorkingDirectory (Split-Path $env:DELIVERY_INNER) -ArgumentList @('/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight','-windowed','-ResX=1600','-ResY=900','-PinkCabGateTelemetry','-PinkCabRoadMaterialAudit',('-abslog="'+$log+'"')) -PassThru
            $deadline=[DateTime]::UtcNow.AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if($process.HasExited){throw ('CD869_HUMAN_EXITED='+$process.ExitCode)}
              $wheels=(Test-Path $log) -and [bool](Select-String -LiteralPath $log -Pattern 'PINKCAB_GATE_STATE .*wheels=4' -Quiet)
              $materials=(Test-Path $log) -and [bool](Select-String -LiteralPath $log -Pattern 'PINKCAB_ROAD_MATERIAL_AUDIT=PASS' -Quiet)
            } while((-not $wheels -or -not $materials -or $process.MainWindowHandle -eq 0) -and [DateTime]::UtcNow -lt $deadline)
            $critical=@(Select-String -LiteralPath $log -Pattern 'Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Failed to load package|LogStreaming: Error:|LogLinker: Error:' -ErrorAction SilentlyContinue)
            if(-not $wheels -or -not $materials -or $process.MainWindowHandle -eq 0 -or $critical.Count -gt 0){throw 'CD869_HUMAN_VISIBLE_RUNTIME_CHECK_FAILED'}
            $temp=Join-Path $desktop ('PINCKCAB.'+[Guid]::NewGuid().ToString('N')+'.tmp.lnk')
            $shortcut=$ws.CreateShortcut($temp)
            $shortcut.TargetPath=$env:DELIVERY_INNER
            $shortcut.WorkingDirectory=Split-Path $env:DELIVERY_INNER
            $shortcut.Arguments='/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight -windowed -ResX=1600 -ResY=900'
            $shortcut.IconLocation=$env:DELIVERY_INNER+',0'
            $shortcut.Description=('PINCKCAB - candidate '+$env:CANDIDATE_SHA.Substring(0,8)+'; HUMAN PENDING; prior accepted build retained')
            $shortcut.Save()
            if($ws.CreateShortcut($temp).TargetPath -ne $env:DELIVERY_INNER){throw 'CD869_TEMP_LINK_READBACK_FAILED'}
            if($previousHash){
              if(-not (Test-Path -LiteralPath $linkPath) -or (Get-FileHash -LiteralPath $linkPath -Algorithm SHA256).Hash -ne $previousHash){throw 'CD869_DESKTOP_LINK_CHANGED_CONCURRENTLY'}
              [IO.File]::Replace($temp,$linkPath,[System.Management.Automation.Language.NullString]::Value)
            } else {
              if(Test-Path -LiteralPath $linkPath){throw 'CD869_DESKTOP_LINK_CREATED_CONCURRENTLY'}
              [IO.File]::Move($temp,$linkPath)
            }
            if($ws.CreateShortcut($linkPath).TargetPath -ne $env:DELIVERY_INNER){throw 'CD869_FINAL_LINK_READBACK_FAILED'}
            $activated=$ws.AppActivate($process.Id)
            @{status='DELIVERED_HUMAN_PENDING';candidate=$env:CANDIDATE_SHA;delivery=$env:DELIVERY_ROOT;shortcut=$linkPath;target=$env:DELIVERY_INNER;pid=$process.Id;session=$session;windowHandle=$process.MainWindowHandle.ToInt64();foregroundActivated=$activated;wheels4=$wheels;roadMaterials=$materials;criticalCount=$critical.Count;previousShortcutBackup=$backup;humanAccepted=$false} | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $env:DELIVERY_EVIDENCE 'HANDOFF.json') -Encoding UTF8
            $verified=$true
            Write-Host ('CD869_HUMAN_READY=PASS shortcut='+$linkPath+' pid='+$process.Id)
          } finally {
            $env:RUNNER_TRACKING_ID=$oldTracking
            if(-not $verified -and $process -and -not $process.HasExited){Stop-Process -Id $process.Id -ErrorAction SilentlyContinue}
            if($temp -and (Test-Path -LiteralPath $temp)){Move-Item -LiteralPath $temp -Destination (Join-Path $env:DELIVERY_EVIDENCE 'incomplete-shortcut.lnk')}
          }

      - name: Preserve verification receipts without publishing game content
        if: ${{ always() && env.DELIVERY_EVIDENCE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pinkcab-human-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DELIVERY_EVIDENCE }}
          retention-days: 30
          if-no-files-found: error
