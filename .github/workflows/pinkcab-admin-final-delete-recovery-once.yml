name: PINK CAB admin final delete recovery once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  delete_recovery:
    if: ${{ github.event.issue.pull_request && github.event.issue.number == 7 && github.event.comment.user.login == 'CheshirskyCat63' && github.event.comment.body == '/admin-final-delete-recovery' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged inactive recovery ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" fix/CD-848-recovery-r1-input-contract
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" --delete fix/CD-848-recovery-r1-input-contract
          echo "RECOVERY_REF_DELETED"

      - name: Self-delete one-shot workflow
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pinkcab-admin-final-delete-recovery-once.yml
          git commit -m "admin: remove final recovery branch cleanup workflow"
          git push origin main
