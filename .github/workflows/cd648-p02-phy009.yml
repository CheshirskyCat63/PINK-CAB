name: CD-648 P02 PHY-009 Drivetrain Continuity
# Scope-regression coverage is mandatory for this frozen P02 gate.

# Windows PowerShell 5.1 must resolve its own built-in modules, not an inherited host edition.
env:
  PSModulePath: 'C:\WINDOWS\system32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules'

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      reuse_tdd_evidence:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      deliver_human:
        description: 'Deliver and launch this exact candidate after successful verification'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pinkcab-p02-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) }}
    name: P02 PHY-009 evidence
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 60
    outputs:
      run_physics: ${{ steps.change_scope.outputs.run_physics }}
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          clean: false
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Mark requested runtime verification
        id: change_scope
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          "run_physics=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify warm workspace provenance
        env:
          PINKCAB_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          python scripts/ci/acceptance_contract.py workspace
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Prepare pinned MetaRoad dependency
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          python .\scripts\ci\prepare_metaroad.py --root "$env:GITHUB_WORKSPACE"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Materialize verified local LFS fixtures
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest scripts.tests.test_materialize_local_lfs -v
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $fixtureManifestPath=Join-Path $env:GITHUB_WORKSPACE 'Config\VehiclePhysicsRuntimeFixtures.json'
          $fixtureManifest=Get-Content -LiteralPath $fixtureManifestPath -Raw | ConvertFrom-Json
          $materializeArgs=@(
            'scripts/ci/materialize_local_lfs.py',
            '--workspace', $env:GITHUB_WORKSPACE,
            '--base-ref', 'origin/main',
            '--search-root', 'E:\CHESHIRE_DIVISION\Games\PINK-CAB',
            '--search-root', 'E:\CHESHIRE_DIVISION\RecoveryLinks\PINK-CAB',
            '--search-root', 'E:\Development',
            '--allow-changed-lfs', 'Content/Dev/Maps/L_PinkCab_L1_EndlessStraight.umap'
          )
          foreach($fixture in $fixtureManifest.lfs){
            $absolute=Join-Path $env:GITHUB_WORKSPACE ([string]$fixture.path)
            if(-not (Test-Path -LiteralPath $absolute)){
              throw "PINKCAB_PHYSICS_FIXTURE_POINTER_MISSING=$($fixture.path)"
            }
            $pointer=Get-Content -LiteralPath $absolute -Raw
            $match=[regex]::Match($pointer,"(?m)^oid sha256:([0-9a-f]{64})\s*$")
            if(-not $match.Success){
              $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $absolute).Hash.ToLowerInvariant()
              if($actual -ne ([string]$fixture.oid_sha256).ToLowerInvariant()){
                throw "PINKCAB_PHYSICS_FIXTURE_HASH_MISMATCH=$($fixture.path) actual=$actual expected=$($fixture.oid_sha256)"
              }
            } elseif($match.Groups[1].Value -ne ([string]$fixture.oid_sha256).ToLowerInvariant()){
              throw "PINKCAB_PHYSICS_FIXTURE_OID_MISMATCH=$($fixture.path) actual=$($match.Groups[1].Value) expected=$($fixture.oid_sha256)"
            }
            $materializeArgs += '--required'
            $materializeArgs += [string]$fixture.path
          }
          python @materializeArgs
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host "P02_LOCAL_LFS_MATERIALIZATION=PASS"

      - name: Exact-head preflight and scope guard
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          # PINKCAB_P02_PREFLIGHT_BEGIN
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if(@(git status --porcelain --untracked-files=all).Count -ne 0){
            git status --short
            throw 'P02_PHY009_DIRTY_PREFLIGHT'
          }
          $base=(git merge-base origin/main HEAD).Trim()
          if(-not $base){ throw 'P02_PHY009_BASELINE_MISMATCH' }

          $expected='${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}'
          if($head -ne $expected){ throw 'P02_PHY009_HEAD_MISMATCH' }
          $allowed=@(
            '.github/workflows/pinkcab-repository-verification.yml',
            'scripts/ci/acceptance_contract.py',
            'scripts/tests/test_acceptance_contract.py',
            'docs/CONTROL_PLANE.md',
            'docs/PINK_CAB_ACTIVE_BASELINE.md',
            'docs/PROGRAM_ROADMAP.md',
            # CD-559 reproducible, project-local vendor provisioning and runner lifecycle.
            'README.md',
            'docs/AUTHORITY.yaml',
            'docs/PROJECT_SETUP.md',
            'docs/README.md',
            'scripts/ci/package_g1_recovery.py',
            'scripts/tests/test_ci_powershell_environment.py',
            '.github/workflows/cd869-inline.yml',
            '.github/workflows/pinkcab-g1-github-control-plane.yml',
            '.gitignore',
            'scripts/build.ps1',
            'scripts/ci/prepare_metaroad.py',
            'scripts/ci/metaroad.lock.json',
            'scripts/ci/start-pinkcab-runner.ps1',
            'scripts/tests/test_prepare_metaroad.py',
            '.github/workflows/pinkcab-vehicle-physics-tdd.yml',
            '.github/workflows/cd648-p02-phy009.yml',
            '.github/workflows/cd869-deliver.yml',
            'Content/Dev/Maps/L_PinkCab_L1_EndlessStraight.umap',
            'Source/PinkCabTests/Private/Vehicle/PinkCabControlRuntimeTests.cpp',
            'Source/PinkCabTests/Private/World/PinkCabL1EndlessRoadMapGenerator.cpp',
            'Source/PinkCabTests/Private/World/PinkCabL1EndlessRoadMapTests.cpp',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabCausalTelemetry.h',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabChaosEngineAdapter.h',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabSteeringController.h',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabSteeringController.cpp',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabThrottleResponse.h',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabThrottleResponse.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabCausalTelemetry.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabChaosVehicleDynamicsTelemetry.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabChaosVehicleDynamicsProvider.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabCausalTelemetryTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabEngineStatePhysicsTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabEngineOffCoastRuntimeTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabClutchContinuityPhysicsTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabClutchDrivelineModelTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabDrivelineCausalMatrixTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabDrivelineCapacityRuntimeTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabDrivelineEngineBrakeRuntimeTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabDrivelineDeterminismRuntimeTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabDrivelineLaunchRuntimeTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabDrivelineRuntimeTestUtils.h',
            'Source/PinkCabTests/Private/Vehicle/PinkCabVehicleControlRuntimeTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabEngineRuntimeAcceptanceTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabPhysicsFixturePawn.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabPhysicsFixturePawn.h',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabClutchDrivelineModel.h',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabClutchDrivelineModel.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabClutchDrivelineIntegration.h',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabClutchDrivelineIntegration.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabEngineStatePhysicsTests.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabChaosVehicleDynamicsProvider.cpp',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabChaosEngineAdapter.h',
            'Source/PinkCabVehicle/PinkCabVehicle.Build.cs',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabChaosVehicleMovementComponent.h',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabChaosVehicleMovementComponent.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabChaosVehicleSimulation.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabChaosVehicleEvidence.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabChaosVehicleSimulation.h',
            'Config/VehiclePhysicsRuntimeFixtures.json',
            'Config/DefaultEngine.ini',
            'Config/ArchitectureOwnership.json',
            'Config/CodeHealthPolicy.json',
            'Source/PinkCab/Private/Runtime/PinkCabChaosTatraPawn.cpp',
            'Source/PinkCab/Public/Runtime/PinkCabChaosTatraPawn.h',
            'Source/PinkCabTests/Private/Vehicle/PinkCabChaosPhysicalProfileTests.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabChaosCockpitBridge.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabChaosPhysicalProfile.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabChaosPhysicalProfileFingerprint.cpp',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabChaosPhysicalProfile.h',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabEngineRpmEnvelope.h',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabEngineRpmEnvelope.cpp',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabEngineActuationResolver.h',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabEngineActuationResolver.cpp',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabGearboxTypes.h',
            'Source/PinkCabVehicle/Public/Vehicle/PinkCabGearboxController.h',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabGearboxController.cpp',
            'Source/PinkCabVehicle/Private/Vehicle/PinkCabGearEngagementValidator.cpp',
            'Source/PinkCab/Public/Vehicle/PinkCabVehicleControlRuntime.h',
            'Source/PinkCab/Private/Vehicle/PinkCabVehicleControlRuntime.cpp',
            'docs/ENGINEERING_START_HERE.md',
            'docs/vehicle_physics/STATE_WRITER_INVENTORY.csv',
            'docs/vehicle_physics/STATE_WRITER_CONSUMER_MAP.md',
            'scripts/ci/verify_vehicle_physics_writers.py',
            'scripts/tests/test_materialize_local_lfs.py',
            'scripts/ci/materialize_local_lfs.py',
            'scripts/ci/run-unreal-automation.ps1',
            'docs/vehicle_physics/P02_DRIVELINE_ARCHITECTURE_2026-09-28.md',
            'docs/vehicle_physics/PINK_CAB_VEHICLE_PHYSICS_CALIBRATION_PROGRAM_2026-09-26.md',
            'docs/vehicle_physics/TASKS.csv',
            'docs/vehicle_physics/TESTS.csv',
            'docs/vehicle_physics/GATE1_ROAD_HANDLING_INTEGRATION_2026-09-28.md',
            # CD-559 release automation hardening: explicit authoring capability and read-only regression coverage.
            '.github/workflows/cd869-r5-dry-asphalt.yml',
            'Source/PinkCabTests/Private/Interaction/PinkCabContractZeroGenerator.cpp',
            'Source/PinkCabTests/Private/PinkCabAutomationWriteGuard.h',
            'Source/PinkCabTests/Private/World/PinkCabChaosWeaveMapGenerator.cpp',
            'Source/PinkCabTests/Private/World/PinkCabL1GreyboxGenerator.cpp',
            'Source/PinkCabTests/Private/World/PinkCabL1MetaRoadAuthoringTests.cpp',
            'Source/PinkCabTests/Private/World/PinkCabL1RoadR5PhysicalSurfaceTests.cpp',
            'Source/PinkCabTests/Private/World/PinkCabVerticalAcceptanceMapGenerator.cpp',
            'scripts/tests/test_release_automation_readonly.py',
            # Accepted control/grip contract reconciliation required by the exact release candidate.
            'Source/PinkCabInteraction/Private/Interaction/PinkCabInteractionModel.cpp',
            'Source/PinkCabTests/Private/Core/PinkCabCoreCodeCompleteRuntimeTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabChaosPawnTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabChaosVehicleProviderTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabG1HInpContractTests.cpp',
            'Source/PinkCabTests/Private/Vehicle/PinkCabHInpContractTests.cpp',
            'scripts/tests/test_package_g1_recovery.py',
            'scripts/fast-delivery.ps1',
            'scripts/tests/test_fast_delivery_retirement.py',
            'docs/FAST_DELIVERY_ENTRYPOINT.md',
            'scripts/tests/test_p02_workflow_scope.py'
          )
          $changed=@(git diff --name-only "$base...HEAD")
          $unexpected=@($changed | Where-Object { $_ -notin $allowed })
          if($unexpected.Count -ne 0){
            $unexpected | ForEach-Object { Write-Host "P02_PHY009_UNEXPECTED=$_" }
            throw 'P02_PHY009_SCOPE_GUARD_FAIL'
          }
          Write-Host "P02_PHY009_PREFLIGHT=PASS head=$head base=$base changed=$($changed.Count)"
          # PINKCAB_P02_PREFLIGHT_END

      - name: Build PinkCabEditor
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          & "$env:UE_ROOT\Engine\Build\BatchFiles\Build.bat" PinkCabEditor Win64 Development "$env:GITHUB_WORKSPACE\PinkCab.uproject" -WaitMutex -NoHotReloadFromIDE -NoUBA -MaxParallelActions=8
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'P02_PHY009_EDITOR_BUILD=PASS'

      - name: Download coordinated physics evidence
        if: ${{ inputs.reuse_tdd_evidence }}
        uses: actions/download-artifact@v4
        with:
          name: physics-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: Saved/GitHubGate/CoordinatedPhysics

      - name: Verify coordinated physics evidence
        if: ${{ inputs.reuse_tdd_evidence }}
        env:
          PINKCAB_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          python scripts/ci/acceptance_contract.py verify-attestation --log Saved/GitHubGate/CoordinatedPhysics/VEHICLE_PHYSICS_TDD.log --manifest Saved/GitHubGate/CoordinatedPhysics/PHYSICS_ACCEPTANCE.json
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Full physics coverage for independent P02 dispatch
        if: ${{ !inputs.reuse_tdd_evidence }}
        env:
          PINKCAB_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          & .\scripts\ci\run-unreal-automation.ps1 `
            -EngineRoot $env:UE_ROOT `
            -ProjectPath "$env:GITHUB_WORKSPACE\PinkCab.uproject" `
            -TestName 'PinkCab.Vehicle.Physics' `
            -LogPath "$env:GITHUB_WORKSPACE\Saved\GitHubGate\P02_PHYSICS_FULL.log" `
            -TimeoutSeconds 900
          python scripts/ci/acceptance_contract.py attest --log Saved/GitHubGate/P02_PHYSICS_FULL.log --manifest Saved/GitHubGate/P02_PHYSICS_ACCEPTANCE.json
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Prove P01 slope fixture determinism
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $project="$env:GITHUB_WORKSPACE\PinkCab.uproject"
          $test='PinkCab.Vehicle.Physics.EngineState.LiveOffNeutralSlope'
          $passes=0
          foreach($repeat in 1..5){
            $log="$env:GITHUB_WORKSPACE\Saved\GitHubGate\P01_SLOPE_REPEAT_$repeat.log"
            & .\scripts\ci\run-unreal-automation.ps1 `
              -EngineRoot $env:UE_ROOT `
              -ProjectPath $project `
              -TestName $test `
              -LogPath $log `
              -TimeoutSeconds 180
            ++$passes
            Write-Host "P01_SLOPE_REPEAT_PASS=$repeat"
          }
          if($passes -ne 5){
            throw "P01_SLOPE_REPEAT_INCOMPLETE passes=$passes expected=5"
          }
          Write-Host 'P01_SLOPE_DETERMINISM=PASS repeats=5'

      - name: Zero-debt and writer guard
        if: ${{ steps.change_scope.outputs.run_physics == 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest scripts.tests.test_repo_hygiene scripts.tests.test_code_health -v
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python scripts/ci/verify_vehicle_physics_writers.py --manifest docs/vehicle_physics/STATE_WRITER_INVENTORY.csv --evidence Saved/GitHubGate/P02_PHY009_WRITERS.json
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'P02_PHY009_ZERO_DEBT=PASS'


  human-delivery:
    name: Exact-head HUMAN delivery
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deliver_human && needs.verify.outputs.run_physics == 'true' }}
    uses: ./.github/workflows/cd869-deliver.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
      p02_verified: true
      p02_run_id: ${{ github.run_id }}
      p02_run_attempt: ${{ github.run_attempt }}
    secrets: inherit
