name: CD-869 R2 Fast Human Delivery

on:
  push:
    branches:
      - feat/CD-869-r2-median-separators
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd869-r2-fast-human
  cancel-in-progress: true

jobs:
  deliver:
    name: Reuse verified R2 package, validate controls, launch
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 30
    env:
      PACKAGE_RUNTIME_SHA: 03948bd74d4231d375f247bc57d8eabf07c9652a
      ACCEPTED_INPUT_SHA: 8168d72406af6934ab20eace583c2b895f0620b7
      DELIVERY_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB

    steps:
      - name: Prepare exact control-plane head without deleting warm package
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:GITHUB_WORKSPACE

          Get-Process -Name PinkCab -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "R2_FAST_STOP_OLD_PINKCAB pid=$($_.Id)"
              Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
            }

          $workspacePattern=[Regex]::Escape($env:GITHUB_WORKSPACE)
          $ue=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('UnrealEditor.exe','UnrealEditor-Cmd.exe') -and
              $_.CommandLine -and
              $_.CommandLine -match $workspacePattern
            })
          foreach($p in $ue){
            Write-Host "R2_FAST_STOP_CI_UNREAL pid=$($p.ProcessId)"
            Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          }
          if($ue.Count -gt 0){ Start-Sleep -Milliseconds 800 }

          $branchName=$env:GITHUB_REF_NAME
          git fetch --prune origin "+refs/heads/${branchName}:refs/remotes/origin/${branchName}"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          git reset --hard $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R2_FAST_HEAD_MISMATCH $head != $env:GITHUB_SHA" }
          Write-Host "R2_FAST_HEAD=$head"

      - name: Prove warm package still represents current runtime
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'

          git cat-file -e "$env:PACKAGE_RUNTIME_SHA^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'R2_PACKAGE_RUNTIME_COMMIT_MISSING' }

          $runtimeDelta=@(git diff --name-only "$env:PACKAGE_RUNTIME_SHA..HEAD" |
            Where-Object {
              $_ -match '^Source/' -or
              $_ -match '^Content/' -or
              $_ -match '^Config/' -or
              $_ -eq 'PinkCab.uproject'
            })
          if($runtimeDelta.Count -gt 0){
            $runtimeDelta | ForEach-Object { Write-Host "R2_FAST_RUNTIME_DELTA=$_" }
            throw 'R2_WARM_PACKAGE_STALE'
          }

          $archive=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2Human'
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'R2_WARM_PACKAGE_MISSING' }
          if((Get-AuthenticodeSignature $inner).Status -ne [System.Management.Automation.SignatureStatus]::Valid){
            throw 'R2_WARM_PACKAGE_SIGNATURE_INVALID'
          }

          Write-Host "R2_PACKAGE_RUNTIME_SHA=$env:PACKAGE_RUNTIME_SHA"
          Write-Host 'R2_WARM_PACKAGE_REUSE=PASS'

      - name: Frozen Windows input matrix on packaged R2
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2Human\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_FAST_INPUT'
          & .\scripts\ci\packaged-os-input-gate.ps1 -Exe $inner -EvidenceDir $evidence -Map '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $summary=Join-Path $evidence 'PACKAGED_OS_INPUT_SUMMARY.txt'
          if(-not (Test-Path $summary)){ throw 'R2_FAST_INPUT_SUMMARY_MISSING' }
          Get-Content $summary | ForEach-Object { Write-Host $_ }
          Write-Host 'R2_FROZEN_OS_INPUT=PASS'

      - name: Packaged R2 smoke
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2Human\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_FAST_SMOKE.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $proc=Start-Process -FilePath $inner -ArgumentList @(
            '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
            '-log','-windowed','-ResX=1280','-ResY=720',
            '-PinkCabGateTelemetry',"-abslog=$log"
          ) -WorkingDirectory (Split-Path $inner) -PassThru
          try {
            $deadline=[DateTime]::UtcNow.AddSeconds(40)
            do {
              Start-Sleep -Milliseconds 300
              $proc.Refresh()
              if($proc.HasExited){ throw "R2_FAST_SMOKE_EXITED code=$($proc.ExitCode)" }
              $loaded=(Test-Path $log) -and [bool](Select-String $log -Pattern 'L_PinkCab_L1_EndlessStraight' -Quiet)
              $wheels=(Test-Path $log) -and [bool](Select-String $log -Pattern 'PINKCAB_GATE_STATE .*wheels=4' -Quiet)
            } while(( -not $loaded -or -not $wheels) -and [DateTime]::UtcNow -lt $deadline)

            if(-not $loaded){ throw 'R2_FAST_SMOKE_MAP_MISSING' }
            if(-not $wheels){ throw 'R2_FAST_SMOKE_TATRA_MISSING' }
            $critical=@(Select-String $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Failed to load package|LogStreaming: Error:|LogLinker: Error:|RoadConstruction.*not found' -ErrorAction SilentlyContinue)
            if($critical.Count -gt 0){
              $critical | Select-Object -Last 80 | ForEach-Object { Write-Host $_.Line }
              throw "R2_FAST_SMOKE_CRITICAL=$($critical.Count)"
            }
            Write-Host 'R2_PACKAGED_SMOKE=PASS'
          }
          finally {
            if($proc -and -not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Install and launch R2 HUMAN candidate
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $short=$env:PACKAGE_RUNTIME_SHA.Substring(0,8)
          $source=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2Human\Windows'
          $delivery=Join-Path $env:DELIVERY_BASE ("CD869_R2_CURBS_{0}_RUN{1}" -f $short,$env:GITHUB_RUN_ID)
          if(Test-Path $delivery){ Remove-Item $delivery -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $delivery | Out-Null

          & robocopy $source (Join-Path $delivery 'Windows') /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          $rc=$LASTEXITCODE
          if($rc -ge 8){ throw "R2_FAST_DELIVERY_COPY_FAILED $rc" }
          $global:LASTEXITCODE=0

          $inner=Join-Path $delivery 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'R2_FAST_DELIVERED_EXE_MISSING' }
          Set-Content (Join-Path $delivery 'CANDIDATE_SHA.txt') $env:PACKAGE_RUNTIME_SHA -NoNewline
          Set-Content (Join-Path $delivery 'VERIFICATION_HEAD.txt') $env:GITHUB_SHA -NoNewline
          Set-Content (Join-Path $delivery 'RUN_ID.txt') $env:GITHUB_RUN_ID -NoNewline

          $desktop=[Environment]::GetFolderPath('Desktop')
          $ws=New-Object -ComObject WScript.Shell
          foreach($name in @('PINKCAB R2 HUMAN.lnk','PINKCAB Latest.lnk')){
            $lnk=Join-Path $desktop $name
            Remove-Item $lnk -Force -ErrorAction SilentlyContinue
            $s=$ws.CreateShortcut($lnk)
            $s.TargetPath=$inner
            $s.Arguments='/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
            $s.WorkingDirectory=(Split-Path $inner)
            $s.Description="PINK CAB R2 raised median / separators / curbs HUMAN $env:PACKAGE_RUNTIME_SHA"
            $s.Save()
            Write-Host "R2_SHORTCUT=$lnk"
          }

          $saved=$env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID=''
          try {
            $proc=Start-Process -FilePath $inner -ArgumentList @(
              '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
              '-windowed','-ResX=1600','-ResY=900'
            ) -WorkingDirectory (Split-Path $inner) -PassThru

            $deadline=[DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              $proc.Refresh()
              if($proc.HasExited){ throw "R2_FAST_HUMAN_EXITED code=$($proc.ExitCode)" }
            } while($proc.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if($proc.MainWindowHandle -eq 0){ throw 'R2_FAST_HUMAN_WINDOW_MISSING' }

            $focused=$false
            for($i=0;$i -lt 12 -and -not $focused;$i++){
              $focused=[bool]$ws.AppActivate($proc.Id)
              Start-Sleep -Milliseconds 180
            }
            if(-not $focused){ throw 'R2_FAST_HUMAN_FOREGROUND_FAILED' }

            Write-Host "R2_HUMAN_DELIVERY=$delivery"
            Write-Host "R2_HUMAN_LAUNCHED_PID=$($proc.Id)"
            Write-Host 'R2_HUMAN_FOREGROUND=PASS'
            Write-Host 'R2_HUMAN_PENDING'
          }
          finally {
            $env:RUNNER_TRACKING_ID=$saved
          }
