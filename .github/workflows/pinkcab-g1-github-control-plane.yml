name: PINK CAB G1 GitHub Control Plane

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Verification lane
        required: true
        default: fast
        type: choice
        options:
          - fast
          - human_gate

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: pinkcab-g1-github-control-plane
  cancel-in-progress: true

jobs:
  gate:
    name: Exact-head PINK-CAB verification
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 120
    env:
      PINKCAB_UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      GATE_ROOT_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB
      ACCEPTED_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB\CODEONLY_8168d72_RUN35809749568
      FAST_ROOT: E:\CHESHIRE_DIVISION\Builds\PINKCAB\FAST_CURRENT
      EVIDENCE_DIR: Saved\GitHubGate
      GATE_LANE: ${{ inputs.lane }}
      CANDIDATE_REF: main
      TEMP: E:\CHESHIRE_DIVISION\GitHubRunner\PINK-CAB\tmp
      TMP: E:\CHESHIRE_DIVISION\GitHubRunner\PINK-CAB\tmp

    steps:
      - name: Verify PINK-CAB runner
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path 'E:\CHESHIRE_DIVISION\GitHubRunner\PINK-CAB\actions-runner')){throw 'PINK-CAB runner marker missing'}
          if(-not (Test-Path $env:PINKCAB_UE_ROOT)){throw 'UE 5.8 root missing'}
          if(-not (Test-Path "$env:ACCEPTED_BASE\Windows\PinkCab\Binaries\Win64\PinkCab.exe")){throw 'accepted cooked base missing'}
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          Write-Host 'PINKCAB_EXECUTION_HOST_OK'

      - name: Reap stale PINK-CAB Unreal processes
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $marker='E:\CHESHIRE_DIVISION\GitHubRunner\PINK-CAB\actions-runner\_work\PINK-CAB\PINK-CAB'
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.CommandLine -and $_.CommandLine.IndexOf($marker,[System.StringComparison]::OrdinalIgnoreCase) -ge 0 -and
              ($_.Name -in @('UnrealEditor.exe','UnrealEditor-Cmd.exe','AutomationTool.exe','PinkCab.exe'))
            } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

      - name: Checkout exact GitHub candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Exact-head preflight and zero-debt
        id: preflight
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          git lfs pull
          $head=(git rev-parse HEAD).Trim()
          $line=@(git ls-remote origin "refs/heads/$env:CANDIDATE_REF" | Select-Object -First 1)
          if($line.Count -eq 0){throw "candidate remote ref missing"}
          $expected=(($line[0] -split "\s+")[0]).Trim()
          if($head -ne $expected){throw "exact-head mismatch $head != $expected"}
          if(@(git status --porcelain).Count -gt 0){throw 'candidate checkout dirty'}
          python -m unittest scripts.tests.test_repo_hygiene scripts.tests.test_code_health -v
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null
          Set-Content "$env:EVIDENCE_DIR\CANDIDATE_SHA.txt" $head -NoNewline
          "CANDIDATE_SHA=$head" | Out-File $env:GITHUB_ENV -Append
          "candidate_sha=$head" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "EXACT_HEAD=$head"

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $context=if($env:GATE_LANE -eq 'fast'){'cheshire/pinkcab-fast'}else{'cheshire/pinkcab-human-gate'}
          $body=@{state='pending';context=$context;description="PINK-CAB $env:GATE_LANE running";target_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"}|ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:CANDIDATE_SHA" -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -ContentType 'application/json' -Body $body | Out-Null

      - name: Human-gate release trust preflight
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $subject='CN=CHESHIRE DIVISION PINKCAB DEV'
          $cert=Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert -ErrorAction SilentlyContinue |
            Where-Object {$_.Subject -eq $subject -and $_.HasPrivateKey} |
            Sort-Object NotAfter -Descending | Select-Object -First 1
          if(-not $cert){throw 'PINKCAB_RELEASE_TRUST_REQUIRED: dev signing identity is missing'}
          $root=Get-ChildItem Cert:\LocalMachine\Root -ErrorAction SilentlyContinue |
            Where-Object {$_.Thumbprint -eq $cert.Thumbprint} | Select-Object -First 1
          $publisher=Get-ChildItem Cert:\LocalMachine\TrustedPublisher -ErrorAction SilentlyContinue |
            Where-Object {$_.Thumbprint -eq $cert.Thumbprint} | Select-Object -First 1
          if(-not $root -or -not $publisher){
            throw 'PINKCAB_RELEASE_TRUST_REQUIRED: enforced Smart App Control requires the PINK-CAB dev signer in LocalMachine Root + TrustedPublisher (or external Trusted Signing) before Editor commandlets/full cook can run'
          }
          Write-Host "PINKCAB_RELEASE_MACHINE_TRUST=PASS Thumbprint=$($cert.Thumbprint)"

      - name: Build standalone game executable
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $env:PINKCAB_UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCab Win64 Development $project -WaitMutex -NoHotReloadFromIDE
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $exe=Join-Path $env:GITHUB_WORKSPACE 'Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $exe)){throw 'PinkCab game exe missing'}
          & .\scripts\ci\ensure-dev-signing.ps1 -Path $exe
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Write-Host 'PINKCAB_GAME_BUILD_SIGNED=PASS'

      - name: FAST cooked-base runtime gate
        if: ${{ env.GATE_LANE == 'fast' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path $env:FAST_ROOT){Remove-Item $env:FAST_ROOT -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $env:FAST_ROOT | Out-Null
          & robocopy $env:ACCEPTED_BASE $env:FAST_ROOT /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          $rc=$LASTEXITCODE
          if($rc -ge 8){throw "robocopy failed code=$rc"}
          $global:LASTEXITCODE=0
          $source=Join-Path $env:GITHUB_WORKSPACE 'Binaries\Win64\PinkCab.exe'
          $inner=Join-Path $env:FAST_ROOT 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          Copy-Item $source $inner -Force
          if((Get-AuthenticodeSignature $inner).Status -ne [System.Management.Automation.SignatureStatus]::Valid){throw 'FAST overlay lost valid dev signature'}
          & .\scripts\ci\packaged-os-input-gate.ps1 -Exe $inner -EvidenceDir (Join-Path $env:GITHUB_WORKSPACE $env:EVIDENCE_DIR)
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $desktop=[Environment]::GetFolderPath('Desktop')
          if($desktop){
            $outer=Join-Path $env:FAST_ROOT 'Windows\PinkCab.exe'
            $shortcut=Join-Path $desktop 'PINKCAB FAST HUMAN.lnk'
            $ws=New-Object -ComObject WScript.Shell
            $s=$ws.CreateShortcut($shortcut)
            $s.TargetPath=$outer
            $s.WorkingDirectory=Join-Path $env:FAST_ROOT 'Windows'
            $s.Description="PINK CAB FAST exact HEAD $env:CANDIDATE_SHA"
            $s.Save()
          }
          Write-Host 'PINKCAB_FAST_RUNTIME_GATE=PASS'

      - name: Build and sign Editor modules
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          & .\scripts\build.ps1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $pattern=Join-Path $env:GITHUB_WORKSPACE 'Binaries\Win64\UnrealEditor-PinkCab*.dll'
          & .\scripts\ci\ensure-dev-signing.ps1 -Path $pattern
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Write-Host 'PINKCAB_EDITOR_BUILD_SIGNED=PASS'

      - name: Human-gate full automation regression
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:PINKCAB_UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE "$env:EVIDENCE_DIR\FULL_PINKCAB_AUTOMATION.log"
          $since=Get-Date
          & $editor $project -Multiprocess -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $q=@(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $f=@(Select-String -Path $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:|GetLastError=4551')
          $blocks=Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-CodeIntegrity/Operational';StartTime=$since} -ErrorAction SilentlyContinue |
            Where-Object {$_.Message -match 'UnrealEditor-PinkCab' -and $_.Id -in 3033,3077}
          if($q.Count -eq 0 -or $f.Count -gt 0 -or @($blocks).Count -gt 0){throw "full automation failed queue=$($q.Count) fail=$($f.Count) ciBlocks=$(@($blocks).Count)"}
          Write-Host "FULL_PINKCAB_PASS $($q[-1].Line)"

      - name: Human-gate signed cook and package
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\Package'
          if(Test-Path $archive){Remove-Item $archive -Recurse -Force}
          $uat=Join-Path $env:PINKCAB_UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $since=Get-Date
          & $uat -WaitForUATMutex BuildCookRun "-project=$project" -noP4 -platform=Win64 -clientconfig=Development -skipbuild -cook -stage -pak -archive "-archivedirectory=$archive" -nodebuginfo -utf8output
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $outer=Join-Path $archive 'Windows\PinkCab.exe'
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $outer) -or -not (Test-Path $inner)){throw 'package executables missing'}
          & .\scripts\ci\ensure-dev-signing.ps1 -Path @($outer,$inner)
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $blocks=Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-CodeIntegrity/Operational';StartTime=$since} -ErrorAction SilentlyContinue |
            Where-Object {$_.Message -match 'PinkCab' -and $_.Id -in 3033,3077}
          if(@($blocks).Count -gt 0){throw "Code Integrity blocked signed cook path: $(@($blocks).Count)"}
          Write-Host 'PINKCAB_SIGNED_COOK=PASS'

      - name: Human-gate Windows input acceptance
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\Package\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          & .\scripts\ci\packaged-os-input-gate.ps1 -Exe $inner -EvidenceDir (Join-Path $env:GITHUB_WORKSPACE $env:EVIDENCE_DIR)
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Write-Host 'PINKCAB_HUMAN_TECHNICAL_GATE=PASS'

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PINKCAB-G1-evidence-${{ steps.preflight.outputs.candidate_sha }}-${{ github.run_id }}
          path: |
            Saved/GitHubGate
            Saved/Reports/code-health.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $state=if($env:JOB_STATUS -eq 'success'){'success'}else{'failure'}
          $context=if($env:GATE_LANE -eq 'fast'){'cheshire/pinkcab-fast'}else{'cheshire/pinkcab-human-gate'}
          $description=if($state -eq 'success' -and $env:GATE_LANE -eq 'fast'){'FAST signed runtime/input PASS'}elseif($state -eq 'success'){'Signed automation/cook/runtime PASS; HUMAN_PENDING'}else{"PINK-CAB $env:GATE_LANE failed"}
          $body=@{state=$state;context=$context;description=$description;target_url="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"}|ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:CANDIDATE_SHA" -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -ContentType 'application/json' -Body $body | Out-Null
