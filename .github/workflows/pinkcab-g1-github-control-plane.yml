name: PINK CAB G1 GitHub Control Plane

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Verification lane
        required: true
        default: fast
        type: choice
        options:
          - fast
          - human_gate
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: write
  issues: read
  pull-requests: read

concurrency:
  group: pinkcab-g1-github-control-plane
  cancel-in-progress: true

jobs:
  policy_diagnostic:
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.number == 7 && github.event.comment.user.login == 'CheshirskyCat63' && github.event.comment.body == '/pinkcab-policy' }}
    name: PINK-CAB Windows trust diagnostic
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 10
    steps:
      - name: Inspect Smart App Control and signing capability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "PinkCabPolicyDiagnostic"
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $refInfo = Invoke-RestMethod -Method Get -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/heads/fix/CD-848-recovery-r1-input-contract" -Headers $headers
          $candidateSha = [string]$refInfo.object.sha

          $ciTool = Join-Path $env:SystemRoot "System32\CiTool.exe"
          if (Test-Path $ciTool) {
            & $ciTool -lp 2>&1 | Tee-Object -FilePath (Join-Path $out "CITOOL_POLICIES.txt")
          } else {
            "CiTool.exe not found" | Set-Content (Join-Path $out "CITOOL_POLICIES.txt")
          }

          $dev = [ordered]@{}
          foreach ($item in @(
            @{Name='HKLM_AllowDevelopmentWithoutDevLicense'; Path='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'; Value='AllowDevelopmentWithoutDevLicense'},
            @{Name='HKLM_AllowAllTrustedApps'; Path='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'; Value='AllowAllTrustedApps'}
          )) {
            try {
              $dev[$item.Name] = (Get-ItemPropertyValue -Path $item.Path -Name $item.Value -ErrorAction Stop)
            } catch {
              $dev[$item.Name] = $null
            }
          }
          $dev | ConvertTo-Json | Set-Content (Join-Path $out "DEVELOPER_MODE.json")

          $certRows = New-Object System.Collections.Generic.List[object]
          foreach ($store in @('Cert:\CurrentUser\My','Cert:\LocalMachine\My')) {
            if (-not (Test-Path $store)) { continue }
            foreach ($cert in Get-ChildItem $store -ErrorAction SilentlyContinue) {
              $codeSigning = $false
              foreach ($eku in @($cert.EnhancedKeyUsageList)) {
                if ($eku.ObjectId.Value -eq '1.3.6.1.5.5.7.3.3') { $codeSigning = $true }
              }
              if ($codeSigning) {
                $certRows.Add([pscustomobject]@{
                  Store = $store
                  Subject = $cert.Subject
                  Issuer = $cert.Issuer
                  Thumbprint = $cert.Thumbprint
                  NotBefore = $cert.NotBefore
                  NotAfter = $cert.NotAfter
                  HasPrivateKey = $cert.HasPrivateKey
                })
              }
            }
          }
          $certRows | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $out "CODE_SIGNING_CERTS.json")

          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits"
          $signTools = @()
          if (Test-Path $kitsRoot) {
            $signTools = @(Get-ChildItem $kitsRoot -Filter signtool.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          }
          $signTools | Set-Content (Join-Path $out "SIGNTOOL_PATHS.txt")

          $summary = [ordered]@{
            CandidateSha = $candidateSha
            CodeSigningCertCount = $certRows.Count
            CodeSigningPrivateKeyCount = @($certRows | Where-Object HasPrivateKey).Count
            SignToolCount = $signTools.Count
            DeveloperMode = $dev['HKLM_AllowDevelopmentWithoutDevLicense']
          }
          $summary | ConvertTo-Json | Tee-Object -FilePath (Join-Path $out "SUMMARY.json")

          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{
            state = 'success'
            context = 'cheshire/pinkcab-policy'
            description = "Read-only Windows trust/signing diagnostic complete"
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$candidateSha" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

      - name: Upload Windows trust diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: PINKCAB-Windows-trust-${{ github.run_id }}
          path: ${{ runner.temp }}\PinkCabPolicyDiagnostic
          if-no-files-found: error
          retention-days: 7
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.number == 7 && github.event.comment.user.login == 'CheshirskyCat63' && (github.event.comment.body == '/pinkcab-fast' || github.event.comment.body == '/pinkcab-human')) }}
    name: Exact-head PINK-CAB verification
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 120
    env:
      PINKCAB_UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      GATE_ROOT_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB
      EVIDENCE_DIR: Saved\GitHubGate
      GATE_LANE: ${{ github.event_name == 'issue_comment' && (github.event.comment.body == '/pinkcab-human' && 'human_gate' || 'fast') || inputs.lane }}
      CANDIDATE_REF: ${{ github.event_name == 'issue_comment' && 'fix/CD-848-recovery-r1-input-contract' || github.ref_name }}

    steps:
      - name: Verify PINK-CAB execution host before checkout
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "runner_name=$env:RUNNER_NAME runner_os=$env:RUNNER_OS runner_arch=$env:RUNNER_ARCH"
          $runnerRoot = 'E:\CHESHIRE_DIVISION\GitHubRunner\PINK-CAB\actions-runner'
          if (-not (Test-Path $runnerRoot)) {
            throw "PINK-CAB runner marker missing: $runnerRoot"
          }
          if (-not (Test-Path $env:PINKCAB_UE_ROOT)) {
            throw "UE root missing: $env:PINKCAB_UE_ROOT"
          }
          Write-Host "PINKCAB_EXECUTION_HOST_OK"

      - name: Reap stale PINK-CAB Unreal runner processes
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $workspaceMarker = 'E:\CHESHIRE_DIVISION\GitHubRunner\PINK-CAB\actions-runner\_work\PINK-CAB\PINK-CAB'
          $stale = @(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object {
            if ([string]::IsNullOrWhiteSpace($_.CommandLine) -or
                $_.CommandLine -notlike "*$workspaceMarker*") {
              return $false
            }
            if ($_.Name -in @('UnrealEditor-Cmd.exe', 'UnrealEditor.exe', 'AutomationTool.exe')) {
              return $true
            }
            if ($_.Name -eq 'dotnet.exe' -and
                ($_.CommandLine -match 'UnrealBuildTool|AutomationTool')) {
              return $true
            }
            if ($_.Name -eq 'cmd.exe' -and
                ($_.CommandLine -match 'Build\.bat|RunUAT\.bat')) {
              return $true
            }
            return $false
          })
          foreach ($proc in $stale) {
            Write-Host "reaping stale runner process tree pid=$($proc.ProcessId) name=$($proc.Name)"
            Stop-Process -Id $proc.ProcessId -Force -ErrorAction SilentlyContinue
            & "$env:SystemRoot\System32\taskkill.exe" /PID $proc.ProcessId /T /F 2>$null | Out-Null
          }

          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          do {
            $remaining = @(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object {
              if ([string]::IsNullOrWhiteSpace($_.CommandLine) -or
                  $_.CommandLine -notlike "*$workspaceMarker*") {
                return $false
              }
              if ($_.Name -in @('UnrealEditor-Cmd.exe', 'UnrealEditor.exe', 'AutomationTool.exe')) {
                return $true
              }
              if ($_.Name -eq 'dotnet.exe' -and
                  ($_.CommandLine -match 'UnrealBuildTool|AutomationTool')) {
                return $true
              }
              if ($_.Name -eq 'cmd.exe' -and
                  ($_.CommandLine -match 'Build\.bat|RunUAT\.bat')) {
                return $true
              }
              return $false
            })
            if ($remaining.Count -eq 0) { break }
            Start-Sleep -Milliseconds 500
          } while ([DateTime]::UtcNow -lt $deadline)

          if ($remaining.Count -gt 0) {
            $remaining | ForEach-Object {
              Write-Host "remaining pid=$($_.ProcessId) name=$($_.Name) cmd=$($_.CommandLine)"
            }
            throw "Stale PINK-CAB Unreal runner process survived bounded tree cleanup."
          }
          Write-Host "PINKCAB_RUNNER_PROCESS_CLEAN"

      - name: Checkout exact GitHub candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
          lfs: true
          clean: true

      - name: Exact-head preflight
        id: preflight
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          git lfs pull
          $head = (git rev-parse HEAD).Trim()
          $expectedLine = @(git ls-remote origin "refs/heads/$env:CANDIDATE_REF" | Select-Object -First 1)
          if ($expectedLine.Count -eq 0) {
            throw "Candidate remote ref not found: $env:CANDIDATE_REF"
          }
          $expected = (($expectedLine[0] -split "\s+")[0]).Trim()
          if ($head -ne $expected) {
            throw "Exact-head violation: checkout=$head remote=$expected ref=$env:CANDIDATE_REF"
          }
          "CANDIDATE_SHA=$head" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "candidate_sha=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $status = @(git status --porcelain)
          if ($status.Count -gt 0) {
            $status | ForEach-Object { Write-Host $_ }
            throw "Candidate checkout is dirty before verification."
          }
          $pointers = @(Get-ChildItem -Recurse -File Content -ErrorAction SilentlyContinue |
            Select-String -Pattern '^version https://git-lfs.github.com/spec/v1$' -SimpleMatch -ErrorAction SilentlyContinue)
          if ($pointers.Count -gt 0) { throw "Unresolved Git LFS pointers remain." }
          Write-Host "runner_name=$env:RUNNER_NAME runner_os=$env:RUNNER_OS runner_arch=$env:RUNNER_ARCH"
          if (-not (Test-Path $env:PINKCAB_UE_ROOT)) { throw "UE root missing: $env:PINKCAB_UE_ROOT" }
          if (-not (Test-Path $env:GATE_ROOT_BASE)) {
            New-Item -ItemType Directory -Force -Path $env:GATE_ROOT_BASE | Out-Null
          }
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null
          Set-Content "$env:EVIDENCE_DIR\CANDIDATE_SHA.txt" $head -NoNewline
          @(
            "control_plane=github-actions",
            "source_of_execution=github_sha",
            "remote_desktop_commander=NOT_USED",
            "runner=$env:RUNNER_NAME",
            "workflow_run_id=$env:GITHUB_RUN_ID",
            "workflow_run_attempt=$env:GITHUB_RUN_ATTEMPT",
            "lane=$env:GATE_LANE"
          ) | Set-Content "$env:EVIDENCE_DIR\CONTROL_PLANE.txt"
          @(
            "automation_input_scope=UE_PlayerController_and_Automation",
            "os_hid_mouse=NOT_VERIFIED_BY_AUTOMATION",
            "packaged_os_input=WINDOWS_SYNTHETIC_SENDINPUT_ONLY",
            "human_acceptance=HUMAN_PENDING",
            "physics_smoke_note=ChaosBaseline.PhysicsOnly tests use direct dynamics-provider setup and are never gameplay-input acceptance",
            "fixture_input_note=ControllerPedalDriveWithFixtureDrivetrain uses fixture ignition/drivetrain setup and is never full cockpit E2E",
            "rule=technical_pass_never_implies_human_pass"
          ) | Set-Content "$env:EVIDENCE_DIR\AUTOMATION_SCOPE.txt"
          Write-Host "EXACT_HEAD=$head"

      - name: Publish exact-head gate pending status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $context = if ($env:GATE_LANE -eq 'fast') { 'cheshire/pinkcab-fast' } else { 'cheshire/pinkcab-human-gate' }
          $body = @{
            state = 'pending'
            context = $context
            description = "PINK-CAB $env:GATE_LANE verification running"
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:CANDIDATE_SHA" -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          } -ContentType 'application/json' -Body $body | Out-Null
          Write-Host "GITHUB_GATE_STATUS=pending"
          Write-Host "GITHUB_GATE_RUN_URL=$runUrl"

      - name: Strict code-health
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build PinkCabEditor
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare freshly-built PINK-CAB binaries for local verification
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $ev = Join-Path $env:GITHUB_WORKSPACE $env:EVIDENCE_DIR
          New-Item -ItemType Directory -Force -Path $ev | Out-Null
          $binRoot = Join-Path $env:GITHUB_WORKSPACE "Binaries\Win64"
          $projectBins = @()
          if (Test-Path $binRoot) {
            $projectBins = @(Get-ChildItem $binRoot -File -ErrorAction Stop | Where-Object {
              $_.Name -like 'UnrealEditor-PinkCab*.dll' -or
              $_.Name -like 'PinkCab*.exe' -or
              $_.Name -like 'PinkCab*.dll'
            })
          }
          foreach ($file in $projectBins) {
            Unblock-File -LiteralPath $file.FullName -ErrorAction SilentlyContinue
          }
          $rows = foreach ($file in $projectBins) {
            $zone = @(Get-Item -LiteralPath $file.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue)
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            [pscustomobject]@{
              Name = $file.Name
              Length = $file.Length
              ZoneIdentifierPresent = ($zone.Count -gt 0)
              SignatureStatus = [string]$sig.Status
              Signer = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
            }
          }
          $rows | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $ev "PROJECT_BINARY_TRUST.json")
          try {
            Get-WinEvent -LogName 'Microsoft-Windows-CodeIntegrity/Operational' -MaxEvents 80 -ErrorAction Stop |
              Where-Object { $_.Message -match 'PinkCab|UnrealEditor-PinkCab' } |
              Select-Object TimeCreated, Id, LevelDisplayName, Message |
              ConvertTo-Json -Depth 4 |
              Set-Content (Join-Path $ev "CODE_INTEGRITY_EVENTS_BEFORE_TEST.json")
          } catch {
            "CodeIntegrity event log unavailable: $($_.Exception.Message)" |
              Set-Content (Join-Path $ev "CODE_INTEGRITY_EVENTS_BEFORE_TEST.txt")
          }
          Write-Host "PINKCAB_PROJECT_BINARIES_PREPARED count=$($projectBins.Count)"

      - name: Fast recovery smoke matrix
        if: ${{ env.GATE_LANE == 'fast' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $editor = Join-Path $env:PINKCAB_UE_ROOT "Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "PinkCab.uproject"
          $ev = Join-Path $env:GITHUB_WORKSPACE $env:EVIDENCE_DIR
          $filters = @(
            'PinkCab.G1.HInp',
            'PinkCab.Cockpit.Input.Recovery',
            'PinkCab.Vehicle.ChaosBaseline.PhysicsOnly',
            'PinkCab.Vehicle.Visual.WheelPresentationChaosSync',
            'PinkCab.UI.SystemMenu'
          )
          $summary = New-Object System.Collections.Generic.List[string]
          foreach ($filter in $filters) {
            $safe = $filter.Replace('.','_')
            $log = Join-Path $ev ("FAST_" + $safe + ".log")
            Remove-Item $log -Force -ErrorAction SilentlyContinue
            & $editor $project -Multiprocess -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests $filter" "-TestExit=Automation Test Queue Empty"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $q = @(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
            $f = @(Select-String -Path $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
            $crit = @(Select-String -Path $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception')
            if ($q.Count -eq 0 -or $f.Count -gt 0 -or $crit.Count -gt 0) {
              throw "Fast matrix failed: $filter queue=$($q.Count) fail=$($f.Count) critical=$($crit.Count)"
            }
            $summary.Add("PASS $filter | $($q[-1].Line)")
          }
          $summary | Set-Content (Join-Path $ev "FAST_MATRIX.txt")
          Write-Host "FAST_MATRIX_PASS count=$($summary.Count)"

      - name: Input and recovery automated matrix
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $editor = Join-Path $env:PINKCAB_UE_ROOT "Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "PinkCab.uproject"
          $ev = Join-Path $env:GITHUB_WORKSPACE $env:EVIDENCE_DIR
          $filters = @(
            'PinkCab.Interaction.PlayerInput',
            'PinkCab.Vehicle.ChaosBaseline.Provider',
            'PinkCab.Vehicle.Input',
            'PinkCab.Vehicle.ControlRuntime.Runtime',
            'PinkCab.Cockpit.Input.Compliance',
            'PinkCab.Vehicle.PlayerInput',
            'PinkCab.UI.SystemMenu',
            'PinkCab.G1.HInp',
            'PinkCab.UI.SystemMenu.CanonicalControlHints',
            'PinkCab.Cockpit.Input.Recovery',
            'PinkCab.Vehicle.PlayerInput.PhysicalControlRouting',
            'PinkCab.Vehicle.ControlRuntime.Pedals.WheelPriority',
            'PinkCab.Vehicle.ControlRuntime.Pedals.TargetsAndCoexistence',
            'PinkCab.Vehicle.ControlRuntime.Launch.OneResetPerAttempt',
            'PinkCab.Vehicle.AssetContract.Tatra613V12',
            'PinkCab.Vehicle.Visual.PresentationBindingRuntime',
            'PinkCab.Vehicle.Visual.WheelPresentationChaosSync',
            'PinkCab.UI.SystemMenu.StartupHardPause',
            'PinkCab.Vehicle.ChaosBaseline.PhysicsOnly.DriveSmoke',
            'PinkCab.Vehicle.ChaosBaseline.PhysicsOnly.ReverseDriveSmoke',
            'PinkCab.Vehicle.Health.Drivetrain.HealthyThirtyMinutes'
          )
          $summary = New-Object System.Collections.Generic.List[string]
          foreach ($filter in $filters) {
            $safe = $filter.Replace('.','_').Replace('/','_')
            $log = Join-Path $ev ("AUTO_" + $safe + ".log")
            Remove-Item $log -Force -ErrorAction SilentlyContinue
            & $editor $project -Multiprocess -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests $filter" "-TestExit=Automation Test Queue Empty"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $q = @(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
            $f = @(Select-String -Path $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
            $c = @(Select-String -Path $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception')
            if ($q.Count -eq 0 -or $f.Count -gt 0 -or $c.Count -gt 0) {
              throw "Automated matrix failed: $filter queue=$($q.Count) fail=$($f.Count) critical=$($c.Count)"
            }
            $line = "PASS $filter | $($q[-1].Line)"
            $summary.Add($line)
            Write-Host $line
          }
          $summary | Set-Content (Join-Path $ev "AUTOMATED_MATRIX.txt")
          "count=$($summary.Count)" | Set-Content (Join-Path $ev "AUTOMATED_MATRIX_COUNT.txt")

      - name: Full PinkCab automation regression
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $editor = Join-Path $env:PINKCAB_UE_ROOT "Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "PinkCab.uproject"
          $log = Join-Path $env:GITHUB_WORKSPACE "$env:EVIDENCE_DIR\FULL_PINKCAB_AUTOMATION.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          & $editor $project -Multiprocess -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab" "-TestExit=Automation Test Queue Empty"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $q = @(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $f = @(Select-String -Path $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          $c = @(Select-String -Path $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception')
          if ($q.Count -eq 0 -or $f.Count -gt 0 -or $c.Count -gt 0) {
            throw "Full PinkCab regression failed: queue=$($q.Count) fail=$($f.Count) critical=$($c.Count)"
          }
          $q[-1].Line | Set-Content "$env:EVIDENCE_DIR\FULL_AUTOMATION_SUMMARY.txt"
          Write-Host "FULL_PINKCAB_PASS $($q[-1].Line)"

      - name: Canonical Win64 package
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\build.ps1 -Package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $outer = Join-Path $env:GITHUB_WORKSPACE "Artifacts\Package\Windows\PinkCab.exe"
          $inner = Join-Path $env:GITHUB_WORKSPACE "Artifacts\Package\Windows\PinkCab\Binaries\Win64\PinkCab.exe"
          if (-not (Test-Path $outer)) { throw "Outer packaged exe missing: $outer" }
          if (-not (Test-Path $inner)) { throw "Inner packaged exe missing: $inner" }
          Write-Host "PACKAGE_PASS"

      - name: Packaged smoke and critical scan
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $inner = Join-Path $env:GITHUB_WORKSPACE "Artifacts\Package\Windows\PinkCab\Binaries\Win64\PinkCab.exe"
          $log = Join-Path $env:GITHUB_WORKSPACE "$env:EVIDENCE_DIR\PACKAGED_SMOKE.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $inner -ArgumentList @(
            "-log","-NoSound","-windowed","-ResX=1280","-ResY=720","-abslog=$log"
          ) -WorkingDirectory (Split-Path $inner) -PassThru
          Start-Sleep -Seconds 12
          $alive = -not $proc.HasExited
          if ($alive) {
            Stop-Process -Id $proc.Id -Force
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path $log)) { throw "Packaged smoke log missing." }
          $map = @(Select-String -Path $log -Pattern 'UEngine::LoadMap Load map complete /Game/Dev/Maps/L_PinkCab_ChaosWeave')
          $critical = @(Select-String -Path $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Log[A-Za-z0-9_]+: Error:')
          if (-not $alive -or $map.Count -eq 0 -or $critical.Count -gt 0) {
            throw "Packaged smoke failed: alive=$alive map=$($map.Count) critical=$($critical.Count)"
          }
          "alive=$alive; map=$($map.Count); critical=0" | Set-Content "$env:EVIDENCE_DIR\PACKAGED_SMOKE_SUMMARY.txt"
          Write-Host "PACKAGED_SMOKE_PASS"

      - name: Deliver packaged diagnostic candidate before OS-input gate
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0,7)
          $diagName = "DIAG_RECOVERY_$short" + "_RUN" + $env:GITHUB_RUN_ID + "_A" + $env:GITHUB_RUN_ATTEMPT
          $diagRoot = Join-Path $env:GATE_ROOT_BASE $diagName
          if (Test-Path $diagRoot) { throw "Immutable diagnostic path already exists: $diagRoot" }

          New-Item -ItemType Directory -Force -Path $diagRoot | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "Artifacts\Package\*") -Destination $diagRoot -Recurse -Force
          $outer = Join-Path $diagRoot "Windows\PinkCab.exe"
          if (-not (Test-Path $outer)) { throw "Diagnostic outer exe missing." }

          @(
            "status=DIAGNOSTIC_ONLY",
            "human_status=HUMAN_PENDING",
            "source_sha=$sha",
            "workflow_run_id=$env:GITHUB_RUN_ID",
            "reason=fresh recovery package delivered before synthetic OS-input gate"
          ) | Set-Content (Join-Path $diagRoot "DIAGNOSTIC_BUILD_INFO.txt")
          Set-Content (Join-Path $diagRoot "BUILD_SHA.txt") $sha -NoNewline

          # Diagnostic packages are evidence only. They must never replace the
          # owner's PINKCAB Latest shortcut before the packaged OS-input gate passes.
          "diagnostic_root=$diagRoot" | Set-Content "$env:EVIDENCE_DIR\DIAGNOSTIC_DELIVERY.txt"
          "desktop_shortcut=NOT_UPDATED_DIAGNOSTIC_ONLY" | Add-Content "$env:EVIDENCE_DIR\DIAGNOSTIC_DELIVERY.txt"
          Write-Host "DIAGNOSTIC_BUILD_READY=$diagRoot"

      - name: Packaged Windows OS-input route and render evidence
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $inner = Join-Path $env:GITHUB_WORKSPACE "Artifacts\Package\Windows\PinkCab\Binaries\Win64\PinkCab.exe"
          $ev = Join-Path $env:GITHUB_WORKSPACE $env:EVIDENCE_DIR
          & .\scripts\ci\packaged-os-input-gate.ps1 -Exe $inner -EvidenceDir $ev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Immutable runner delivery and HUMAN_PENDING shortcut
        if: ${{ env.GATE_LANE == 'human_gate' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0,7)
          $gateName = "G1_GITHUB_$short" + "_RUN" + $env:GITHUB_RUN_ID + "_A" + $env:GITHUB_RUN_ATTEMPT
          $gateRoot = Join-Path $env:GATE_ROOT_BASE $gateName
          if (Test-Path $gateRoot) { throw "Immutable gate path already exists: $gateRoot" }

          New-Item -ItemType Directory -Force -Path $gateRoot | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "Artifacts\Package\*") -Destination $gateRoot -Recurse -Force
          $evidence = Join-Path $gateRoot "_evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Copy-Item -Path "$env:EVIDENCE_DIR\*" -Destination $evidence -Recurse -Force
          Copy-Item -Path "Saved\Reports\code-health.json" -Destination $evidence -Force

          $outer = Join-Path $gateRoot "Windows\PinkCab.exe"
          $inner = Join-Path $gateRoot "Windows\PinkCab\Binaries\Win64\PinkCab.exe"
          if (-not (Test-Path $outer)) { throw "Delivered outer exe missing." }
          if (-not (Test-Path $inner)) { throw "Delivered inner exe missing." }
          $outerHash = (Get-FileHash -Algorithm SHA256 $outer).Hash
          $innerHash = (Get-FileHash -Algorithm SHA256 $inner).Hash
          $pakFiles = @(Get-ChildItem -Path (Join-Path $gateRoot "Windows\PinkCab\Content\Paks") -File -ErrorAction Stop |
            Where-Object { $_.Extension -in '.pak','.utoc','.ucas' })
          if ($pakFiles.Count -lt 3) { throw "Expected pak/utoc/ucas provenance files." }
          $contentHashes = @()
          foreach ($file in $pakFiles) {
            $contentHashes += "$($file.Name)_sha256=$((Get-FileHash -Algorithm SHA256 $file.FullName).Hash)"
          }

          @(
            "gate=G1_HINP",
            "control_plane=github-actions",
            "technical_auto_status=PASS",
            "human_status=HUMAN_PENDING",
            "os_hid_mouse_status=HUMAN_PENDING",
            "source_sha=$sha",
            "workflow_run_id=$env:GITHUB_RUN_ID",
            "workflow_run_attempt=$env:GITHUB_RUN_ATTEMPT",
            "runner_name=$env:RUNNER_NAME",
            "build_root=$gateRoot",
            "exe=$outer",
            "exe_sha256=$outerHash",
            "inner_exe_sha256=$innerHash",
            "map=/Game/Dev/Maps/L_PinkCab_ChaosWeave"
          ) + $contentHashes | Set-Content (Join-Path $gateRoot "GATE_MANIFEST.txt")
          Set-Content (Join-Path $gateRoot "BUILD_SHA.txt") $sha -NoNewline

          $desktop = [Environment]::GetFolderPath("Desktop")
          if (-not [string]::IsNullOrWhiteSpace($desktop) -and (Test-Path $desktop)) {
            $latest = Join-Path $desktop "PINKCAB Latest.lnk"
            Remove-Item -LiteralPath $latest -Force -ErrorAction SilentlyContinue
            $ws = New-Object -ComObject WScript.Shell
            $s = $ws.CreateShortcut($latest)
            $s.TargetPath = $outer
            $s.WorkingDirectory = Join-Path $gateRoot "Windows"
            $s.Description = "PINK CAB $short - latest verified GitHub candidate / HUMAN PENDING"
            $s.Save()
            $verify = $ws.CreateShortcut($latest)
            if ($verify.TargetPath -ne $outer) {
              throw "Latest shortcut target mismatch: $($verify.TargetPath)"
            }
            "desktop_shortcut=$latest" | Set-Content "$env:EVIDENCE_DIR\RUNNER_DELIVERY.txt"
          } else {
            "desktop_shortcut=UNAVAILABLE_ON_RUNNER_SESSION" | Set-Content "$env:EVIDENCE_DIR\RUNNER_DELIVERY.txt"
          }
          "gate_root=$gateRoot" | Add-Content "$env:EVIDENCE_DIR\RUNNER_DELIVERY.txt"
          "exe_sha256=$outerHash" | Add-Content "$env:EVIDENCE_DIR\RUNNER_DELIVERY.txt"
          Write-Host "AUTO_TECHNICAL_PASS"
          Write-Host "HUMAN_PENDING"
          Write-Host "GATE_ROOT=$gateRoot"

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PINKCAB-G1-evidence-${{ steps.preflight.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/GitHubGate
            Saved/Reports/code-health.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload diagnostic package when packaging completed
        if: ${{ always() && env.GATE_LANE == 'human_gate' }}
        uses: actions/upload-artifact@v4
        with:
          name: PINKCAB-G1-diagnostic-package-${{ steps.preflight.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: Artifacts/Package/Windows
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Upload packaged human-gate build
        if: ${{ success() && env.GATE_LANE == 'human_gate' }}
        uses: actions/upload-artifact@v4
        with:
          name: PINKCAB-G1-package-${{ steps.preflight.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: Artifacts/Package/Windows
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish exact-head GitHub gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $description = if ($state -eq 'success' -and $env:GATE_LANE -eq 'fast') {
            "FAST technical PASS; package/human gate not run"
          } elseif ($state -eq 'success') {
            "AUTO technical PASS; HUMAN_PENDING"
          } elseif ($env:GATE_LANE -eq 'fast') {
            "FAST technical gate failed"
          } else {
            "AUTO technical gate failed; HUMAN not evaluated"
          }
          $context = if ($env:GATE_LANE -eq 'fast') { 'cheshire/pinkcab-fast' } else { 'cheshire/pinkcab-human-gate' }
          $body = @{
            state = $state
            context = $context
            description = $description
            target_url = $runUrl
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:CANDIDATE_SHA" -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          } -ContentType 'application/json' -Body $body | Out-Null
          Write-Host "GITHUB_GATE_STATUS=$state"
          Write-Host "HUMAN_STATUS=HUMAN_PENDING"
