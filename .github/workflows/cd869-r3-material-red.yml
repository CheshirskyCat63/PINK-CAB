name: CD-869 R3 Material RED

on:
  push:
    branches:
      - feat/CD-869-r3-metaroad-markings
    paths:
      - .github/workflows/cd869-r3-material-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 20
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Preflight and build
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R3_RED_HEAD_MISMATCH $head" }
          $dirty=@(git status --porcelain --untracked-files=no)
          if($dirty.Count -ne 0){ $dirty | % { Write-Host $_ }; throw 'R3_RED_TRACKED_DIRTY' }
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=6
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R3_MATERIAL_RED_BUILD=PASS'

      - name: RED exact material contract
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\R3_MATERIAL_RED.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.World.L1Road.R3.NativeMetaRoadMarkings" "-TestExit=Automation Test Queue Empty"
          $failed=(Test-Path $log) -and [bool](Select-String $log -Pattern 'uses the exact R3 road-mark paint material|Result=\{Fail\}|LogAutomationController: Error:' -Quiet)
          $wrong=(Test-Path $log) -and [bool](Select-String $log -Pattern 'M_PC_L1_Asphalt' -Quiet)
          Get-Content $log | Select-String -Pattern 'exact R3 road-mark paint|M_PC_L1_Asphalt|Result=\{Fail\}|LogAutomationController: Error:' | Select-Object -Last 160 | % { Write-Host $_.Line }
          if(-not $failed){ throw 'R3_MATERIAL_RED_DID_NOT_FAIL' }
          if(-not $wrong){ throw 'R3_MATERIAL_RED_WRONG_MATERIAL_NOT_PROVEN' }
          Write-Host 'R3_MATERIAL_RED=PASS'
