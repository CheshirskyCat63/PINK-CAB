name: CD-869 R2 Human Gate

on:
  push:
    branches:
      - feat/CD-869-r2-median-separators
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd869-r2-human
  cancel-in-progress: true

jobs:
  human:
    name: R2 exact-head package and human delivery
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 120
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      ACCEPTED_INPUT_SHA: 8168d72406af6934ab20eace583c2b895f0620b7
      DELIVERY_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB

    steps:
      - name: Prepare exact R2 worktree after releasing CI file locks
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:GITHUB_WORKSPACE

          Get-Process -Name PinkCab -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "R2_PRECHECKOUT_STOP_PINKCAB pid=$($_.Id)"
              Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
            }

          $workspacePattern=[Regex]::Escape($env:GITHUB_WORKSPACE)
          $ue=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('UnrealEditor.exe','UnrealEditor-Cmd.exe') -and
              $_.CommandLine -and
              $_.CommandLine -match $workspacePattern
            })
          foreach($p in $ue){
            Write-Host "R2_PRECHECKOUT_STOP_CI_UNREAL pid=$($p.ProcessId) name=$($p.Name)"
            Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          }
          if($ue.Count -gt 0){ Start-Sleep -Milliseconds 1000 }

          $branchName=$env:GITHUB_REF_NAME
          git fetch --prune origin "+refs/heads/${branchName}:refs/remotes/origin/${branchName}"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          $resetOk=$false
          for($attempt=1; $attempt -le 12 -and -not $resetOk; ++$attempt){
            git reset --hard $env:GITHUB_SHA
            if($LASTEXITCODE -eq 0){
              $resetOk=$true
            } else {
              Write-Host "R2_EXACT_RESET_RETRY=$attempt"
              Start-Sleep -Milliseconds 500
            }
          }
          if(-not $resetOk){ throw 'R2_EXACT_RESET_FAILED' }

          git lfs install --local
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          git lfs pull
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R2_PREPARED_HEAD_MISMATCH $head != $env:GITHUB_SHA" }
          Write-Host "R2_EXACT_WORKTREE=PASS head=$head"

      - name: Exact-head preflight and frozen contracts
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R2_HUMAN_HEAD_MISMATCH $head != $env:GITHUB_SHA" }
          $tracked=@(git status --porcelain --untracked-files=no)
          if($tracked.Count -ne 0){
            $tracked | ForEach-Object { Write-Host $_ }
            throw 'R2_HUMAN_TRACKED_CHECKOUT_DIRTY'
          }

          $required=@(
            'Content\World\L1\Road\RoadSurface.uasset',
            'Content\World\L1\Road\RoadConstruction.uasset',
            'Content\World\L1\Road\Materials\M_PC_L1_CurbConcrete.uasset',
            'Content\Dev\Maps\L_PinkCab_L1_EndlessStraight.umap'
          )
          foreach($rel in $required){
            $full=Join-Path $env:GITHUB_WORKSPACE $rel
            if(-not (Test-Path $full)){ throw "R2_REQUIRED_CONTENT_MISSING $rel" }
          }

          $frozen=@(
            'Source/PinkCab/Private/Runtime/PinkCabChaosTatraPawnDriver.cpp',
            'Source/PinkCab/Private/Runtime/PinkCabChaosTatraPawnCockpit.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabPlayerInputAdapter.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabSemanticInputRouter.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabPhysicalInputConvention.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabWheelInputResponse.cpp',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPlayerInputAdapter.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPlayerInputSample.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabSemanticInputRouter.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPhysicalInputConvention.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabWheelInputResponse.h',
            'Source/PinkCab/Private/Vehicle/PinkCabVehicleInputFrame.cpp',
            'Source/PinkCab/Public/Vehicle/PinkCabVehicleInputFrame.h',
            'Source/PinkCab/Public/Vehicle/Detail/PinkCabVehicleInputFrame.inl',
            'Config/DefaultInput.ini'
          )
          $delta=@()
          foreach($p in $frozen){
            $d=@(git diff --name-only "$env:ACCEPTED_INPUT_SHA..HEAD" -- $p)
            if($d.Count -gt 0){ $delta += $d }
          }
          $delta=@($delta | Sort-Object -Unique)
          if($delta.Count -gt 0){
            $delta | ForEach-Object { Write-Host "R2_FROZEN_INPUT_DELTA=$_" }
            throw 'R2_FROZEN_INPUT_SOURCE_CHANGED'
          }

          $r1Canonical='7ac89d3fea32791fb683ef83ec0e76bdbb32dc92'
          $r2Changes=@(git diff --name-only "$r1Canonical..HEAD")
          $forbidden=@($r2Changes | Where-Object {
            $_ -match '^Source/PinkCabVehicle/' -or
            $_ -match '^Source/PinkCab/Private/Vehicle/' -or
            $_ -match '^Source/PinkCabInteraction/' -or
            $_ -match '^Content/World/L1/Road/Materials/M_PC_L1_Asphalt' -or
            $_ -match '^Config/DefaultInput.ini$'
          })
          if($forbidden.Count -gt 0){
            $forbidden | ForEach-Object { Write-Host "R2_SCOPE_FORBIDDEN=$_" }
            throw 'R2_SCOPE_GUARD_FAILED'
          }

          Write-Host 'R2_FROZEN_INPUT_SOURCE_IDENTICAL=PASS'
          Write-Host 'R2_SCOPE_GUARD=PASS'
          Write-Host "R2_HUMAN_HEAD=$head"

      - name: Close previous PINK-CAB and CI Unreal processes
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Get-Process -Name PinkCab -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "R2_STOP_OLD_PINKCAB pid=$($_.Id)"
              Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
            }

          $workspacePattern=[Regex]::Escape($env:GITHUB_WORKSPACE)
          $ue=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('UnrealEditor.exe','UnrealEditor-Cmd.exe') -and
              $_.CommandLine -and
              $_.CommandLine -match $workspacePattern
            })
          foreach($p in $ue){
            Write-Host "R2_STOP_CI_UNREAL pid=$($p.ProcessId)"
            Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Milliseconds 800
          Write-Host 'R2_PROCESS_CLEAN=PASS'

      - name: Build PinkCabEditor exact head
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=6
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R2_EXACT_EDITOR_BUILD=PASS'

      - name: Run R2 exact-head automation
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_EXACT.log'
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.World.L1Road.R2" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $queue=@(Select-String $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fails=@(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          if($queue.Count -eq 0){ throw 'R2_EXACT_QUEUE_MISSING' }
          if($fails.Count -gt 0){ throw "R2_EXACT_FAILURES=$($fails.Count)" }
          Write-Host "R2_EXACT_AUTOMATION=PASS $($queue[-1].Line)"

      - name: Re-run accepted R1 world regressions
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          foreach($suite in @('PinkCab.World.L1EndlessRoad','PinkCab.World.Materialization')){
            $safe=$suite.Replace('.','_')
            $log=Join-Path $env:GITHUB_WORKSPACE ("Saved\GitHubGate\CD869_R2_{0}.log" -f $safe)
            & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests $suite" "-TestExit=Automation Test Queue Empty"
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
            $queue=@(Select-String $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
            $fails=@(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
            if($queue.Count -eq 0 -or $fails.Count -gt 0){
              throw "R2_R1_REGRESSION suite=$suite queue=$($queue.Count) fails=$($fails.Count)"
            }
            Write-Host "R2_R1_REGRESSION=PASS suite=$suite $($queue[-1].Line)"
          }

      - name: Strict zero debt
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R2_ZERO_DEBT=PASS'

      - name: Clear CI Live Coding before R2 cook
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Get-Process -Name PinkCab -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "R2_PRECOOK_STOP_PINKCAB pid=$($_.Id)"
              Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
            }

          $workspacePattern=[Regex]::Escape($env:GITHUB_WORKSPACE)
          $ue=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('UnrealEditor.exe','UnrealEditor-Cmd.exe') -and
              $_.CommandLine -and
              $_.CommandLine -match $workspacePattern
            })
          foreach($p in $ue){
            Write-Host "R2_PRECOOK_STOP_CI_UNREAL pid=$($p.ProcessId) name=$($p.Name)"
            Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          }
          if($ue.Count -gt 0){ Start-Sleep -Milliseconds 1000 }

          $remaining=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('UnrealEditor.exe','UnrealEditor-Cmd.exe') -and
              $_.CommandLine -and
              $_.CommandLine -match $workspacePattern
            })
          if($remaining.Count -gt 0){
            $remaining | ForEach-Object { Write-Host "R2_PRECOOK_CI_UNREAL_SURVIVED pid=$($_.ProcessId)" }
            throw "R2_PRECOOK_CI_UNREAL_SURVIVED=$($remaining.Count)"
          }
          Write-Host 'R2_PRECOOK_LIVE_CODING_CLEAR=PASS'

      - name: Build cook package R2 human candidate
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $uat=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $archive=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2Human'
          if(Test-Path $archive){ Remove-Item $archive -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $archive | Out-Null

          $backup="$project.r2-human-backup"
          Copy-Item $project $backup -Force
          $uatExit=1
          try {
            $descriptor=Get-Content -Raw $project | ConvertFrom-Json
            $descriptor.Modules=@($descriptor.Modules | Where-Object { $_.Name -ne 'PinkCabTests' })
            $descriptor.Plugins=@($descriptor.Plugins | Where-Object { $_.Name -notin @('MetaRoad','StructUtils') })
            $descriptor | ConvertTo-Json -Depth 32 | Set-Content $project -Encoding UTF8

            & $uat -WaitForUATMutex BuildCookRun "-project=$project" -noP4 -platform=Win64 -clientconfig=Development -build -cook "-map=/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight" -stage -pak -archive "-archivedirectory=$archive" -nodebuginfo -utf8output "-AdditionalBuildArgs=-MaxParallelActions=6"
            $uatExit=$LASTEXITCODE
          }
          finally {
            Move-Item $backup $project -Force
          }
          if($uatExit -ne 0){ exit $uatExit }

          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'R2_INNER_EXE_MISSING' }
          & .\scripts\ci\ensure-dev-signing.ps1 -Path @($inner)
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if((Get-AuthenticodeSignature $inner).Status -ne [System.Management.Automation.SignatureStatus]::Valid){
            throw 'R2_INNER_SIGNATURE_INVALID'
          }
          Write-Host 'R2_CONTENT_AWARE_PACKAGE=PASS'

      - name: Frozen packaged input contract on R2
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2Human\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_INPUT'
          & .\scripts\ci\packaged-os-input-gate.ps1 -Exe $inner -EvidenceDir $evidence -Map '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $summary=Join-Path $evidence 'PACKAGED_OS_INPUT_SUMMARY.txt'
          if(-not (Test-Path $summary)){ throw 'R2_INPUT_SUMMARY_MISSING' }
          Get-Content $summary | ForEach-Object { Write-Host $_ }
          Write-Host 'R2_FROZEN_OS_INPUT=PASS'

      - name: Packaged R2 smoke
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2Human\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_PACKAGED.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $proc=Start-Process -FilePath $inner -ArgumentList @(
            '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
            '-log','-windowed','-ResX=1280','-ResY=720',
            '-PinkCabGateTelemetry',"-abslog=$log"
          ) -WorkingDirectory (Split-Path $inner) -PassThru
          try {
            $deadline=[DateTime]::UtcNow.AddSeconds(40)
            do {
              Start-Sleep -Milliseconds 300
              $proc.Refresh()
              if($proc.HasExited){ throw "R2_PACKAGED_EXITED_EARLY code=$($proc.ExitCode)" }
              $loaded=(Test-Path $log) -and [bool](Select-String $log -Pattern 'L_PinkCab_L1_EndlessStraight' -Quiet)
              $wheels=(Test-Path $log) -and [bool](Select-String $log -Pattern 'PINKCAB_GATE_STATE .*wheels=4' -Quiet)
            } while(( -not $loaded -or -not $wheels) -and [DateTime]::UtcNow -lt $deadline)
            if(-not $loaded){ throw 'R2_PACKAGED_MAP_MARKER_MISSING' }
            if(-not $wheels){ throw 'R2_PACKAGED_TATRA_MARKER_MISSING' }
            $critical=@(Select-String $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Failed to load package|LogStreaming: Error:|LogLinker: Error:|RoadConstruction.*not found' -ErrorAction SilentlyContinue)
            if($critical.Count -gt 0){
              $critical | Select-Object -Last 80 | ForEach-Object { Write-Host $_.Line }
              throw "R2_PACKAGED_CRITICAL=$($critical.Count)"
            }
            Write-Host 'R2_PACKAGED_SMOKE=PASS'
          }
          finally {
            if($proc -and -not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Install and launch R2 HUMAN gate
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          $short=$sha.Substring(0,8)
          $source=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2Human\Windows'
          $delivery=Join-Path $env:DELIVERY_BASE ("CD869_R2_CURBS_{0}_RUN{1}" -f $short,$env:GITHUB_RUN_ID)
          if(Test-Path $delivery){ Remove-Item $delivery -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $delivery | Out-Null
          & robocopy $source (Join-Path $delivery 'Windows') /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          $rc=$LASTEXITCODE
          if($rc -ge 8){ throw "R2_DELIVERY_COPY_FAILED $rc" }
          $global:LASTEXITCODE=0

          $inner=Join-Path $delivery 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'R2_DELIVERED_EXE_MISSING' }
          Set-Content (Join-Path $delivery 'CANDIDATE_SHA.txt') $sha -NoNewline
          Set-Content (Join-Path $delivery 'RUN_ID.txt') $env:GITHUB_RUN_ID -NoNewline

          $desktop=[Environment]::GetFolderPath('Desktop')
          $ws=New-Object -ComObject WScript.Shell
          foreach($name in @('PINKCAB R2 HUMAN.lnk','PINKCAB Latest.lnk')){
            $lnk=Join-Path $desktop $name
            Remove-Item $lnk -Force -ErrorAction SilentlyContinue
            $s=$ws.CreateShortcut($lnk)
            $s.TargetPath=$inner
            $s.Arguments='/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
            $s.WorkingDirectory=(Split-Path $inner)
            $s.Description="PINK CAB R2 raised road construction HUMAN $sha"
            $s.Save()
            Write-Host "R2_SHORTCUT=$lnk"
          }

          $saved=$env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID=''
          try {
            $proc=Start-Process -FilePath $inner -ArgumentList @(
              '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
              '-windowed','-ResX=1600','-ResY=900'
            ) -WorkingDirectory (Split-Path $inner) -PassThru

            $deadline=[DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              $proc.Refresh()
              if($proc.HasExited){ throw "R2_HUMAN_EXITED_EARLY code=$($proc.ExitCode)" }
            } while($proc.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if($proc.MainWindowHandle -eq 0){ throw 'R2_HUMAN_WINDOW_NOT_READY' }

            $focused=$false
            for($i=0;$i -lt 12 -and -not $focused;$i++){
              $focused=[bool]$ws.AppActivate($proc.Id)
              Start-Sleep -Milliseconds 180
            }
            if(-not $focused){ throw 'R2_HUMAN_FOREGROUND_FAILED' }

            Write-Host "R2_HUMAN_DELIVERY=$delivery"
            Write-Host "R2_HUMAN_LAUNCHED_PID=$($proc.Id)"
            Write-Host 'R2_HUMAN_FOREGROUND=PASS'
            Write-Host 'R2_HUMAN_PENDING'
          }
          finally {
            $env:RUNNER_TRACKING_ID=$saved
          }
