name: CD-869 R3 Lane Width Calibration

on:
  push:
    branches:
      - feat/CD-869-r3-metaroad-markings
    paths:
      - .github/workflows/cd869-r3-bake.yml

permissions:
  contents: write

concurrency:
  group: cd869-r3-width-calibration
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 60
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      META_PLUGIN: C:\Program Files\Epic Games\UE_5.8\Engine\Plugins\Marketplace\MetaRoad08e3462d55e7V4\MetaRoad.uplugin
      HUMAN_BASE_SHA: 8b3e8ce69b6d44e542b59695b7332447791b9ee1

    steps:
      - name: Checkout exact calibration candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Exact-head preflight
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "CD869_WIDTH_HEAD_MISMATCH $head != $env:GITHUB_SHA" }
          $tracked=@(git status --porcelain --untracked-files=no)
          if($tracked.Count -ne 0){ $tracked | % { Write-Host $_ }; throw 'CD869_WIDTH_TRACKED_DIRTY' }
          if(-not(Test-Path $env:META_PLUGIN)){ throw "CD869_WIDTH_METAROAD_MISSING=$env:META_PLUGIN" }
          $meta=Get-Content -Raw $env:META_PLUGIN | ConvertFrom-Json
          if($meta.VersionName -ne '3.2.0'){ throw "CD869_WIDTH_METAROAD_VERSION=$($meta.VersionName)" }
          git merge-base --is-ancestor $env:HUMAN_BASE_SHA HEAD
          if($LASTEXITCODE -ne 0){ throw 'CD869_WIDTH_BASE_NOT_ANCESTOR' }

          $author='Source/PinkCabTests/Private/World/PinkCabL1MetaRoadAuthoringTests.cpp'
          $runtime='Source/PinkCab/Private/World/PinkCabL1RoadChunkActor.cpp'
          if(-not(Select-String $author -Pattern 'ExpressLaneWidthCm = 450\.0' -Quiet)){ throw 'CD869_WIDTH_EXPRESS_NOT_450' }
          if(-not(Select-String $author -Pattern 'LocalLaneWidthCm = 400\.0' -Quiet)){ throw 'CD869_WIDTH_LOCAL_NOT_400' }
          if(-not(Select-String $author -Pattern 'ExpectedRoadWidthCm = 7900\.0' -Quiet)){ throw 'CD869_WIDTH_ENVELOPE_NOT_7900' }
          if(-not(Select-String $runtime -Pattern '3450\.0' -Quiet)){ throw 'CD869_WIDTH_RUNTIME_MARK_TRANSFORMS_STALE' }
          if(-not(Select-String $runtime -Pattern '3950\.0' -Quiet)){ throw 'CD869_WIDTH_RUNTIME_CURB_TRANSFORMS_STALE' }

          Write-Host "CD869_WIDTH_HEAD=$head"
          Write-Host "CD869_WIDTH_METAROAD=$($meta.VersionName)"
          Write-Host 'CD869_WIDTH_EXPRESS_CM=450'
          Write-Host 'CD869_WIDTH_LOCAL_CM=400'
          Write-Host 'CD869_WIDTH_ENVELOPE_CM=7900'
          git remote -v | % { Write-Host "CD869_WIDTH_REMOTE $_" }
          git log -6 --oneline | % { Write-Host "CD869_WIDTH_LOG $_" }
          Write-Host 'CD869_WIDTH_PREFLIGHT=PASS'

      - name: Build PinkCabEditor exact head
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Get-Process -Name PinkCab,UnrealEditor,UnrealEditor-Cmd -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=6
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'CD869_WIDTH_EDITOR_BUILD=PASS'

      - name: Re-bake widened road through native MetaRoad
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          # MetaRoad allocates a numbered asset name when an old generated package
          # already exists. Remove the previous generated layer from this isolated CI
          # worktree so the widened rebake replaces canonical RoadSurface/Curbs/Marks
          # instead of creating RoadSurface1 / RoadCurbs32.. / RoadMarks50...
          foreach($pattern in @('RoadSurface*.uasset','RoadSidewalks*.uasset','RoadCurbs*.uasset','RoadMarks*.uasset')){
            Get-ChildItem 'Content\World\L1\Road' -Filter $pattern -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "CD869_WIDTH_REMOVE_PREVIOUS=$($_.Name)"
                Remove-Item -LiteralPath $_.FullName -Force
              }
          }

          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_WIDTH_BAKE.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          & $editor $project -unattended -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.Editor.GenerateL1EndlessRoadAssets" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0 -or (Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:' -Quiet)){
            Get-Content $log | Select-Object -Last 260 | % { Write-Host $_ }
            throw 'CD869_WIDTH_NATIVE_BAKE_FAIL'
          }
          if(-not(Select-String $log -Pattern 'CD869_METAROAD_BAKE=PASS' -Quiet)){ throw 'CD869_WIDTH_BAKE_MARKER_MISSING' }
          $bounds=@(Select-String $log -Pattern 'MetaRoad generated bounds:' -ErrorAction SilentlyContinue)
          $bounds | % { Write-Host $_.Line }
          $surfaces=@(Get-ChildItem 'Content\World\L1\Road' -Filter 'RoadSurface*.uasset' -File)
          $sidewalks=@(Get-ChildItem 'Content\World\L1\Road' -Filter 'RoadSidewalks*.uasset' -File)
          $curbs=@(Get-ChildItem 'Content\World\L1\Road' -Filter 'RoadCurbs*.uasset' -File)
          $marks=@(Get-ChildItem 'Content\World\L1\Road' -Filter 'RoadMarks*.uasset' -File)
          if($surfaces.Count -ne 1){ throw "CD869_WIDTH_BAKED_SURFACE_COUNT=$($surfaces.Count)" }
          if($sidewalks.Count -ne 1){ throw "CD869_WIDTH_BAKED_SIDEWALK_COUNT=$($sidewalks.Count)" }
          if($curbs.Count -ne 32){ throw "CD869_WIDTH_BAKED_CURB_COUNT=$($curbs.Count)" }
          if($marks.Count -ne 50){ throw "CD869_WIDTH_BAKED_MARK_COUNT=$($marks.Count)" }
          Write-Host 'CD869_WIDTH_NATIVE_BAKE=PASS surface=1 sidewalks=1 curbs=32 marks=50'

      - name: Rebind project runtime materials
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_WIDTH_MATERIALS.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.Editor.GenerateL1EndlessRoadRuntimeMaterials" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0 -or (Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:' -Quiet)){
            Get-Content $log | Select-Object -Last 240 | % { Write-Host $_ }
            throw 'CD869_WIDTH_MATERIAL_BIND_FAIL'
          }
          if(-not(Select-String $log -Pattern 'CD869_RUNTIME_MATERIAL_OWNERSHIP=PASS' -Quiet)){ throw 'CD869_WIDTH_MATERIAL_MARKER_MISSING' }
          if(-not(Test-Path 'Content\World\L1\Road\Materials\M_PC_L1_Mark.uasset')){ throw 'CD869_WIDTH_MARK_MATERIAL_MISSING' }
          Write-Host 'CD869_WIDTH_MATERIALS=PASS'

      - name: Focused calibration regression
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $suites=@(
            'PinkCab.World.L1Road.R3.NativeMetaRoadMarkings',
            'PinkCab.World.L1Road.R2.NativeMetaRoadAsset',
            'PinkCab.World.L1EndlessRoad',
            'PinkCab.World.Materialization',
            'PinkCab.Vehicle.HGate.DeliberateCenterEntry'
          )
          foreach($suite in $suites){
            $safe=($suite -replace '[^A-Za-z0-9_.-]','_')
            $log=Join-Path $env:GITHUB_WORKSPACE ("Saved\GitHubGate\WIDTH_$safe.log")
            Remove-Item $log -Force -ErrorAction SilentlyContinue
            & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests $suite" "-TestExit=Automation Test Queue Empty"
            if($LASTEXITCODE -ne 0 -or (Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:' -Quiet)){
              Get-Content $log | Select-Object -Last 220 | % { Write-Host $_ }
              throw "CD869_WIDTH_TEST_FAIL=$suite"
            }
            Write-Host "CD869_WIDTH_TEST_PASS=$suite"
          }
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'CD869_WIDTH_ZERO_DEBT=PASS'

      - name: Commit widened native MetaRoad assets
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          git add -- 'Content/Dev/Authoring/L_PC_L1_MetaRoadAuthoring.umap'
          git add -- 'Content/World/L1/Road/*.uasset'
          git add -- 'Content/World/L1/Road/Materials/*.uasset'

          $staged=@(git diff --cached --name-only)
          if($staged.Count -eq 0){ throw 'CD869_WIDTH_NO_ASSET_DELTA' }
          $staged | % { Write-Host "CD869_WIDTH_STAGED=$_" }

          foreach($file in $staged){
            $allowed=
              ($file -eq 'Content/Dev/Authoring/L_PC_L1_MetaRoadAuthoring.umap') -or
              ($file -match '^Content/World/L1/Road/(RoadSurface|RoadSidewalks|RoadCurbs[0-9]*|RoadMarks[0-9]*)\.uasset$') -or
              ($file -match '^Content/World/L1/Road/Materials/M_PC_L1_(Asphalt|GreenDivider|Shoulder|Mark)\.uasset$')
            if(-not $allowed){ throw "CD869_WIDTH_ASSET_SCOPE_VIOLATION=$file" }
          }

          if(-not($staged -contains 'Content/World/L1/Road/RoadSurface.uasset')){ throw 'CD869_WIDTH_ROAD_SURFACE_NOT_REBAKED' }
          $stagedMarks=@($staged | Where-Object { $_ -match '^Content/World/L1/Road/RoadMarks[0-9]*\.uasset$' })
          if($stagedMarks.Count -lt 1){ throw 'CD869_WIDTH_MARKS_NOT_REBAKED' }

          git config user.name 'CHESHIRE DIVISION R3 Runner'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'asset(CD-869): widen L1 lanes 25 percent via MetaRoad [skip ci]'
          $assetSha=(git rev-parse HEAD).Trim()
          git push origin HEAD:feat/CD-869-r3-metaroad-markings
          Write-Host "CD869_WIDTH_ASSET_SHA=$assetSha"
          Write-Host 'CD869_WIDTH_ASSET_PUSH=PASS'
