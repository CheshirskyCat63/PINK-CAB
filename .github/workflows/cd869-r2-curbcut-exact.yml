name: CD-869 R2 CurbCut exact headers
on:
  push:
    branches: [feat/CD-869-r2-median-separators]
    paths: [.github/workflows/cd869-r2-curbcut-exact.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          clean: false
      - name: Extract exact curbcut declarations
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $root=(Get-ChildItem 'C:\Program Files\Epic Games\UE_5.8\Engine\Plugins\Marketplace' -Recurse -Filter MetaRoad.uplugin -File | Select-Object -First 1).Directory.FullName
          if(-not $root){ throw 'METAROAD_NOT_FOUND' }
          $out='docs\audits\CD869_R2_CURBCUT_EXACT.txt'
          Set-Content $out ('root=' + $root)
          $files=@(Get-ChildItem (Join-Path $root 'Source') -Recurse -File -Include *.h,*.cpp | Where-Object {
            Select-String -Path $_.FullName -Pattern 'FRoadLaneAttributeCurbCutValue|URoadLaneAttributeCurbCutDescriptor' -Quiet
          })
          foreach($f in $files){
            Add-Content $out ""
            Add-Content $out ("=== " + $f.FullName.Substring($root.Length+1) + " ===")
            Get-Content $f.FullName | Add-Content $out
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $out
          if(-not (git diff --cached --quiet)){
            git commit -m 'audit(CD-869): capture exact MetaRoad curbcut declarations'
            git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
          }
