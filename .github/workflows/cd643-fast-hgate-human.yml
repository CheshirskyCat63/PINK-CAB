name: CD-643 Fast H-Gate Human Delivery

on:
  push:
    branches: [feat/CD-869-r2-median-separators]
    paths: [docs/audits/CD643_FAST_DELIVER_TRIGGER.txt]

permissions:
  contents: read

concurrency:
  group: cd643-fast-hgate-human
  cancel-in-progress: true

jobs:
  deliver:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 12
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      DELIVERY_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB

    steps:
      - name: Checkout exact requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Exact-head guard
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "CD643_FAST_HEAD_MISMATCH $head != $env:GITHUB_SHA" }
          $tracked=@(git status --porcelain --untracked-files=no)
          if($tracked.Count -ne 0){ $tracked | % { Write-Host $_ }; throw 'CD643_FAST_DIRTY' }
          Write-Host "CD643_FAST_SOURCE_SHA=$head"

      - name: Build exact Win64 package
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Get-Process -Name PinkCab -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }

          $uat=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $archive=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD643FastHuman'
          if(Test-Path $archive){ Remove-Item $archive -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $archive | Out-Null

          $backup="$project.cd643-fast-backup"
          Copy-Item $project $backup -Force
          $exit=1
          try {
            $descriptor=Get-Content -Raw $project | ConvertFrom-Json
            $descriptor.Modules=@($descriptor.Modules | Where-Object { $_.Name -ne 'PinkCabTests' })
            $descriptor.Plugins=@($descriptor.Plugins | Where-Object { $_.Name -notin @('MetaRoad','StructUtils') })
            $descriptor | ConvertTo-Json -Depth 32 | Set-Content $project -Encoding UTF8

            & $uat -WaitForUATMutex BuildCookRun "-project=$project" -noP4 -platform=Win64 -clientconfig=Development -build -cook "-map=/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight" -stage -pak -archive "-archivedirectory=$archive" -nodebuginfo -utf8output "-AdditionalBuildArgs=-MaxParallelActions=6"
            $exit=$LASTEXITCODE
          }
          finally {
            Move-Item $backup $project -Force
          }
          if($exit -ne 0){ exit $exit }

          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'CD643_FAST_EXACT_EXE_MISSING' }
          & .\scripts\ci\ensure-dev-signing.ps1 -Path @($inner)
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Set-Content (Join-Path $archive 'SOURCE_SHA.txt') $env:GITHUB_SHA -NoNewline
          Write-Host "CD643_FAST_EXACT_PACKAGE=PASS sha=$env:GITHUB_SHA"

      - name: Packaged H-gate and input proof
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD643FastHuman\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD643_FAST_EXACT_INPUT'
          & .\scripts\ci\packaged-os-input-gate.ps1 -Exe $inner -EvidenceDir $evidence -Map '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $log=Join-Path $evidence 'PACKAGED_OS_INPUT.log'
          $summary=Join-Path $evidence 'PACKAGED_OS_INPUT_SUMMARY.txt'
          if(-not (Test-Path $summary)){ throw 'CD643_FAST_INPUT_SUMMARY_MISSING' }
          # Markers are emitted to the Actions stream by the gate itself; semantic
          # 3/4 assertions are hard failures inside packaged-os-input-gate.ps1.
          Write-Host 'CD643_FAST_EXACT_INPUT=PASS'

      - name: Smoke deliver and launch exact package
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD643FastHuman\Windows'
          $inner=Join-Path $source 'PinkCab\Binaries\Win64\PinkCab.exe'
          $short=$env:GITHUB_SHA.Substring(0,8)

          Get-Process -Name PinkCab -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }

          $smokeLog=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD643_FAST_EXACT_SMOKE.log'
          Remove-Item $smokeLog -Force -ErrorAction SilentlyContinue
          $smoke=Start-Process -FilePath $inner -ArgumentList @(
            '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
            '-log','-windowed','-ResX=960','-ResY=540','-PinkCabGateTelemetry',"-abslog=$smokeLog"
          ) -WorkingDirectory (Split-Path $inner) -PassThru
          try {
            $deadline=[DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $smoke.Refresh()
              if($smoke.HasExited){ throw "CD643_FAST_SMOKE_EXITED code=$($smoke.ExitCode)" }
              $ready=(Test-Path $smokeLog) -and (Select-String $smokeLog -Pattern 'PINKCAB_GATE_STATE .*wheels=4' -Quiet)
            } while(-not $ready -and [DateTime]::UtcNow -lt $deadline)
            if(-not $ready){ throw 'CD643_FAST_SMOKE_TELEMETRY_TIMEOUT' }
            if(Select-String $smokeLog -Pattern '(?i)Fatal error:|Assertion failed|Unhandled Exception|Failed to load package|LogStreaming: Error:|LogLinker: Error:' -Quiet){
              throw 'CD643_FAST_SMOKE_CRITICAL'
            }
          } finally {
            if($smoke -and -not $smoke.HasExited){ Stop-Process -Id $smoke.Id -Force -ErrorAction SilentlyContinue }
          }

          $delivery=Join-Path $env:DELIVERY_BASE ("CD643_HGATE_EXACT_{0}_RUN{1}" -f $short,$env:GITHUB_RUN_ID)
          if(Test-Path $delivery){ Remove-Item $delivery -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $delivery | Out-Null
          & robocopy $source (Join-Path $delivery 'Windows') /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          if($LASTEXITCODE -ge 8){ throw "CD643_FAST_COPY_FAILED $LASTEXITCODE" }
          $global:LASTEXITCODE=0
          $delivered=Join-Path $delivery 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          Set-Content (Join-Path $delivery 'SOURCE_SHA.txt') $env:GITHUB_SHA -NoNewline
          Set-Content (Join-Path $delivery 'RUN_ID.txt') $env:GITHUB_RUN_ID -NoNewline

          $desktop=[Environment]::GetFolderPath('Desktop')
          $ws=New-Object -ComObject WScript.Shell
          foreach($name in @('PINKCAB Latest.lnk','PINKCAB R2 HUMAN.lnk')){
            $lnk=Join-Path $desktop $name
            Remove-Item $lnk -Force -ErrorAction SilentlyContinue
            $s=$ws.CreateShortcut($lnk)
            $s.TargetPath=$delivered
            $s.Arguments='/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
            $s.WorkingDirectory=(Split-Path $delivered)
            $s.Description="PINK CAB exact H-gate $env:GITHUB_SHA"
            $s.Save()
          }

          $saved=$env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID=''
          try {
            $proc=Start-Process -FilePath $delivered -ArgumentList @(
              '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight','-windowed','-ResX=1600','-ResY=900'
            ) -WorkingDirectory (Split-Path $delivered) -PassThru
            Start-Sleep -Seconds 5
            $proc.Refresh()
            if($proc.HasExited){ throw "CD643_FAST_HUMAN_EXITED code=$($proc.ExitCode)" }
            Write-Host "CD643_FAST_HUMAN_DELIVERY=$delivery"
            Write-Host "CD643_FAST_HUMAN_PID=$($proc.Id)"
            Write-Host "CD643_FAST_HUMAN_SOURCE_SHA=$env:GITHUB_SHA"
            Write-Host 'CD643_FAST_HUMAN_FOREGROUND=PASS'
          } finally { $env:RUNNER_TRACKING_ID=$saved }
