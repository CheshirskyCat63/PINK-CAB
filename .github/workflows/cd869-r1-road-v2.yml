name: CD-869 R2 Native MetaRoad Rebuild Existing Lane

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cd869-r2-metaroad-native-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: Native MetaRoad R2 build bake verify package human
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 120
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      ACCEPTED_R1_SHA: 7ac89d3fea32791fb683ef83ec0e76bdbb32dc92
      ACCEPTED_INPUT_SHA: 8168d72406af6934ab20eace583c2b895f0620b7
      DELIVERY_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB
      R2_BRANCH: ${{ github.head_ref || github.ref_name }}
      R2_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact R2 source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.R2_SOURCE_SHA }}
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Classify R2 source commit
        id: classify
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $subject=(git log -1 --pretty=%s).Trim()
          $localHead=(git rev-parse HEAD).Trim()
          $remoteHead=(git ls-remote origin "refs/heads/$env:R2_BRANCH" | ForEach-Object { ($_ -split "\s+")[0] }).Trim()
          Write-Host "R2_SOURCE_SUBJECT=$subject"
          Write-Host "R2_LOCAL_HEAD=$localHead"
          Write-Host "R2_REMOTE_HEAD=$remoteHead"
          $skip=$subject.StartsWith('asset(CD-869): bake native MetaRoad R2') -or
                $subject.StartsWith('evidence(CD-869): R2 MetaRoad rebuild') -or
                ($remoteHead -and $localHead -ne $remoteHead)
          if($skip){
            'skip=true' | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host 'R2_AUTOGENERATED_HEAD_SKIP=1'
          } else {
            'skip=false' | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host 'R2_AUTOGENERATED_HEAD_SKIP=0'
          }

      - name: Exact-head preflight and scope guard
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:GITHUB_WORKSPACE
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:R2_SOURCE_SHA){ throw "R2_HEAD_MISMATCH $head != $env:R2_SOURCE_SHA" }

          $tracked=@(git status --porcelain --untracked-files=no)
          if($tracked.Count -ne 0){
            $tracked | ForEach-Object { Write-Host $_ }
            throw 'R2_TRACKED_CHECKOUT_DIRTY'
          }

          $plugin=Get-ChildItem (Join-Path $env:UE_ROOT 'Engine\Plugins\Marketplace') -Recurse -Filter MetaRoad.uplugin -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $plugin){ throw 'R2_METAROAD_PLUGIN_MISSING' }
          $meta=Get-Content -Raw $plugin.FullName | ConvertFrom-Json
          if($meta.VersionName -ne '3.2.0'){ throw "R2_METAROAD_VERSION_UNEXPECTED=$($meta.VersionName)" }
          Write-Host "R2_METAROAD_PLUGIN=$($plugin.FullName)"
          Write-Host "R2_METAROAD_VERSION=$($meta.VersionName)"

          $forbiddenTracked=@(
            git ls-files |
              Where-Object {
                $_ -match 'RoadConstruction' -or
                $_ -match 'PinkCabL1RoadConstruction'
              }
          )
          if($forbiddenTracked.Count -gt 0){
            $forbiddenTracked | ForEach-Object { Write-Host "R2_FORBIDDEN_PRIMITIVE=$_"}
            throw 'R2_PRIMITIVE_CONSTRUCTION_STILL_TRACKED'
          }

          $frozen=@(
            'Source/PinkCab/Private/Runtime/PinkCabChaosTatraPawnDriver.cpp',
            'Source/PinkCab/Private/Runtime/PinkCabChaosTatraPawnCockpit.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabPlayerInputAdapter.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabSemanticInputRouter.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabPhysicalInputConvention.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabWheelInputResponse.cpp',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPlayerInputAdapter.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPlayerInputSample.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabSemanticInputRouter.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPhysicalInputConvention.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabWheelInputResponse.h',
            'Source/PinkCab/Private/Vehicle/PinkCabVehicleInputFrame.cpp',
            'Source/PinkCab/Public/Vehicle/PinkCabVehicleInputFrame.h',
            'Source/PinkCab/Public/Vehicle/Detail/PinkCabVehicleInputFrame.inl',
            'Config/DefaultInput.ini'
          )
          $delta=@()
          foreach($path in $frozen){
            $d=@(git diff --name-only "$env:ACCEPTED_INPUT_SHA..HEAD" -- $path)
            if($d.Count -gt 0){ $delta += $d }
          }
          $delta=@($delta | Sort-Object -Unique)
          if($delta.Count -gt 0){
            $delta | ForEach-Object { Write-Host "R2_FROZEN_INPUT_DELTA=$_"}
            throw 'R2_FROZEN_INPUT_SOURCE_CHANGED'
          }
          Write-Host 'R2_FROZEN_INPUT_SOURCE_IDENTICAL=PASS'

          $r1Critical=@(
            'Source/PinkCabWorld/Private/World/PinkCabL1EndlessRoadModel.cpp',
            'Source/PinkCabWorld/Public/World/PinkCabL1EndlessRoadModel.h',
            'Source/PinkCab/Private/World/PinkCabL1EndlessRoadStreamer.cpp',
            'Source/PinkCab/Public/World/PinkCabL1EndlessRoadStreamer.h'
          )
          foreach($path in $r1Critical){
            $d=@(git diff --name-only "$env:ACCEPTED_R1_SHA..HEAD" -- $path)
            if($d.Count -gt 0){ throw "R2_R1_TOPOLOGY_OR_STREAMING_CHANGED=$path" }
          }
          Write-Host 'R2_R1_TOPOLOGY_STREAMING_FROZEN=PASS'

      - name: Stop prior PinkCab and workspace Unreal processes
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Get-Process -Name PinkCab -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }

          $workspacePattern=[Regex]::Escape($env:GITHUB_WORKSPACE)
          $ue=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('UnrealEditor.exe','UnrealEditor-Cmd.exe') -and
              $_.CommandLine -and
              $_.CommandLine -match $workspacePattern
            })
          foreach($p in $ue){
            Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          }
          if($ue.Count -gt 0){ Start-Sleep -Milliseconds 800 }
          Write-Host 'R2_PROCESS_CLEAN=PASS'

      - name: Build PinkCabEditor
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=6
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R2_EDITOR_BUILD=PASS'

      - name: Re-bake canonical road through native MetaRoad
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $roadDir=Join-Path $env:GITHUB_WORKSPACE 'Content\World\L1\Road'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_METAROAD_AUTHOR.log'
          New-Item -ItemType Directory -Force -Path (Split-Path $log) | Out-Null

          foreach($pattern in @('RoadSurface*.uasset','RoadSidewalks*.uasset','RoadCurbs*.uasset')){
            Get-ChildItem $roadDir -Filter $pattern -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "R2_REMOVE_PREBAKE=$($_.FullName)"
                Remove-Item $_.FullName -Force
              }
          }

          & $editor $project -unattended -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.Editor.GenerateL1EndlessRoadAssets" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:' -Quiet){
            Get-Content $log | Select-Object -Last 200 | ForEach-Object { Write-Host $_ }
            throw 'R2_METAROAD_AUTHORING_FAILED'
          }
          if(-not (Select-String $log -Pattern 'CD869_METAROAD_BAKE=PASS' -Quiet)){
            throw 'R2_METAROAD_BAKE_MARKER_MISSING'
          }

          $expected=@(
            'RoadSurface.uasset',
            'RoadSidewalks.uasset',
            'RoadCurbs.uasset',
            'RoadCurbs1.uasset',
            'RoadCurbs2.uasset',
            'RoadCurbs3.uasset',
            'RoadCurbs4.uasset',
            'RoadCurbs5.uasset',
            'RoadCurbs6.uasset',
            'RoadCurbs7.uasset'
          )
          $actual=@(
            Get-ChildItem $roadDir -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -eq 'RoadSurface.uasset' -or
                $_.Name -eq 'RoadSidewalks.uasset' -or
                $_.Name -match '^RoadCurbs(?:[1-9])?\.uasset$'
              } |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          $expectedSorted=@($expected | Sort-Object)
          if($actual.Count -ne $expectedSorted.Count -or (Compare-Object $expectedSorted $actual)){
            $actual | ForEach-Object { Write-Host "R2_NATIVE_ACTUAL=$_" }
            $expectedSorted | ForEach-Object { Write-Host "R2_NATIVE_EXPECTED=$_" }
            throw "R2_NATIVE_ASSET_SET_MISMATCH actual=$($actual.Count) expected=$($expectedSorted.Count)"
          }

          foreach($name in $actual){
            $asset=Join-Path $roadDir $name
            $bytes=(Get-Item $asset).Length
            Write-Host "R2_METAROAD_OUTPUT=$name bytes=$bytes"
            if($bytes -le 0){ throw "R2_NATIVE_EMPTY_ASSET=$name" }
          }
          Write-Host 'R2_METAROAD_NATIVE_BAKE=PASS'

      - name: Rebind only runtime materials after MetaRoad bake
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_RUNTIME_MATERIALS.log'
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.Editor.GenerateL1EndlessRoadRuntimeMaterials" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:' -Quiet){
            throw 'R2_RUNTIME_MATERIAL_REBIND_FAILED'
          }
          if(-not (Select-String $log -Pattern 'CD869_RUNTIME_MATERIAL_OWNERSHIP=PASS' -Quiet)){
            throw 'R2_RUNTIME_MATERIAL_MARKER_MISSING'
          }
          Write-Host 'R2_RUNTIME_MATERIAL_REBIND=PASS'

      - name: Commit baked native MetaRoad content
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Content/World/L1/Road Content/Dev/Authoring/L_PC_L1_MetaRoadAuthoring.umap
          if(git diff --cached --quiet){
            Write-Host 'R2_METAROAD_CONTENT_DIFF=0'
          } else {
            git commit -m 'asset(CD-869): bake native MetaRoad R2 construction'
            Write-Host "R2_NATIVE_ASSET_COMMIT_LOCAL=$((git rev-parse HEAD).Trim())"
          }

      - name: Native MetaRoad R2 asset contract
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_NATIVE_ASSET.log'
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.World.L1Road.R2" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $queue=@(Select-String $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fails=@(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          Get-Content $log |
            Select-String -Pattern 'CD869_R2_NATIVE_|Test Completed. Result=|LogAutomationController: Error:' |
            Select-Object -Last 120 |
            ForEach-Object { Write-Host $_.Line }
          if($queue.Count -eq 0){ throw 'R2_NATIVE_QUEUE_MISSING' }
          if($fails.Count -gt 0){ throw "R2_NATIVE_ASSET_FAILURES=$($fails.Count)" }
          Write-Host "R2_NATIVE_ASSET_CONTRACT=PASS $($queue[-1].Line)"

      - name: Accepted R1 world regressions
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          foreach($suite in @('PinkCab.World.L1EndlessRoad','PinkCab.World.Materialization')){
            $safe=$suite.Replace('.','_')
            $log=Join-Path $env:GITHUB_WORKSPACE ("Saved\GitHubGate\CD869_R2_$safe.log")
            & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests $suite" "-TestExit=Automation Test Queue Empty"
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
            $queue=@(Select-String $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
            $fails=@(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
            if($queue.Count -eq 0 -or $fails.Count -gt 0){
              throw "R2_REGRESSION_FAILED suite=$suite queue=$($queue.Count) fails=$($fails.Count)"
            }
            Write-Host "R2_REGRESSION_PASS suite=$suite $($queue[-1].Line)"
          }

      - name: Strict zero-debt and primitive-source scan
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $primitive=@(
            git grep -n -E 'PinkCabL1RoadConstruction|AddTaperedStripSegment' -- Source Content 2>$null
          )
          $primitiveFiles=@(
            git ls-files |
              Where-Object {
                $_ -match '(^|/)RoadConstruction\.uasset
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R2_ZERO_DEBT=PASS'

      - name: Fresh Win64 package
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Get-Process -Name PinkCab -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }

          $uat=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $archive=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2MetaRoadHuman'
          if(Test-Path $archive){ Remove-Item $archive -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $archive | Out-Null

          $backup="$project.r2-metaroad-backup"
          Copy-Item $project $backup -Force
          $exit=1
          try {
            $descriptor=Get-Content -Raw $project | ConvertFrom-Json
            $descriptor.Modules=@($descriptor.Modules | Where-Object { $_.Name -ne 'PinkCabTests' })
            $descriptor.Plugins=@($descriptor.Plugins | Where-Object { $_.Name -notin @('MetaRoad','StructUtils') })
            $descriptor | ConvertTo-Json -Depth 32 | Set-Content $project -Encoding UTF8

            & $uat -WaitForUATMutex BuildCookRun "-project=$project" -noP4 -platform=Win64 -clientconfig=Development -build -cook "-map=/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight" -stage -pak -archive "-archivedirectory=$archive" -nodebuginfo -utf8output "-AdditionalBuildArgs=-MaxParallelActions=6"
            $exit=$LASTEXITCODE
          }
          finally {
            Move-Item $backup $project -Force
          }
          if($exit -ne 0){ exit $exit }

          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'R2_NATIVE_INNER_EXE_MISSING' }
          & .\scripts\ci\ensure-dev-signing.ps1 -Path @($inner)
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if((Get-AuthenticodeSignature $inner).Status -ne [System.Management.Automation.SignatureStatus]::Valid){
            throw 'R2_NATIVE_SIGNATURE_INVALID'
          }
          Write-Host 'R2_NATIVE_PACKAGE=PASS'

      - name: Frozen packaged input contract
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2MetaRoadHuman\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_NATIVE_INPUT'
          & .\scripts\ci\packaged-os-input-gate.ps1 -Exe $inner -EvidenceDir $evidence -Map '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R2_NATIVE_PACKAGED_INPUT=PASS'

      - name: Packaged R2 smoke
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2MetaRoadHuman\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_NATIVE_SMOKE.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $proc=Start-Process -FilePath $inner -ArgumentList @(
            '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
            '-log','-windowed','-ResX=1280','-ResY=720',
            '-PinkCabGateTelemetry',"-abslog=$log"
          ) -WorkingDirectory (Split-Path $inner) -PassThru
          try {
            $deadline=[DateTime]::UtcNow.AddSeconds(40)
            do {
              Start-Sleep -Milliseconds 300
              $proc.Refresh()
              if($proc.HasExited){ throw "R2_NATIVE_SMOKE_EXITED code=$($proc.ExitCode)" }
              $loaded=(Test-Path $log) -and [bool](Select-String $log -Pattern 'L_PinkCab_L1_EndlessStraight' -Quiet)
              $wheels=(Test-Path $log) -and [bool](Select-String $log -Pattern 'PINKCAB_GATE_STATE .*wheels=4' -Quiet)
            } while(( -not $loaded -or -not $wheels) -and [DateTime]::UtcNow -lt $deadline)
            if(-not $loaded){ throw 'R2_NATIVE_SMOKE_MAP_MISSING' }
            if(-not $wheels){ throw 'R2_NATIVE_SMOKE_TATRA_MISSING' }
            $critical=@(Select-String $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Failed to load package|LogStreaming: Error:|LogLinker: Error:' -ErrorAction SilentlyContinue)
            if($critical.Count -gt 0){ throw "R2_NATIVE_SMOKE_CRITICAL=$($critical.Count)" }
            Write-Host 'R2_NATIVE_PACKAGED_SMOKE=PASS'
          }
          finally {
            if($proc -and -not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Install shortcuts and launch HUMAN gate
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          $short=$sha.Substring(0,8)
          $source=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2MetaRoadHuman\Windows'
          $delivery=Join-Path $env:DELIVERY_BASE ("CD869_R2_METAROAD_{0}_RUN{1}" -f $short,$env:GITHUB_RUN_ID)
          if(Test-Path $delivery){ Remove-Item $delivery -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $delivery | Out-Null

          & robocopy $source (Join-Path $delivery 'Windows') /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          $rc=$LASTEXITCODE
          if($rc -ge 8){ throw "R2_NATIVE_DELIVERY_COPY_FAILED $rc" }
          $global:LASTEXITCODE=0

          $inner=Join-Path $delivery 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'R2_NATIVE_DELIVERED_EXE_MISSING' }

          Set-Content (Join-Path $delivery 'CANDIDATE_SHA.txt') $sha -NoNewline
          Set-Content (Join-Path $delivery 'RUN_ID.txt') $env:GITHUB_RUN_ID -NoNewline

          $desktop=[Environment]::GetFolderPath('Desktop')
          $ws=New-Object -ComObject WScript.Shell
          foreach($name in @('PINKCAB R2 METAROAD HUMAN.lnk','PINKCAB R2 HUMAN.lnk','PINKCAB Latest.lnk')){
            $lnk=Join-Path $desktop $name
            Remove-Item $lnk -Force -ErrorAction SilentlyContinue
            $s=$ws.CreateShortcut($lnk)
            $s.TargetPath=$inner
            $s.Arguments='/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
            $s.WorkingDirectory=(Split-Path $inner)
            $s.Description="PINK CAB R2 native MetaRoad HUMAN $sha"
            $s.Save()
            Write-Host "R2_NATIVE_SHORTCUT=$lnk"
          }

          $saved=$env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID=''
          try {
            $proc=Start-Process -FilePath $inner -ArgumentList @(
              '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
              '-windowed','-ResX=1600','-ResY=900'
            ) -WorkingDirectory (Split-Path $inner) -PassThru

            $deadline=[DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              $proc.Refresh()
              if($proc.HasExited){ throw "R2_NATIVE_HUMAN_EXITED code=$($proc.ExitCode)" }
            } while($proc.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if($proc.MainWindowHandle -eq 0){ throw 'R2_NATIVE_HUMAN_WINDOW_MISSING' }

            $focused=$false
            for($i=0;$i -lt 12 -and -not $focused;$i++){
              $focused=[bool]$ws.AppActivate($proc.Id)
              Start-Sleep -Milliseconds 180
            }
            if(-not $focused){ throw 'R2_NATIVE_HUMAN_FOREGROUND_FAILED' }

            Write-Host "R2_NATIVE_HUMAN_DELIVERY=$delivery"
            Write-Host "R2_NATIVE_HUMAN_PID=$($proc.Id)"
            Write-Host 'R2_NATIVE_HUMAN_FOREGROUND=PASS'
            Write-Host 'R2_HUMAN_PENDING'
          }
          finally {
            $env:RUNNER_TRACKING_ID=$saved
          }


      - name: Publish R2 rebuild status
        if: ${{ always() && steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
