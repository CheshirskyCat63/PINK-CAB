name: CD-869 R1 Road Topology V2

on:
  push:
    branches:
      - feat/CD-869-l1-endless-road

permissions:
  contents: write

concurrency:
  group: cd869-r1-road-v2
  cancel-in-progress: true

jobs:
  r1:
    name: R1 topology RED-GREEN gate
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 45
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8

    steps:
      - name: Checkout exact R1 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          clean: false

      - name: R1 exact-head preflight
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R1_HEAD_MISMATCH $head != $env:GITHUB_SHA" }
          $tracked=@(git status --porcelain --untracked-files=no)
          if($tracked.Count -ne 0){
            $tracked | ForEach-Object { Write-Host $_ }
            throw 'R1_TRACKED_CHECKOUT_DIRTY'
          }
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          if(-not (Test-Path $editor)){ throw 'R1_UE58_EDITOR_MISSING' }
          $plugin='C:\Program Files\Epic Games\UE_5.8\Engine\Plugins\Marketplace\MetaRoad08e3462d55e7V4\MetaRoad.uplugin'
          if(-not (Test-Path $plugin)){ throw 'R1_METAROAD_320_MISSING' }
          $meta=Get-Content -Raw $plugin | ConvertFrom-Json
          Write-Host "R1_HEAD=$head"
          Write-Host "R1_METAROAD_VERSION=$($meta.VersionName)"
          Write-Host 'R1_PREFLIGHT=PASS'

      - name: Build PinkCabEditor
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R1_EDITOR_BUILD=PASS'

      - name: Run R1 access topology contract
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R1_TOPOLOGY.log'
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.World.L1EndlessRoad.Model.R1AccessTopology" "-TestExit=Automation Test Queue Empty"
          $exit=$LASTEXITCODE
          if(Test-Path $log){
            Get-Content $log |
              Select-String -Pattern 'R1AccessTopology|Automation Test Queue Empty|Test Completed. Result=|LogAutomationController: Error:' |
              Select-Object -Last 100 |
              ForEach-Object { Write-Host $_.Line }
          }
          if($exit -ne 0){ exit $exit }
          $queue=@(Select-String $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fails=@(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          if($queue.Count -eq 0){ throw 'R1_QUEUE_MARKER_MISSING' }
          if($fails.Count -gt 0){ throw "R1_AUTOMATION_FAILURES=$($fails.Count)" }
          Write-Host "R1_TOPOLOGY_CONTRACT=PASS $($queue[-1].Line)"
