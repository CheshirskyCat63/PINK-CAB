          New-Item -ItemType Directory -Force -Path (Split-Path $statusPath) | Out-Null
          @(
            ('run_id=' + $env:GITHUB_RUN_ID)
            ('source_sha=' + $env:R2_SOURCE_SHA)
            ('workspace_head=' + ((git rev-parse HEAD).Trim()))
            ('job_status=' + $env:JOB_STATUS)
            ('timestamp_utc=' + [DateTime]::UtcNow.ToString('o'))
          ) | Set-Content $statusPath -Encoding UTF8

          $logs=@(
            'Saved\GitHubGate\CD869_R2_METAROAD_AUTHOR.log',
            'Saved\GitHubGate\CD869_R2_RUNTIME_MATERIALS.log',
            'Saved\GitHubGate\CD869_R2_NATIVE_ASSET.log',
            'Saved\GitHubGate\CD869_R2_NATIVE_SMOKE.log'
          )
          foreach($rel in $logs){
            $full=Join-Path $env:GITHUB_WORKSPACE $rel
            if(Test-Path $full){
              Add-Content $statusPath ''
              Add-Content $statusPath ('=== ' + $rel + ' tail ===')
              Get-Content $full | Select-Object -Last 120 | Add-Content $statusPath
            }
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $statusPath
          if(-not (git diff --cached --quiet)){
            git commit -m "evidence(CD-869): R2 MetaRoad rebuild $env:JOB_STATUS"
            git push origin "HEAD:refs/heads/$env:R2_BRANCH"
          }
 -or
                $_ -match 'PinkCabL1RoadConstruction'
              }
          )
          if($primitive.Count -gt 0 -or $primitiveFiles.Count -gt 0){
            $primitive | ForEach-Object { Write-Host "R2_PRIMITIVE_REFERENCE=$_" }
            $primitiveFiles | ForEach-Object { Write-Host "R2_PRIMITIVE_FILE=$_" }
            throw 'R2_PRIMITIVE_SOURCE_REFERENCE_REMAINS'
          }
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R2_ZERO_DEBT=PASS'

      - name: Fresh Win64 package
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Get-Process -Name PinkCab -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }

          $uat=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $archive=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2MetaRoadHuman'
          if(Test-Path $archive){ Remove-Item $archive -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $archive | Out-Null

          $backup="$project.r2-metaroad-backup"
          Copy-Item $project $backup -Force
          $exit=1
          try {
            $descriptor=Get-Content -Raw $project | ConvertFrom-Json
            $descriptor.Modules=@($descriptor.Modules | Where-Object { $_.Name -ne 'PinkCabTests' })
            $descriptor.Plugins=@($descriptor.Plugins | Where-Object { $_.Name -notin @('MetaRoad','StructUtils') })
            $descriptor | ConvertTo-Json -Depth 32 | Set-Content $project -Encoding UTF8

            & $uat -WaitForUATMutex BuildCookRun "-project=$project" -noP4 -platform=Win64 -clientconfig=Development -build -cook "-map=/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight" -stage -pak -archive "-archivedirectory=$archive" -nodebuginfo -utf8output "-AdditionalBuildArgs=-MaxParallelActions=6"
            $exit=$LASTEXITCODE
          }
          finally {
            Move-Item $backup $project -Force
          }
          if($exit -ne 0){ exit $exit }

          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'R2_NATIVE_INNER_EXE_MISSING' }
          & .\scripts\ci\ensure-dev-signing.ps1 -Path @($inner)
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if((Get-AuthenticodeSignature $inner).Status -ne [System.Management.Automation.SignatureStatus]::Valid){
            throw 'R2_NATIVE_SIGNATURE_INVALID'
          }
          Write-Host 'R2_NATIVE_PACKAGE=PASS'

      - name: Frozen packaged input contract
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2MetaRoadHuman\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_NATIVE_INPUT'
          & .\scripts\ci\packaged-os-input-gate.ps1 -Exe $inner -EvidenceDir $evidence -Map '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R2_NATIVE_PACKAGED_INPUT=PASS'

      - name: Packaged R2 smoke
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2MetaRoadHuman\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R2_NATIVE_SMOKE.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $proc=Start-Process -FilePath $inner -ArgumentList @(
            '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
            '-log','-windowed','-ResX=1280','-ResY=720',
            '-PinkCabGateTelemetry',"-abslog=$log"
          ) -WorkingDirectory (Split-Path $inner) -PassThru
          try {
            $deadline=[DateTime]::UtcNow.AddSeconds(40)
            do {
              Start-Sleep -Milliseconds 300
              $proc.Refresh()
              if($proc.HasExited){ throw "R2_NATIVE_SMOKE_EXITED code=$($proc.ExitCode)" }
              $loaded=(Test-Path $log) -and [bool](Select-String $log -Pattern 'L_PinkCab_L1_EndlessStraight' -Quiet)
              $wheels=(Test-Path $log) -and [bool](Select-String $log -Pattern 'PINKCAB_GATE_STATE .*wheels=4' -Quiet)
            } while(( -not $loaded -or -not $wheels) -and [DateTime]::UtcNow -lt $deadline)
            if(-not $loaded){ throw 'R2_NATIVE_SMOKE_MAP_MISSING' }
            if(-not $wheels){ throw 'R2_NATIVE_SMOKE_TATRA_MISSING' }
            $critical=@(Select-String $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Failed to load package|LogStreaming: Error:|LogLinker: Error:' -ErrorAction SilentlyContinue)
            if($critical.Count -gt 0){ throw "R2_NATIVE_SMOKE_CRITICAL=$($critical.Count)" }
            Write-Host 'R2_NATIVE_PACKAGED_SMOKE=PASS'
          }
          finally {
            if($proc -and -not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Install shortcuts and launch HUMAN gate
        if: ${{ steps.classify.outputs.skip != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          $short=$sha.Substring(0,8)
          $source=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R2MetaRoadHuman\Windows'
          $delivery=Join-Path $env:DELIVERY_BASE ("CD869_R2_METAROAD_{0}_RUN{1}" -f $short,$env:GITHUB_RUN_ID)
          if(Test-Path $delivery){ Remove-Item $delivery -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $delivery | Out-Null

          & robocopy $source (Join-Path $delivery 'Windows') /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          $rc=$LASTEXITCODE
