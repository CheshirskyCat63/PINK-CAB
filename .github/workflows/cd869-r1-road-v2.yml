name: CD-869 R1 Road Topology V2

on:
  push:
    branches:
      - feat/CD-869-l1-endless-road

permissions:
  contents: write

concurrency:
  group: cd869-r1-road-v2
  cancel-in-progress: true

jobs:
  r1:
    name: R1 topology build, bake, package, human
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 120
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      DELIVERY_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB

    steps:
      - name: Checkout exact R1 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          clean: false

      - name: R1 exact-head preflight
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){ throw "R1_HEAD_MISMATCH $head != $env:GITHUB_SHA" }
          $tracked=@(git status --porcelain --untracked-files=no)
          if($tracked.Count -ne 0){
            $tracked | ForEach-Object { Write-Host $_ }
            throw 'R1_TRACKED_CHECKOUT_DIRTY'
          }
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          if(-not (Test-Path $editor)){ throw 'R1_UE58_EDITOR_MISSING' }
          $plugin='C:\Program Files\Epic Games\UE_5.8\Engine\Plugins\Marketplace\MetaRoad08e3462d55e7V4\MetaRoad.uplugin'
          if(-not (Test-Path $plugin)){ throw 'R1_METAROAD_320_MISSING' }
          $meta=Get-Content -Raw $plugin | ConvertFrom-Json
          Write-Host "R1_HEAD=$head"
          Write-Host "R1_METAROAD_VERSION=$($meta.VersionName)"
          Write-Host 'R1_PREFLIGHT=PASS'

      - name: Classify R1 runtime delta
        id: runtime_delta
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $verified='42d0db806e47142d14e7c1c802b0ba9eb11fef91'
          git cat-file -e "$verified^{commit}"
          if($LASTEXITCODE -ne 0){ throw 'R1_VERIFIED_RUNTIME_HEAD_MISSING' }
          $changed=@(git diff --name-only "$verified..HEAD")
          $compileDelta=@($changed | Where-Object {
            $_ -match '^Source/' -or
            $_ -match '^Config/' -or
            $_ -eq 'PinkCab.uproject'
          })
          if($compileDelta.Count -eq 0){
            'reuse_verified=true' | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "R1_BUILD_REUSED=$verified"
          } else {
            'reuse_verified=false' | Out-File $env:GITHUB_OUTPUT -Append
            $compileDelta | ForEach-Object { Write-Host "R1_COMPILE_DELTA=$_" }
          }

      - name: Close previous PINK-CAB runtime before build
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $pink=@(Get-Process -Name PinkCab -ErrorAction SilentlyContinue)
          foreach($proc in $pink){
            $path=''
            try { $path=$proc.Path } catch {}
            Write-Host "R1_STOP_OLD_PINKCAB_PREBUILD pid=$($proc.Id) path=$path"
            Stop-Process -Id $proc.Id -Force -ErrorAction Stop
          }
          Start-Sleep -Milliseconds 400
          if(@(Get-Process -Name PinkCab -ErrorAction SilentlyContinue).Count -gt 0){
            throw 'R1_OLD_PINKCAB_PROCESS_SURVIVED_PREBUILD'
          }
          Write-Host 'R1_OLD_RUNTIME_PREBUILD_CLOSED=PASS'

      - name: Build PinkCabEditor
        if: ${{ steps.runtime_delta.outputs.reuse_verified != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          & $build PinkCabEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=6
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R1_EDITOR_BUILD=PASS'

      - name: Run R1 access topology contract
        if: ${{ steps.runtime_delta.outputs.reuse_verified != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R1_TOPOLOGY.log'
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.World.L1EndlessRoad.Model.R1AccessTopology" "-TestExit=Automation Test Queue Empty"
          $exit=$LASTEXITCODE
          if($exit -ne 0){ exit $exit }
          $queue=@(Select-String $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fails=@(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          if($queue.Count -eq 0){ throw 'R1_QUEUE_MARKER_MISSING' }
          if($fails.Count -gt 0){ throw "R1_AUTOMATION_FAILURES=$($fails.Count)" }
          Write-Host "R1_TOPOLOGY_CONTRACT=PASS $($queue[-1].Line)"

      - name: Detect R1 baked-asset head
        id: asset_state
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $recent=@(git log -n 10 --pretty=%s)
          $hasR1Asset=[bool]($recent | Where-Object { $_ -eq 'asset(CD-869): canonicalize R1 topology v2' })
          if($hasR1Asset){
            'asset_head=true' | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host 'R1_ASSET_HEAD=1'
          } else {
            'asset_head=false' | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host 'R1_ASSET_HEAD=0'
          }

      - name: Regenerate MetaRoad R1 topology asset
        if: ${{ steps.asset_state.outputs.asset_head != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'

          # MetaRoad chooses a suffixed asset name when stale generated files are
          # present. Remove the tracked canonical mesh plus every stale generated
          # sibling before authoring so the exported runtime asset is exactly
          # /Game/World/L1/Road/RoadSurface.
          $roadDir=Join-Path $env:GITHUB_WORKSPACE 'Content\World\L1\Road'

          # Close only stale Unreal command processes owned by this CI workspace.
          # Never terminate an unrelated interactive user Editor.
          $workspacePattern=[Regex]::Escape($env:GITHUB_WORKSPACE)
          $ueProcesses=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('UnrealEditor-Cmd.exe','UnrealEditor.exe') -and
              $_.CommandLine -and
              $_.CommandLine -match $workspacePattern
            })
          foreach($ue in $ueProcesses){
            Write-Host "R1_STOP_STALE_CI_UNREAL pid=$($ue.ProcessId) name=$($ue.Name)"
            Stop-Process -Id $ue.ProcessId -Force -ErrorAction SilentlyContinue
          }
          if($ueProcesses.Count -gt 0){ Start-Sleep -Milliseconds 800 }

          $stale=@(Get-ChildItem -LiteralPath $roadDir -Filter 'RoadSurface*.uasset' -File -ErrorAction SilentlyContinue)
          foreach($asset in $stale){
            Write-Host "R1_REMOVE_PREBAKE=$($asset.FullName)"
            $deleted=$false
            for($attempt=1; $attempt -le 12 -and -not $deleted; ++$attempt){
              try {
                Remove-Item -LiteralPath $asset.FullName -Force -ErrorAction Stop
                $deleted=$true
              }
              catch {
                Write-Host "R1_REMOVE_RETRY attempt=$attempt file=$($asset.Name) reason=$($_.Exception.Message)"
                Start-Sleep -Milliseconds 500
              }
            }
            if(-not $deleted){ throw "R1_PREBAKE_DELETE_LOCKED=$($asset.FullName)" }
          }
          $remaining=@(Get-ChildItem -LiteralPath $roadDir -Filter 'RoadSurface*.uasset' -File -ErrorAction SilentlyContinue)
          if($remaining.Count -ne 0){ throw "R1_PREBAKE_ROADSURFACE_CLEAN_FAILED=$($remaining.Count)" }

          $authorLog=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R1_AUTHOR.log'
          & $editor $project -unattended -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$authorLog" "-ExecCmds=Automation RunTests PinkCab.Editor.GenerateL1EndlessRoadAssets" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if(Select-String $authorLog -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:' -Quiet){
            throw 'R1_METAROAD_AUTHORING_FAILED'
          }
          if(-not (Select-String $authorLog -Pattern 'CD869_METAROAD_BAKE=PASS' -Quiet)){
            throw 'R1_METAROAD_BAKE_MARKER_MISSING'
          }

          $roadOutputs=@(Get-ChildItem -LiteralPath $roadDir -Filter 'RoadSurface*.uasset' -File -ErrorAction SilentlyContinue)
          $canonical=Join-Path $roadDir 'RoadSurface.uasset'
          if(-not (Test-Path $canonical)){ throw 'R1_CANONICAL_ROADSURFACE_NOT_GENERATED' }
          $suffixed=@($roadOutputs | Where-Object { $_.Name -ne 'RoadSurface.uasset' })
          if($suffixed.Count -gt 0){
            $suffixed | ForEach-Object { Write-Host "R1_FORBIDDEN_ROADSURFACE=$($_.FullName)" }
            throw "R1_SUFFIXED_ROADSURFACE_OUTPUTS=$($suffixed.Count)"
          }
          Write-Host 'R1_CANONICAL_ROADSURFACE_OUTPUT=PASS'

          $materialLog=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R1_REBIND_MATERIALS.log'
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$materialLog" "-ExecCmds=Automation RunTests PinkCab.Editor.GenerateL1EndlessRoadRuntimeMaterials" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if(Select-String $materialLog -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:' -Quiet){
            throw 'R1_RUNTIME_MATERIAL_REBIND_FAILED'
          }
          if(-not (Select-String $materialLog -Pattern 'CD869_RUNTIME_MATERIAL_OWNERSHIP=PASS' -Quiet)){
            throw 'R1_RUNTIME_MATERIAL_MARKER_MISSING'
          }

          if(-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'Content\World\L1\Road\RoadSurface.uasset'))){
            throw 'R1_ROAD_SURFACE_MISSING'
          }
          Write-Host 'R1_METAROAD_REBAKE=PASS'

      - name: Commit R1 baked topology asset
        id: asset_commit
        if: ${{ steps.asset_state.outputs.asset_head != 'true' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Content/World/L1/Road Content/Dev/Authoring/L_PC_L1_MetaRoadAuthoring.umap
          if(git diff --cached --quiet){
            'committed=false' | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host 'R1_ASSET_DIFF=0'
          } else {
            git commit -m 'asset(CD-869): canonicalize R1 topology v2'
            git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
            'committed=true' | Out-File $env:GITHUB_OUTPUT -Append
            Write-Host "R1_ASSET_COMMIT=$((git rev-parse HEAD).Trim())"
          }

      - name: Verify exact R1 asset head after optional push
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $local=(git rev-parse HEAD).Trim()
          $remote=(git ls-remote origin "refs/heads/$env:GITHUB_REF_NAME" | ForEach-Object { ($_ -split "\s+")[0] }).Trim()
          if($local -ne $remote){ throw "R1_REMOTE_HEAD_MISMATCH $local != $remote" }
          Write-Host "R1_EXACT_ASSET_HEAD=$local"

      - name: Run full endless-road focused regression
        if: ${{ success() }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R1_FOCUSED.log'
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.World.L1EndlessRoad" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $queue=@(Select-String $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fails=@(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          if($queue.Count -eq 0){ throw 'R1_FOCUSED_QUEUE_MISSING' }
          if($fails.Count -gt 0){ throw "R1_FOCUSED_FAILURES=$($fails.Count)" }
          Write-Host "R1_FOCUSED=PASS $($queue[-1].Line)"

      - name: Run materialization regression
        if: ${{ success() }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R1_MATERIALIZATION.log'
          & $editor $project -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.World.Materialization" "-TestExit=Automation Test Queue Empty"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $queue=@(Select-String $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fails=@(Select-String $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          if($queue.Count -eq 0 -or $fails.Count -gt 0){ throw "R1_MATERIALIZATION_FAILED queue=$($queue.Count) fails=$($fails.Count)" }
          Write-Host "R1_MATERIALIZATION=PASS $($queue[-1].Line)"

      - name: R1 scope guard and zero-debt
        if: ${{ success() }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $base='ada243509a2d0d5f0c45efd88677df2c7ef94e98'
          $acceptedInput='8168d72406af6934ab20eace583c2b895f0620b7'
          $changed=@(git diff --name-only "$base..HEAD")
          $frozenInputPaths=@(
            'Source/PinkCab/Private/Runtime/PinkCabChaosTatraPawnDriver.cpp',
            'Source/PinkCab/Private/Runtime/PinkCabChaosTatraPawnCockpit.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabPlayerInputAdapter.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabSemanticInputRouter.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabPhysicalInputConvention.cpp',
            'Source/PinkCabInteraction/Private/Interaction/PinkCabWheelInputResponse.cpp',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPlayerInputAdapter.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPlayerInputSample.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabSemanticInputRouter.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabPhysicalInputConvention.h',
            'Source/PinkCabInteraction/Public/Interaction/PinkCabWheelInputResponse.h',
            'Source/PinkCab/Public/Vehicle/PinkCabVehicleControlRuntime.h',
            'Source/PinkCab/Private/Vehicle/PinkCabVehicleInputFrame.cpp',
            'Source/PinkCab/Public/Vehicle/PinkCabVehicleInputFrame.h',
            'Source/PinkCab/Public/Vehicle/Detail/PinkCabVehicleInputFrame.inl',
            'Config/DefaultInput.ini'
          )
          $acceptedSourceDelta=@()
          foreach($frozenPath in $frozenInputPaths){
            $delta=@(git diff --name-only "$acceptedInput..HEAD" -- $frozenPath)
            if($delta.Count -gt 0){ $acceptedSourceDelta += $delta }
          }
          $acceptedSourceDelta=@($acceptedSourceDelta | Sort-Object -Unique)
          if($acceptedSourceDelta.Count -gt 0){
            $acceptedSourceDelta | ForEach-Object { Write-Host "R1_FROZEN_INPUT_DELTA=$_" }
            throw 'R1_FROZEN_INPUT_SOURCE_CHANGED'
          }
          Write-Host 'R1_FROZEN_INPUT_SOURCE_IDENTICAL=PASS'
          $forbidden=@($changed | Where-Object {
            $_ -match '^Source/PinkCabVehicle/' -or
            $_ -match '^Source/PinkCab/Private/Vehicle/' -or
            $_ -match '^Source/PinkCab/Public/Vehicle/' -or
            $_ -match '^Content/World/L1/Road/Materials/'
          })
          if($forbidden.Count -gt 0){
            $forbidden | ForEach-Object { Write-Host "R1_FORBIDDEN_CHANGE=$_" }
            throw 'R1_SCOPE_GUARD_FAILED'
          }
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R1_SCOPE_AND_ZERO_DEBT=PASS'

      - name: Audit previous R1 HUMAN package input before recook
        if: ${{ success() }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $previous='E:\CHESHIRE_DIVISION\Builds\PINKCAB\CD869_R1_TOPOLOGY_ba6c5e32_RUN35964521090\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $previous)){
            Write-Host 'R1_PREVIOUS_PACKAGE_AUDIT=SKIP_MISSING'
            exit 0
          }
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R1_PREVIOUS_INPUT_AUDIT'
          & .\scripts\ci\packaged-os-input-gate.ps1 -Exe $previous -EvidenceDir $evidence -Map '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'R1_PREVIOUS_PACKAGE_INPUT=PASS'

      - name: Close previous PINK-CAB and CI Unreal processes before cook
        if: ${{ always() && !cancelled() }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'

          $pink=@(Get-Process -Name PinkCab -ErrorAction SilentlyContinue)
          foreach($proc in $pink){
            $path=''
            try { $path=$proc.Path } catch {}
            Write-Host "R1_STOP_OLD_PINKCAB pid=$($proc.Id) path=$path"
            Stop-Process -Id $proc.Id -Force -ErrorAction Stop
          }

          $workspacePattern=[Regex]::Escape($env:GITHUB_WORKSPACE)
          $ue=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('UnrealEditor.exe','UnrealEditor-Cmd.exe') -and
              $_.CommandLine -and
              $_.CommandLine -match $workspacePattern
            })
          foreach($proc in $ue){
            Write-Host "R1_STOP_CI_UNREAL_PRECOOK pid=$($proc.ProcessId) name=$($proc.Name)"
            Stop-Process -Id $proc.ProcessId -Force -ErrorAction SilentlyContinue
          }

          Start-Sleep -Milliseconds 1000
          if(@(Get-Process -Name PinkCab -ErrorAction SilentlyContinue).Count -gt 0){
            throw 'R1_OLD_PINKCAB_PROCESS_SURVIVED'
          }
          $ueLeft=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('UnrealEditor.exe','UnrealEditor-Cmd.exe') -and
              $_.CommandLine -and
              $_.CommandLine -match $workspacePattern
            })
          if($ueLeft.Count -gt 0){
            $ueLeft | ForEach-Object { Write-Host "R1_CI_UNREAL_SURVIVED pid=$($_.ProcessId) cmd=$($_.CommandLine)" }
            throw "R1_CI_UNREAL_PROCESS_SURVIVED=$($ueLeft.Count)"
          }
          Write-Host 'R1_PRECOOK_PROCESS_CLEAN=PASS'

      - name: Build cook package R1 human candidate
        if: ${{ success() }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $uat=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          $project=Join-Path $env:GITHUB_WORKSPACE 'PinkCab.uproject'
          $archive=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R1Human'
          if(Test-Path $archive){ Remove-Item $archive -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $archive | Out-Null

          $backup="$project.r1-backup"
          Copy-Item $project $backup -Force
          $uatExit=1
          try {
            $descriptor=Get-Content -Raw $project | ConvertFrom-Json
            $descriptor.Modules=@($descriptor.Modules | Where-Object { $_.Name -ne 'PinkCabTests' })
            $descriptor.Plugins=@($descriptor.Plugins | Where-Object { $_.Name -notin @('MetaRoad','StructUtils') })
            $descriptor | ConvertTo-Json -Depth 32 | Set-Content $project -Encoding UTF8

            & $uat -WaitForUATMutex BuildCookRun "-project=$project" -noP4 -platform=Win64 -clientconfig=Development -build -cook "-map=/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight" -stage -pak -archive "-archivedirectory=$archive" -nodebuginfo -utf8output "-AdditionalBuildArgs=-MaxParallelActions=6"
            $uatExit=$LASTEXITCODE
          }
          finally {
            Move-Item $backup $project -Force
          }
          if($uatExit -ne 0){ exit $uatExit }

          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'R1_INNER_EXE_MISSING' }
          & .\scripts\ci\ensure-dev-signing.ps1 -Path @($inner)
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          if((Get-AuthenticodeSignature $inner).Status -ne [System.Management.Automation.SignatureStatus]::Valid){
            throw 'R1_INNER_SIGNATURE_INVALID'
          }
          Write-Host 'R1_CONTENT_AWARE_PACKAGE=PASS'

      - name: Frozen input contract on packaged R1 map
        if: ${{ success() }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R1Human\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R1_INPUT'
          & .\scripts\ci\packaged-os-input-gate.ps1 -Exe $inner -EvidenceDir $evidence -Map '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $summary=Join-Path $evidence 'PACKAGED_OS_INPUT_SUMMARY.txt'
          if(-not (Test-Path $summary)){ throw 'R1_FROZEN_INPUT_SUMMARY_MISSING' }
          Get-Content $summary | ForEach-Object { Write-Host $_ }
          Write-Host 'R1_FROZEN_INPUT_CONTRACT=PASS'

      - name: Packaged R1 smoke
        if: ${{ success() }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R1Human\Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          $log=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R1_PACKAGED.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $proc=Start-Process -FilePath $inner -ArgumentList @(
            '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
            '-log','-windowed','-ResX=1280','-ResY=720',
            '-PinkCabGateTelemetry',"-abslog=$log"
          ) -WorkingDirectory (Split-Path $inner) -PassThru
          try {
            $deadline=[DateTime]::UtcNow.AddSeconds(40)
            do {
              Start-Sleep -Milliseconds 300
              $proc.Refresh()
              if($proc.HasExited){ throw "R1_PACKAGED_EXITED_EARLY code=$($proc.ExitCode)" }
              $loaded=(Test-Path $log) -and [bool](Select-String $log -Pattern 'L_PinkCab_L1_EndlessStraight' -Quiet)
              $wheels=(Test-Path $log) -and [bool](Select-String $log -Pattern 'PINKCAB_GATE_STATE .*wheels=4' -Quiet)
            } while(( -not $loaded -or -not $wheels) -and [DateTime]::UtcNow -lt $deadline)
            if(-not $loaded){ throw 'R1_PACKAGED_MAP_MARKER_MISSING' }
            if(-not $wheels){ throw 'R1_PACKAGED_TATRA_MARKER_MISSING' }
            $critical=@(Select-String $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Failed to load package|LogStreaming: Error:|LogLinker: Error:' -ErrorAction SilentlyContinue)
            if($critical.Count -gt 0){ throw "R1_PACKAGED_CRITICAL=$($critical.Count)" }
            Write-Host 'R1_PACKAGED_SMOKE=PASS'
          }
          finally {
            if($proc -and -not $proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Install and launch R1 HUMAN gate
        if: ${{ success() }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $sha=(git rev-parse HEAD).Trim()
          $short=$sha.Substring(0,8)
          $source=Join-Path $env:GITHUB_WORKSPACE 'Artifacts\CD869R1Human\Windows'
          $delivery=Join-Path $env:DELIVERY_BASE ("CD869_R1_TOPOLOGY_{0}_RUN{1}" -f $short,$env:GITHUB_RUN_ID)
          if(Test-Path $delivery){ Remove-Item $delivery -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $delivery | Out-Null
          & robocopy $source (Join-Path $delivery 'Windows') /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          $rc=$LASTEXITCODE
          if($rc -ge 8){ throw "R1_DELIVERY_COPY_FAILED $rc" }
          $global:LASTEXITCODE=0

          $inner=Join-Path $delivery 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not (Test-Path $inner)){ throw 'R1_DELIVERED_EXE_MISSING' }
          $desktop=[Environment]::GetFolderPath('Desktop')
          $ws=New-Object -ComObject WScript.Shell
          foreach($name in @('PINKCAB R1 HUMAN.lnk','PINKCAB Latest.lnk')){
            $lnk=Join-Path $desktop $name
            Remove-Item $lnk -Force -ErrorAction SilentlyContinue
            $s=$ws.CreateShortcut($lnk)
            $s.TargetPath=$inner
            $s.Arguments='/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
            $s.WorkingDirectory=(Split-Path $inner)
            $s.Description="PINK CAB R1 topology HUMAN $sha"
            $s.Save()
            Write-Host "R1_SHORTCUT=$lnk"
          }
          Set-Content (Join-Path $delivery 'CANDIDATE_SHA.txt') $sha -NoNewline
          Set-Content (Join-Path $delivery 'RUN_ID.txt') $env:GITHUB_RUN_ID -NoNewline
          Write-Host "R1_HUMAN_DELIVERY=$delivery"

          $saved=$env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID=''
          try {
            $proc=Start-Process -FilePath $inner -ArgumentList @(
              '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
              '-windowed','-ResX=1600','-ResY=900'
            ) -WorkingDirectory (Split-Path $inner) -PassThru

            $windowDeadline=[DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              $proc.Refresh()
              if($proc.HasExited){ throw "R1_HUMAN_EXITED_EARLY code=$($proc.ExitCode)" }
            } while($proc.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $windowDeadline)
            if($proc.MainWindowHandle -eq 0){ throw 'R1_HUMAN_WINDOW_NOT_READY' }

            $focused=$false
            for($attempt=1; $attempt -le 12 -and -not $focused; ++$attempt){
              $focused=[bool]$ws.AppActivate($proc.Id)
              Start-Sleep -Milliseconds 180
            }
            if(-not $focused){ throw 'R1_HUMAN_FOREGROUND_FOCUS_FAILED' }

            Write-Host "R1_HUMAN_LAUNCHED_PID=$($proc.Id)"
            Write-Host "R1_HUMAN_WINDOW=$($proc.MainWindowHandle)"
            Write-Host 'R1_HUMAN_FOREGROUND=PASS'
            Write-Host 'R1_HUMAN_PENDING'
          }
          finally {
            $env:RUNNER_TRACKING_ID=$saved
          }
