name: PINK-CAB ADMIN · dispatch fast verification once

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: read

jobs:
  dispatch:
    if: ${{ github.event.issue.pull_request && github.event.issue.number == 7 && github.event.comment.body == '/admin-run-fast' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical fast lane
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pinkcab-g1-github-control-plane.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref fix/CD-848-recovery-r1-input-contract \
            -f lane=fast

      - name: Remove this one-shot dispatcher
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Self-delete dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pinkcab-admin-dispatch-fast-once.yml
          git commit -m "admin: remove completed fast dispatcher"
          git push origin HEAD:main
