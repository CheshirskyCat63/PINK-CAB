name: PINK-CAB one-shot stale branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'admin: run one-shot stale branch cleanup from main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete superseded remote branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "chore/CD-856-authority-sync"
            "ci/cleanup-ownerfix-34a1937"
            "ci/launch-ownerfix-34a1937"
            "ci/pinkcab-desktop-latest-only"
            "ci/pinkcab-g1-tbase"
            "ci/pinkcab-g1-tmove"
            "docs/CD-784-fgear-evaluation-plan"
            "docs/CD-848-control-mechanics-20260918"
            "docs/g1-recovery-2026-09-20"
            "feat/CD-848-control-runtime"
            "feat/CD-848-pre-model-vehicle-freeze"
            "feat/CD-855-tatra-playable-foundation"
            "fix/CD-848-hinp-contract"
            "fix/CD-848-human-gate-regressions"
            "fix/CD-848-owner-rejection-runtime"
            "integration/CD848-CD855"
          )
          for b in "${branches[@]}"; do
            echo "Deleting superseded branch: $b"
            git push origin --delete "$b"
          done

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pinkcab-admin-branch-cleanup-once.yml
          git commit -m "admin: remove one-shot stale branch cleanup workflow"
          git push origin HEAD:main
