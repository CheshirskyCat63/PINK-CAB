name: CD-869 R3 Packaged Retry + HUMAN Launch

on:
  push:
    branches:
      - feat/CD-869-r3-metaroad-markings
    paths:
      - .github/workflows/cd869-r3-packaged-retry.yml

permissions:
  contents: read

concurrency:
  group: cd869-r3-packaged-retry
  cancel-in-progress: true

jobs:
  retry-launch:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: a392ba945f56137b9c6fe8707db8207f15b60ad4
      DELIVERY_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB
      ARCHIVE: Artifacts\CD869R3Human
    steps:
      - name: Checkout exact packaged candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: true
          clean: false

      - name: Verify exact existing fresh package
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:CANDIDATE_SHA){ throw "R3_RETRY_HEAD_MISMATCH $head" }
          $archive=Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          $sourceSha=Join-Path $archive 'SOURCE_SHA.txt'
          $inner=Join-Path $archive 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not(Test-Path $sourceSha)){ throw 'R3_RETRY_SOURCE_SHA_MISSING' }
          if((Get-Content -Raw $sourceSha).Trim() -ne $env:CANDIDATE_SHA){ throw "R3_RETRY_PACKAGE_SHA_MISMATCH=$((Get-Content -Raw $sourceSha).Trim())" }
          if(-not(Test-Path $inner)){ throw 'R3_RETRY_EXE_MISSING' }
          $sig=Get-AuthenticodeSignature $inner
          if($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid){ throw "R3_RETRY_SIGNATURE=$($sig.Status)" }
          Write-Host "R3_RETRY_EXACT_PACKAGE=$inner"
          Write-Host 'R3_RETRY_EXACT_PACKAGE=PASS'

      - name: Packaged OS-input proof with one clean retry for synthetic focus loss
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $inner=Join-Path $env:GITHUB_WORKSPACE "$env:ARCHIVE\Windows\PinkCab\Binaries\Win64\PinkCab.exe"
          $passed=$false
          $errors=@()
          for($attempt=1;$attempt -le 2 -and -not $passed;$attempt++){
            Get-Process -Name PinkCab -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Milliseconds 500
            $evidence=Join-Path $env:GITHUB_WORKSPACE ("Saved\GitHubGate\CD869_R3_PACKAGED_INPUT_RETRY_{0}" -f $attempt)
            try {
              Write-Host "R3_PACKAGED_INPUT_ATTEMPT=$attempt"
              & .\scripts\ci\packaged-os-input-gate.ps1 -Exe $inner -EvidenceDir $evidence -Map '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
              if($LASTEXITCODE -ne 0){ throw "packaged-os-input exit=$LASTEXITCODE" }
              if(-not(Test-Path (Join-Path $evidence 'PACKAGED_OS_INPUT_SUMMARY.txt'))){ throw 'summary missing' }
              $passed=$true
              Write-Host "R3_PACKAGED_INPUT_ATTEMPT_PASS=$attempt"
            }
            catch {
              $errors += $_.Exception.Message
              Write-Host "R3_PACKAGED_INPUT_ATTEMPT_FAIL=$attempt $($_.Exception.Message)"
              $global:LASTEXITCODE=0
            }
          }
          if(-not $passed){
            $errors | ForEach-Object { Write-Host "R3_PACKAGED_INPUT_ERROR=$_" }
            throw 'R3_PACKAGED_INPUT_RETRY_EXHAUSTED'
          }
          Write-Host 'PACKAGED_OS_INPUT_PASS'
          Write-Host 'CD869_R3_PACKAGED_INPUT=PASS'

      - name: Smoke install shortcuts and launch HUMAN
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE "$env:ARCHIVE\Windows"
          $inner=Join-Path $source 'PinkCab\Binaries\Win64\PinkCab.exe'
          Get-Process -Name PinkCab -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }

          $smokeLog=Join-Path $env:GITHUB_WORKSPACE 'Saved\GitHubGate\CD869_R3_RETRY_SMOKE.log'
          Remove-Item $smokeLog -Force -ErrorAction SilentlyContinue
          $smoke=Start-Process -FilePath $inner -ArgumentList @(
            '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
            '-log','-windowed','-ResX=960','-ResY=540',
            '-PinkCabGateTelemetry',
            "-abslog=$smokeLog"
          ) -WorkingDirectory (Split-Path $inner) -PassThru
          try {
            $deadline=[DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 250
              $smoke.Refresh()
              if($smoke.HasExited){ throw "R3_SMOKE_EXITED code=$($smoke.ExitCode)" }
              $mapReady=(Test-Path $smokeLog) -and (Select-String $smokeLog -Pattern 'L_PinkCab_L1_EndlessStraight' -Quiet)
              $carReady=(Test-Path $smokeLog) -and (Select-String $smokeLog -Pattern 'PINKCAB_GATE_STATE .*wheels=4' -Quiet)
            } while((-not $mapReady -or -not $carReady) -and [DateTime]::UtcNow -lt $deadline)
            if(-not $mapReady){ throw 'R3_SMOKE_MAP_TIMEOUT' }
            if(-not $carReady){ throw 'R3_SMOKE_WHEELS_TIMEOUT' }
            if(Select-String $smokeLog -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Failed to load package|LogStreaming: Error:|LogLinker: Error:' -Quiet){ throw 'R3_SMOKE_CRITICAL' }
            Write-Host 'CD869_R3_PACKAGED_SMOKE=PASS'
          }
          finally {
            if($smoke -and -not $smoke.HasExited){ Stop-Process -Id $smoke.Id -Force -ErrorAction SilentlyContinue }
          }

          $short=$env:CANDIDATE_SHA.Substring(0,8)
          $delivery=Join-Path $env:DELIVERY_BASE ("CD869_R3_METAROAD_{0}_RUN{1}" -f $short,$env:GITHUB_RUN_ID)
          if(Test-Path $delivery){ Remove-Item $delivery -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $delivery | Out-Null
          & robocopy $source (Join-Path $delivery 'Windows') /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          if($LASTEXITCODE -ge 8){ throw "R3_COPY_FAILED=$LASTEXITCODE" }
          $global:LASTEXITCODE=0

          $delivered=Join-Path $delivery 'Windows\PinkCab\Binaries\Win64\PinkCab.exe'
          if(-not(Test-Path $delivered)){ throw 'R3_DELIVERED_EXE_MISSING' }
          Set-Content (Join-Path $delivery 'SOURCE_SHA.txt') $env:CANDIDATE_SHA -NoNewline
          Set-Content (Join-Path $delivery 'RUN_ID.txt') $env:GITHUB_RUN_ID -NoNewline

          $desktop=[Environment]::GetFolderPath('Desktop')
          $ws=New-Object -ComObject WScript.Shell
          foreach($name in @('PINKCAB R3 HUMAN.lnk','PINKCAB Latest.lnk')){
            $lnk=Join-Path $desktop $name
            Remove-Item $lnk -Force -ErrorAction SilentlyContinue
            $s=$ws.CreateShortcut($lnk)
            $s.TargetPath=$delivered
            $s.Arguments='/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight'
            $s.WorkingDirectory=(Split-Path $delivered)
            $s.Description="PINK CAB R3 native MetaRoad $env:CANDIDATE_SHA"
            $s.Save()
            Write-Host "CD869_R3_SHORTCUT=$lnk"
          }

          $saved=$env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID=''
          try {
            $proc=Start-Process -FilePath $delivered -ArgumentList @(
              '/Game/Dev/Maps/L_PinkCab_L1_EndlessStraight',
              '-windowed','-ResX=1600','-ResY=900'
            ) -WorkingDirectory (Split-Path $delivered) -PassThru
            Start-Sleep -Seconds 5
            $proc.Refresh()
            if($proc.HasExited){ throw "R3_HUMAN_EXITED code=$($proc.ExitCode)" }
            Write-Host "CD869_R3_HUMAN_DELIVERY=$delivery"
            Write-Host "CD869_R3_HUMAN_PID=$($proc.Id)"
            Write-Host "CD869_R3_HUMAN_SOURCE_SHA=$env:CANDIDATE_SHA"
            Write-Host 'CD869_R3_HUMAN_FOREGROUND=PASS'
            Write-Host 'R3_HUMAN_PENDING'
          }
          finally {
            $env:RUNNER_TRACKING_ID=$saved
          }
