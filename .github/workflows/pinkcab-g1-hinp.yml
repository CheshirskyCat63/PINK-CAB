name: PINK CAB G1 H-INP

on:
  push:
    branches:
      - fix/CD-848-owner-rejection-runtime
  workflow_dispatch:

concurrency:
  group: pinkcab-g1-hinp
  cancel-in-progress: true

jobs:
  hinp:
    name: H-INP final technical gate
    runs-on: [self-hosted, Windows, X64, pinkcab, ue58, cheshire, gui]
    timeout-minutes: 180
    env:
      PINKCAB_UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      GATE_ROOT_BASE: E:\CHESHIRE_DIVISION\Builds\PINKCAB

    steps:
      - name: Checkout exact H-INP candidate
        uses: actions/checkout@v4
        with:
          ref: fix/CD-848-owner-rejection-runtime
          fetch-depth: 0
          lfs: true
          clean: true

      - name: Preflight exact candidate / clean / LFS
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          git lfs pull
          $head = (git rev-parse HEAD).Trim()
          $status = @(git status --porcelain)
          if ($status.Count -gt 0) {
            $status | ForEach-Object { Write-Host $_ }
            throw "H-INP candidate checkout is dirty before verification."
          }
          $pointers = @(Get-ChildItem -Recurse -File Content -ErrorAction SilentlyContinue |
            Select-String -Pattern '^version https://git-lfs.github.com/spec/v1$' -SimpleMatch -ErrorAction SilentlyContinue)
          if ($pointers.Count -gt 0) { throw "Unresolved Git LFS pointers remain." }
          New-Item -ItemType Directory -Force -Path "Saved\G1HInp" | Out-Null
          Set-Content "Saved\G1HInp\CANDIDATE_SHA.txt" $head -NoNewline
          Write-Host "H-INP candidate: $head"

      - name: Strict code-health
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build PinkCabEditor
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: H-INP 7/7 focused task matrix
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $editor = Join-Path $env:PINKCAB_UE_ROOT "Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "PinkCab.uproject"
          $evidence = Join-Path $env:GITHUB_WORKSPACE "Saved\G1HInp"

          $matrix = @(
            @{ Task='INP-01'; Filter='PinkCab.Vehicle.Input'; Reason='physical Q/W/E input frame and clutch capability' },
            @{ Task='INP-02'; Filter='PinkCab.Vehicle.ControlRuntime.Runtime'; Reason='single steering/wheel arbiter, launch dose, priority and transient runtime ownership' },
            @{ Task='INP-03'; Filter='PinkCab.Cockpit.Input.Compliance'; Reason='typed grip/momentary/wheel/quick-recall contract including RMB-only gearbox grip' },
            @{ Task='INP-04'; Filter='PinkCab.Vehicle.PlayerInput'; Reason='real PlayerController Q staging, RMB physical control and wheel dosing' },
            @{ Task='INP-05'; Filter='PinkCab.UI.SystemMenu'; Reason='focus/capture/menu cleanup and no stuck transient input' },
            @{ Task='INP-06'; Filter='PinkCab.G1.HInp'; Reason='canonical signs, all H-gate slots, neutral cross-gate and clutch wheel direction' },
            @{ Task='INP-07'; Filter='PinkCab.UI.SystemMenu.CanonicalControlHints'; Reason='player-visible canonical control hints and parameters' }
          )

          $summary = New-Object System.Collections.Generic.List[string]
          foreach ($row in $matrix) {
            $safe = ($row.Task + "_" + $row.Filter).Replace(".", "_").Replace("/", "_")
            $log = Join-Path $evidence ($safe + ".log")
            Remove-Item $log -Force -ErrorAction SilentlyContinue

            & $editor $project -Multiprocess -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests $($row.Filter)" "-TestExit=Automation Test Queue Empty"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $queue = @(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
            $fail = @(Select-String -Path $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
            $critical = @(Select-String -Path $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception')
            if ($queue.Count -eq 0 -or $fail.Count -gt 0 -or $critical.Count -gt 0) {
              throw "$($row.Task) failed: filter=$($row.Filter) queue=$($queue.Count) fail=$($fail.Count) critical=$($critical.Count)"
            }

            $line = "$($row.Task)=PASS | $($row.Filter) | $($queue[-1].Line) | $($row.Reason)"
            $summary.Add($line)
            Write-Host $line
          }

          if ($summary.Count -ne 7) { throw "H-INP denominator mismatch: $($summary.Count)/7" }
          $summary | Set-Content (Join-Path $evidence "HINP_TASK_MATRIX.txt")
          Write-Host "H-INP AUTO_VERIFIED 7/7"

      - name: Full PinkCab automation regression
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $editor = Join-Path $env:PINKCAB_UE_ROOT "Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "PinkCab.uproject"
          $log = Join-Path $env:GITHUB_WORKSPACE "Saved\G1HInp\FULL_PINKCAB_AUTOMATION.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          & $editor $project -Multiprocess -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab" "-TestExit=Automation Test Queue Empty"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $queue = @(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fail = @(Select-String -Path $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          $critical = @(Select-String -Path $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception')
          if ($queue.Count -eq 0) { throw "Full PinkCab queue completion marker missing." }
          if ($fail.Count -gt 0) { throw "Full PinkCab failures detected: $($fail.Count)" }
          if ($critical.Count -gt 0) { throw "Full PinkCab critical runtime signals: $($critical.Count)" }
          $queue[-1].Line | Set-Content "Saved\G1HInp\FULL_AUTOMATION_SUMMARY.txt"
          Write-Host "Full PinkCab PASS: $($queue[-1].Line)"

      - name: Canonical Win64 package
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\build.ps1 -Package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $outer = Join-Path $env:GITHUB_WORKSPACE "Artifacts\Package\Windows\PinkCab.exe"
          $inner = Join-Path $env:GITHUB_WORKSPACE "Artifacts\Package\Windows\PinkCab\Binaries\Win64\PinkCab.exe"
          if (-not (Test-Path $outer)) { throw "Outer packaged exe missing: $outer" }
          if (-not (Test-Path $inner)) { throw "Inner packaged exe missing: $inner" }
          Write-Host "H-INP package PASS"

      - name: Packaged smoke + critical scan
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $inner = Join-Path $env:GITHUB_WORKSPACE "Artifacts\Package\Windows\PinkCab\Binaries\Win64\PinkCab.exe"
          $log = Join-Path $env:GITHUB_WORKSPACE "Saved\G1HInp\PACKAGED_SMOKE.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath $inner -ArgumentList @(
            "-log",
            "-NoSound",
            "-windowed",
            "-ResX=1280",
            "-ResY=720",
            "-abslog=$log"
          ) -WorkingDirectory (Split-Path $inner) -PassThru

          Start-Sleep -Seconds 10
          $alive = -not $proc.HasExited
          if ($alive) {
            Stop-Process -Id $proc.Id -Force
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path $log)) { throw "Packaged smoke log missing." }

          $map = @(Select-String -Path $log -Pattern 'UEngine::LoadMap Load map complete /Game/Dev/Maps/L_PinkCab_ChaosWeave')
          $critical = @(Select-String -Path $log -Pattern '(?i)Fatal error:|Assertion failed|Ensure condition failed|Unhandled Exception|Log[A-Za-z0-9_]+: Error:')
          if (-not $alive -or $map.Count -eq 0 -or $critical.Count -gt 0) {
            throw "Packaged smoke failed: alive=$alive map=$($map.Count) critical=$($critical.Count)"
          }
          "alive=$alive; map=$($map.Count); critical=0" | Set-Content "Saved\G1HInp\PACKAGED_SMOKE_SUMMARY.txt"
          Write-Host "H-INP packaged smoke PASS"

      - name: Immutable H-INP delivery + human gate shortcut
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0,7)
          $gateName = "G1_HINP_$short" + "_RUN" + $env:GITHUB_RUN_ID + "_A" + $env:GITHUB_RUN_ATTEMPT
          $gateRoot = Join-Path $env:GATE_ROOT_BASE $gateName
          if (Test-Path $gateRoot) { throw "Immutable H-INP path already exists: $gateRoot" }

          New-Item -ItemType Directory -Force -Path $gateRoot | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "Artifacts\Package\*") -Destination $gateRoot -Recurse -Force

          $evidence = Join-Path $gateRoot "_evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Copy-Item -Path "Saved\G1HInp\*" -Destination $evidence -Recurse -Force
          Copy-Item -Path "Saved\Reports\code-health.json" -Destination $evidence -Force

          Set-Content (Join-Path $gateRoot "BUILD_SHA.txt") $sha -NoNewline
          $outer = Join-Path $gateRoot "Windows\PinkCab.exe"
          if (-not (Test-Path $outer)) { throw "Delivered H-INP exe missing: $outer" }
          $hash = (Get-FileHash -Algorithm SHA256 $outer).Hash

          @(
            "gate=H-INP",
            "auto_status=PASS",
            "auto_progress=7/7",
            "human_status=HUMAN_PENDING",
            "source_sha=$sha",
            "workflow_run_id=$env:GITHUB_RUN_ID",
            "workflow_run_attempt=$env:GITHUB_RUN_ATTEMPT",
            "runner_name=$env:RUNNER_NAME",
            "build_root=$gateRoot",
            "exe=$outer",
            "exe_sha256=$hash",
            "map=/Game/Dev/Maps/L_PinkCab_ChaosWeave"
          ) | Set-Content (Join-Path $gateRoot "GATE_MANIFEST.txt")

          $desktop = [Environment]::GetFolderPath("Desktop")
          $ws = New-Object -ComObject WScript.Shell
          $latest = Join-Path $desktop "PINKCAB Latest.lnk"
          $s = $ws.CreateShortcut($latest)
          $s.TargetPath = $outer
          $s.WorkingDirectory = Join-Path $gateRoot "Windows"
          $s.Description = "PINK CAB G1 H-INP $short - HUMAN PENDING"
          $s.Save()

          Get-ChildItem -LiteralPath $desktop -Filter 'PINKCAB*.lnk' -File | ForEach-Object {
            if ($_.FullName -ne $latest) {
              Remove-Item -LiteralPath $_.FullName -Force
            }
          }
          $remaining = @(Get-ChildItem -LiteralPath $desktop -Filter 'PINKCAB*.lnk' -File)
          if ($remaining.Count -ne 1 -or $remaining[0].Name -ne 'PINKCAB Latest.lnk') {
            throw "Desktop shortcut cleanup failed: $($remaining.Name -join ', ')"
          }

          "GATE_ROOT=$gateRoot" | Set-Content "Saved\G1HInp\GATE_DELIVERY.txt"
          "EXE_SHA256=$hash" | Add-Content "Saved\G1HInp\GATE_DELIVERY.txt"
          Write-Host "H-INP AUTO_VERIFIED 7/7"
          Write-Host "H-INP HUMAN_PENDING"
          Write-Host "H-INP DELIVERY: $gateRoot"
          Write-Host "H-INP EXE SHA256: $hash"

      - name: Upload H-INP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PINKCAB-G1-HINP-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: Saved/G1HInp
          if-no-files-found: warn
          retention-days: 14
