name: PINK CAB G1 H-INP

on:
  push:
    branches:
      - fix/CD-848-hinp-contract
  workflow_dispatch:

concurrency:
  group: pinkcab-g1-hinp
  cancel-in-progress: true

jobs:
  hinp:
    name: H-INP input contract
    runs-on: [self-hosted, Windows, X64, pinkcab, ue58, cheshire, gui]
    timeout-minutes: 180
    env:
      PINKCAB_UE_ROOT: C:\Program Files\Epic Games\UE_5.8

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: fix/CD-848-hinp-contract
          fetch-depth: 0
          lfs: true
          clean: true

      - name: Strict code-health
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          git lfs pull
          & .\scripts\code-health.ps1 -RequireZeroDebt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build PinkCabEditor
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: RMB-only gearbox grip contract
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $editor = Join-Path $env:PINKCAB_UE_ROOT "Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "PinkCab.uproject"
          New-Item -ItemType Directory -Force -Path "Saved\G1HInp" | Out-Null
          $log = Join-Path $env:GITHUB_WORKSPACE "Saved\G1HInp\RMB_ONLY_GEARBOX.log"
          & $editor $project -Multiprocess -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.Cockpit.Input.Compliance.PrimaryPointerGearboxGrip" "-TestExit=Automation Test Queue Empty"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $queue = @(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fail = @(Select-String -Path $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          if ($queue.Count -eq 0 -or $fail.Count -gt 0) { throw "RMB-only gearbox contract failed." }
          Write-Host "RMB-only gearbox contract PASS"


      - name: RED gate - canonical control hints
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $editor = Join-Path $env:PINKCAB_UE_ROOT "Engine\Binaries\Win64\UnrealEditor-Cmd.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "PinkCab.uproject"
          $log = Join-Path $env:GITHUB_WORKSPACE "Saved\G1HInp\CANONICAL_HINTS.log"
          & $editor $project -Multiprocess -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.UI.SystemMenu.CanonicalControlHints" "-TestExit=Automation Test Queue Empty"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $queue = @(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fail = @(Select-String -Path $log -Pattern 'Test Completed\. Result=\{Fail\}|LogAutomationController: Error:')
          if ($queue.Count -eq 0 -or $fail.Count -gt 0) { throw "Canonical control hints contract failed." }
          Write-Host "Canonical control hints PASS"

      - name: RED gate - H-INP direction and dosing
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference = "Stop"
          $editor = Join-Path $env:PINKCAB_UE_ROOT "Engine\\Binaries\\Win64\\UnrealEditor-Cmd.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "PinkCab.uproject"
          $log = Join-Path $env:GITHUB_WORKSPACE "Saved\\G1HInp\\DIRECTION_DOSING.log"
          & $editor $project -Multiprocess -unattended -NullRHI -nosplash -nopause -NoSound -stdout -FullStdOutLogOutput "-abslog=$log" "-ExecCmds=Automation RunTests PinkCab.G1.HInp" "-TestExit=Automation Test Queue Empty"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $queue = @(Select-String -Path $log -Pattern 'Automation Test Queue Empty [0-9]+ tests performed')
          $fail = @(Select-String -Path $log -Pattern 'Test Completed\\. Result=\\{Fail\\}|LogAutomationController: Error:')
          if ($queue.Count -eq 0 -or $fail.Count -gt 0) { throw "H-INP direction/dosing contract failed." }
          Write-Host "H-INP direction/dosing PASS"

      - name: Upload H-INP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PINKCAB-G1-HINP-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: Saved/G1HInp
          if-no-files-found: warn
          retention-days: 14
