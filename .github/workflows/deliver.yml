name: PINK CAB Deliver

on:
  workflow_dispatch:
    inputs:
      launch:
        description: Launch delivered build on the PINKCAB machine
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pinkcab-deliver
  cancel-in-progress: false

jobs:
  deliver:
    name: Exact-head package, smoke, PINCKCAB handoff
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Verify and deliver
        shell: pwsh
        run: |
          $launch = '${{ inputs.launch }}' -eq 'true'
          .\scripts\deliver.ps1 -ExpectedHead '${{ github.sha }}' -Launch:$launch
