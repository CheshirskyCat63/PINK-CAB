name: CD-869 R2 MetaRoad CurbCut API snapshot
on:
  push:
    branches: [feat/CD-869-r2-median-separators]
    paths: [.github/workflows/cd869-r2-curbcut-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, pinkcab]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          clean: false
      - name: Snapshot curb-cut API
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}'
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:GITHUB_WORKSPACE
          $root=(Get-ChildItem 'C:\Program Files\Epic Games\UE_5.8\Engine\Plugins\Marketplace' -Recurse -Filter MetaRoad.uplugin -File | Select-Object -First 1).Directory.FullName
          if(-not $root){ throw 'METAROAD_NOT_FOUND' }
          $out='docs\audits\CD869_R2_CURBCUT_API.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
          Set-Content $out ('root=' + $root)
          $matches=@(Get-ChildItem (Join-Path $root 'Source') -Recurse -File -Include *.h,*.cpp | Select-String -Pattern 'FRoadLaneAttributeCurbCutValue|CurbCut' -List)
          foreach($m in $matches){
            $p=$m.Path
            Add-Content $out ""
            Add-Content $out ("=== " + $p.Substring($root.Length+1) + " ===")
            $a=Get-Content $p
            for($i=1;$i -le $a.Count;$i++){
              if($a[$i-1] -match 'FRoadLaneAttributeCurbCutValue|CurbCut|Attribute'){
                $from=[Math]::Max(1,$i-20); $to=[Math]::Min($a.Count,$i+80)
                for($j=$from;$j -le $to;$j++){ Add-Content $out ("{0}: {1}" -f $j,$a[$j-1]) }
                Add-Content $out "---"
              }
            }
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $out
          if(-not (git diff --cached --quiet)){
            git commit -m 'audit(CD-869): snapshot MetaRoad curb-cut API'
            git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
          }
