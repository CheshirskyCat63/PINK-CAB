name: CD-869 R2 one-shot cancel stale runs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cd869-r2-one-shot-cancel-stale.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List self-hosted runner state
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const res = await github.request('GET /repos/{owner}/{repo}/actions/runners', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              for (const r of res.data.runners || []) {
                core.info('RUNNER id=' + r.id + ' name=' + r.name + ' os=' + r.os + ' status=' + r.status + ' busy=' + r.busy);
              }
            } catch (e) {
              core.warning('runner inventory failed: ' + e.message);
            }

      - name: Cancel stale R2 attempts
        uses: actions/github-script@v7
        with:
          script: |
            const stale = [36063421056];
            for (const run_id of stale) {
              try {
                const run = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id
                });
                core.info('run=' + run_id + ' status=' + run.data.status + ' conclusion=' + run.data.conclusion);
                if (run.data.status !== 'completed') {
                  try {
                    await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id
                    });
                    core.info('force-cancelled=' + run_id);
                  } catch (forceError) {
                    core.warning('force-cancel failed for ' + run_id + ': ' + forceError.message);
                    await github.rest.actions.cancelWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id
                    });
                    core.info('cancelled=' + run_id);
                  }
                }
              } catch (e) {
                core.warning('cancel stale run ' + run_id + ': ' + e.message);
              }
            }
